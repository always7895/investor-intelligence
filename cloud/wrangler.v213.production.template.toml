name = "investor-intelligence-v21-owner-line"
main = "src/v213/production-worker.ts"
compatibility_date = "2026-08-29"
workers_dev = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
MEMORY_FEATURE_AVAILABLE = "false"
GENERAL_QA_ENABLED = "true"
# Request-only non-thinking mode; the user's Router preset remains unchanged.
V213_COMPACT_QA_ENABLED = "true"
CURRENT_PUBLIC_DATA_ENABLED = "true"
PUBLIC_DATA_MAX_AGE_SECONDS = "7200"
OPTION_DATA_MAX_AGE_SECONDS = "1800"
MAX_REQUESTS_PER_MINUTE = "12"
MAX_WEBHOOK_AGE_SECONDS = "600"
V21_MAX_WEBHOOK_BODY_BYTES = "262144"
V21_MAX_SYNC_BODY_BYTES = "5000000"
V21_MAX_SYNC_AGE_SECONDS = "300"
V21_TOP20_MAX_AGE_SECONDS = "7200"
V21_OWNER_PAIRING_ENABLED = "true"
V21_SCHEDULED_PUSH_ENABLED = "false"
# One Production writer (hourly sealed publisher): signed activation commits are refused unless "true".
V213_ACTIVATION_COMMIT_ENABLED = "false"
V213_FIELD_LOCALE = "bilingual"
# LINE access: only the exact value "all_friends" opens public features and local-model Q&A to every direct-chat friend;
# anything else (missing, empty, wrong case) is owner-only. Ships "owner_only": enabling is a separate, operator-authorized
# rollout (docs/LINE_ALL_FRIENDS_ACCESS.md, docs/OPERATOR_RUNBOOK.md section 8). Rollback = set it back and redeploy config.
V213_LINE_ACCESS_MODE = "owner_only"
# Friend model lane (used only in all_friends mode). GLOBAL_INFLIGHT is coupled to the gateway's
# II_GATEWAY_MAX_CONCURRENT_GENERATIONS (default 1): keep it <= that value, and leave one gateway slot for the owner.
V213_FRIEND_QA_GLOBAL_INFLIGHT = "1"
V213_FRIEND_QA_QUEUE_MAX = "2"
V213_FRIEND_QA_ACQUIRE_WAIT_MS = "5000"
# Friend slow-job KV writes per Taipei day (two per parked job). Over the cap: busy reply, no parked job.
V213_FRIEND_JOB_WRITES_PER_DAY = "150"
# FREE relay keeps workers.dev as the stable entrypoint and leases only a
# validated ephemeral TryCloudflare route. No custom domain is required.
FREE_RELAY_ENABLED = "true"
FREE_RELAY_MAX_TTL_SECONDS = "300"
LOCAL_LLM_MODEL = "qwen38-q6"
# Operator 2026-09-26: follow the model named in the HMAC-authenticated free-relay route (auto-detected locally).
LOCAL_LLM_MODEL_FROM_ROUTE = "true"

[[kv_namespaces]]
binding = "PUBLIC_CACHE"
id = "__V21_PUBLIC_CACHE_ID__"

[[kv_namespaces]]
binding = "TENANT_PRIVATE_CACHE"
id = "__V21_TENANT_PRIVATE_CACHE_ID__"

[[kv_namespaces]]
binding = "EPHEMERAL_SECURITY_CACHE"
id = "__V21_EPHEMERAL_SECURITY_CACHE_ID__"

[triggers]
crons = ["0 0 * * *", "0 13 * * *"]

[observability]
enabled = false

[[durable_objects.bindings]]
name = "V213_BROADCAST_DEDUPE"
class_name = "V213BroadcastDedupe"

[[durable_objects.bindings]]
name = "V213_FREE_RELAY_ROUTE"
class_name = "V213FreeRelayRoute"

[[durable_objects.bindings]]
name = "V213_FRIEND_QA_GATE"
class_name = "V213FriendQaGate"

[[migrations]]
tag = "v213-r75-broadcast-dedupe-v1"
new_sqlite_classes = ["V213BroadcastDedupe"]

[[migrations]]
tag = "v213-r75-free-relay-route-v1"
new_sqlite_classes = ["V213FreeRelayRoute"]

[[migrations]]
tag = "v213-friend-qa-gate-v1"
new_sqlite_classes = ["V213FriendQaGate"]
