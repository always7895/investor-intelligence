name = "investor-intelligence-v21-owner-line"
main = "src/v21/worker.ts"
compatibility_date = "2026-08-29"
workers_dev = true

[vars]
MEMORY_FEATURE_AVAILABLE = "false"
GENERAL_QA_ENABLED = "true"
CURRENT_PUBLIC_DATA_ENABLED = "true"
PUBLIC_DATA_MAX_AGE_SECONDS = "7200"
OPTION_DATA_MAX_AGE_SECONDS = "1800"
MAX_REQUESTS_PER_MINUTE = "12"
MAX_WEBHOOK_AGE_SECONDS = "600"
V21_MAX_WEBHOOK_BODY_BYTES = "262144"
V21_MAX_SYNC_BODY_BYTES = "5000000"
V21_MAX_SYNC_AGE_SECONDS = "300"
V21_TOP20_MAX_AGE_SECONDS = "7200"
V21_OWNER_PAIRING_ENABLED = "true"
V21_SCHEDULED_PUSH_ENABLED = "true"

[[kv_namespaces]]
binding = "PUBLIC_CACHE"
id = "__V21_PUBLIC_CACHE_ID__"

[[kv_namespaces]]
binding = "TENANT_PRIVATE_CACHE"
id = "__V21_TENANT_PRIVATE_CACHE_ID__"

[[kv_namespaces]]
binding = "EPHEMERAL_SECURITY_CACHE"
id = "__V21_EPHEMERAL_SECURITY_CACHE_ID__"

[triggers]
crons = ["0 0 * * *", "0 13 * * *"]

[observability]
enabled = false

[[durable_objects.bindings]]
name = "V213_BROADCAST_DEDUPE"
class_name = "V213BroadcastDedupe"

[[migrations]]
tag = "v213-r75-broadcast-dedupe-v1"
new_sqlite_classes = ["V213BroadcastDedupe"]
