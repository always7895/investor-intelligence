name: V2.1.3 Final Serenity Delivery R2

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-final-serenity-delivery-r2.yml
      - scripts/v213_source_independence_gate_v3.py
      - scripts/v213_source_independence_gate_v4.py
      - scripts/v213_methodology_and_source_audit.py
      - scripts/audit_v213_serenity_release_v6.ps1
      - scripts/audit_v213_generated_snapshot_v4.ps1
      - scripts/audit_v213_serenity_scoring_logic.ps1
      - scripts/ci_v213_hotfix6_validate.ps1
      - scripts/ci_v213_hotfix6_package.ps1
      - config/v213-serenity-evidence-freshness-policy.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-intelligence-v213-final-serenity-delivery-r2
  cancel-in-progress: false

jobs:
  qualify-package-deliver:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      SOURCE_DIR: ${{ github.workspace }}\final-serenity-r2-${{ github.run_id }}

    steps:
      - name: Checkout exact target commit into isolated directory
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: final-serenity-r2-${{ github.run_id }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Resolve immutable effective source commit
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $effective = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $effective -ne '${{ github.sha }}'.ToLowerInvariant()) {
            throw "Immutable checkout mismatch; expected=${{ github.sha }} actual=$effective"
          }
          if ((git status --porcelain)) { throw 'Qualification checkout is not clean.' }
          "EFFECTIVE_SHA=$effective" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "V213_EFFECTIVE_SOURCE_COMMIT = $effective" -ForegroundColor Cyan

      - name: Audit static Serenity, source-diversity and latest-data contract
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $env:GITHUB_SHA = $env:EFFECTIVE_SHA
          $audit = Join-Path $env:RUNNER_TEMP "Investor-Intelligence-v2.1.3-Serenity-Static-Audit-R2-$env:GITHUB_RUN_ID.json"
          .\scripts\audit_v213_serenity_release_v6.ps1 -ProjectRoot $PWD.Path -OutputPath $audit
          $receipt = Get-Content -LiteralPath $audit -Raw -Encoding utf8 | ConvertFrom-Json
          if ($receipt.status -ne 'PASS') { throw 'Static Serenity audit is not PASS.' }
          "SERENITY_STATIC_AUDIT=$audit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run complete Windows no-mutation qualification
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $env:GITHUB_SHA = $env:EFFECTIVE_SHA
          .\scripts\ci_v213_hotfix6_validate.ps1 -ProjectRoot $PWD.Path

      - name: Audit exact generated snapshot and source freshness
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $env:GITHUB_SHA = $env:EFFECTIVE_SHA
          $audit = Join-Path $env:RUNNER_TEMP "Investor-Intelligence-v2.1.3-Generated-Snapshot-Audit-R2-$env:GITHUB_RUN_ID.json"
          .\scripts\audit_v213_generated_snapshot_v4.ps1 -ProjectRoot $PWD.Path -OutputPath $audit
          $receipt = Get-Content -LiteralPath $audit -Raw -Encoding utf8 | ConvertFrom-Json
          if ($receipt.status -ne 'PASS') { throw 'Generated snapshot audit is not PASS.' }
          "SERENITY_SNAPSHOT_AUDIT=$audit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Audit Serenity factor causality and thesis-killer precedence
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $env:GITHUB_SHA = $env:EFFECTIVE_SHA
          $audit = Join-Path $env:RUNNER_TEMP "Investor-Intelligence-v2.1.3-Serenity-Scoring-Audit-R2-$env:GITHUB_RUN_ID.json"
          .\scripts\audit_v213_serenity_scoring_logic.ps1 -ProjectRoot $PWD.Path -OutputPath $audit
          $receipt = Get-Content -LiteralPath $audit -Raw -Encoding utf8 | ConvertFrom-Json
          if ($receipt.status -ne 'PASS') { throw 'Serenity scoring audit is not PASS.' }
          "SERENITY_SCORING_AUDIT=$audit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SERENITY_FACTOR_BINDING_COMPLETE_COUNT=$([int]$receipt.explicit_factor_to_evidence_binding.complete_ticker_count)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile, package and independently verify final build
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $env:GITHUB_SHA = $env:EFFECTIVE_SHA
          .\scripts\ci_v213_hotfix6_package.ps1 -ProjectRoot $PWD.Path

      - name: Verify delivery receipts and ZIP digest
        shell: pwsh
        run: |
          foreach ($path in @(
            $env:HF6_ZIP,
            $env:HF6_SHA_FILE,
            $env:HF6_VERIFICATION,
            $env:HF6_VALIDATION,
            $env:SERENITY_STATIC_AUDIT,
            $env:SERENITY_SNAPSHOT_AUDIT,
            $env:SERENITY_SCORING_AUDIT
          )) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Final delivery file is missing: $path"
            }
          }
          $expected = (Get-Content -LiteralPath $env:HF6_SHA_FILE -Raw -Encoding ascii).Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $env:HF6_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual -or $actual -ne $env:HF6_SHA.ToLowerInvariant()) {
            throw "Final ZIP digest mismatch; expected=$expected actual=$actual env=$env:HF6_SHA"
          }
          foreach ($receiptPath in @(
            $env:HF6_VERIFICATION,
            $env:HF6_VALIDATION,
            $env:SERENITY_STATIC_AUDIT,
            $env:SERENITY_SNAPSHOT_AUDIT,
            $env:SERENITY_SCORING_AUDIT
          )) {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw -Encoding utf8 | ConvertFrom-Json
            if ($receipt.status -ne 'PASS') { throw "Non-PASS delivery receipt: $receiptPath" }
          }
          Write-Host "V213_FINAL_SERENITY_DELIVERY_R2 = PASS; commit=$env:EFFECTIVE_SHA; sha256=$actual" -ForegroundColor Green

      - name: Upload final audited delivery
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Investor-Intelligence-v2.1.3-Final-Serenity-Delivery-R2
          path: |
            ${{ env.HF6_ZIP }}
            ${{ env.HF6_SHA_FILE }}
            ${{ env.HF6_VERIFICATION }}
            ${{ env.HF6_VALIDATION }}
            ${{ env.SERENITY_STATIC_AUDIT }}
            ${{ env.SERENITY_SNAPSHOT_AUDIT }}
            ${{ env.SERENITY_SCORING_AUDIT }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          @"
          ## v2.1.3 Final Serenity Delivery R2
          - Commit: ``$env:EFFECTIVE_SHA``
          - Artifact ID: ``$env:ARTIFACT_ID``
          - Artifact: $env:ARTIFACT_URL
          - Static methodology and source-diversity audit: PASS
          - Real Windows no-mutation qualification: PASS
          - Generated snapshot/latest-data audit: PASS
          - Serenity scoring/thesis-killer audit: PASS
          - Package/runtime/manifest verification: PASS
          - Production mutation: false
          - Exact factor-to-source binding complete rows: $env:SERENITY_FACTOR_BINDING_COMPLETE_COUNT/20
          - ZIP SHA-256: ``$env:HF6_SHA``
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
