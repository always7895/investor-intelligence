name: V2.1.3 Activation Mode + Gateway Fix2 Validation R2

on:
  push:
    branches:
      - validation/v213-activation-mode-gateway-fix2
    paths:
      - .github/workflows/v213-activation-mode-gateway-fix2-validation-r2.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: investor-intelligence-v213-activation-mode-gateway-fix2-validation-r2
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      VALIDATION_BRANCH: validation/v213-activation-mode-gateway-fix2
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Reconstruct and apply byte-locked Fix2 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config core.autocrlf false
          git checkout-index --force --all

          $parts = @(
            '.github\patches\v213-fix2.part-01.b64',
            '.github\patches\v213-fix2.part-02.b64',
            '.github\patches\v213-fix2.part-03.b64',
            '.github\patches\v213-fix2.part-04.b64',
            '.github\patches\v213-fix2.part-05.b64',
            '.github\patches\v213-fix2.part-06.b64'
          )
          $builder = [Text.StringBuilder]::new()
          foreach ($relative in $parts) {
            $path = Join-Path $PWD.Path $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing patch part: $relative" }
            $text = [IO.File]::ReadAllText($path)
            [void]$builder.Append(($text -replace '\s',''))
          }
          $base64 = $builder.ToString()
          if ($base64.Length -ne 26472) { throw "Patch Base64 length mismatch: $($base64.Length)" }
          $asciiSha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($base64))).ToLowerInvariant()
          if ($asciiSha -ne '01fbfd7f66c3261ee63e8298f17abf2b72d2f73b6705d2eb10a6f586a73c0ec6') { throw "Patch Base64 SHA-256 mismatch: $asciiSha" }

          $gzipPath = Join-Path $env:RUNNER_TEMP 'v213-activation-mode-gateway-fix2.patch.gz'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($base64))
          $actualGzipSha = (Get-FileHash -LiteralPath $gzipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualGzipSha -ne '71091c2d6d8631e394fbc93125a374fa6a544e11c9f248da68ff89ed8ffe3786') { throw "Patch gzip SHA-256 mismatch: $actualGzipSha" }

          $patchPath = Join-Path $env:RUNNER_TEMP 'v213-activation-mode-gateway-fix2.patch'
          $source = [IO.File]::OpenRead($gzipPath)
          try {
            $gzip = [IO.Compression.GzipStream]::new($source, [IO.Compression.CompressionMode]::Decompress)
            try {
              $target = [IO.File]::Create($patchPath)
              try { $gzip.CopyTo($target) } finally { $target.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $source.Dispose() }
          $actualPatchSha = (Get-FileHash -LiteralPath $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualPatchSha -ne '91d8966c1583c7eb676c3c726e538c09367246626d083ffed5075b95338856c0') { throw "Expanded patch SHA-256 mismatch: $actualPatchSha" }

          git apply --check --whitespace=error $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Fix2 patch preflight failed.' }
          git apply --whitespace=error $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Fix2 patch application failed.' }

          $expectedFiles = @(
            'activate-v213-seven-field-schedule.ps1',
            'activate-v213-seven-field-schedule-serenity-latest.ps1',
            'cloud/src/v213/activation-v2.ts',
            'cloud/test/v213-activation.test.ts',
            'scripts/ci_v213_r70_package.ps1',
            'scripts/ci_v213_r70_validate.ps1',
            'scripts/run_v213_local_llm_bridge_core.ps1',
            'scripts/v213_optional_bls_alignment_audit.py',
            'scripts/v213_serenity_latest_static_audit.py'
          ) | Sort-Object
          $changed = @(git diff --name-only -- | ForEach-Object { ([string]$_).Trim().Replace('\','/') } | Where-Object { $_ } | Sort-Object)
          $delta = @(Compare-Object -ReferenceObject $expectedFiles -DifferenceObject $changed)
          if ($delta.Count -ne 0) {
            Write-Host ('EXPECTED=' + ($expectedFiles -join ','))
            Write-Host ('CHANGED=' + ($changed -join ','))
            throw 'Fix2 patch changed an unexpected source scope.'
          }

          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          foreach ($relative in $expectedFiles) {
            $path = Join-Path $PWD.Path $relative
            $value = [IO.File]::ReadAllText($path).Replace("`r`n", "`n").Replace("`r", "`n")
            [IO.File]::WriteAllText($path, $value, $utf8NoBom)
          }
          $expectedHashes = [ordered]@{
            'activate-v213-seven-field-schedule.ps1' = '935561ce912bf1557c4c51c7a2cbc90b94b183f53486400077bb4470a8868de6'
            'activate-v213-seven-field-schedule-serenity-latest.ps1' = '935561ce912bf1557c4c51c7a2cbc90b94b183f53486400077bb4470a8868de6'
            'cloud/src/v213/activation-v2.ts' = '66a2b70e08bb4cf4fe3344f63eb1c47f1b0d20e89d3e34fb016001a06c252f2b'
            'cloud/test/v213-activation.test.ts' = 'c58c09944d9b07aca1ed995e1af52b6aacbd6f76a8c776ae7733d99e348af750'
            'scripts/ci_v213_r70_package.ps1' = '93336de2d8d84ed5922284b1c71c20a78069b64f392bcf3f79e837c64084af8b'
            'scripts/ci_v213_r70_validate.ps1' = '4ad3c22a70f03973e7b33a2ec3859f00938e6b2c0ce93274386ebd8698b4ab6f'
            'scripts/run_v213_local_llm_bridge_core.ps1' = '00c5b3d189c39cec6913b43109d897eb21d4f31a2f5c0454481deec3f6aa1583'
            'scripts/v213_optional_bls_alignment_audit.py' = '77eda012438ac89fa1a4b0b3339c7e4ac9b77dba40f86928be859aff000a2509'
            'scripts/v213_serenity_latest_static_audit.py' = '789792a1880138b236f752c0abc1da429d1c7e471cc638a65407c44726dafe76'
          }
          foreach ($entry in $expectedHashes.GetEnumerator()) {
            $actual = (Get-FileHash -LiteralPath (Join-Path $PWD.Path $entry.Key) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "$($entry.Key) SHA-256 mismatch: $actual" }
          }
          Write-Host 'V213_FIX2_PATCH = PASS; changed_files=9; byte_locked=true; transport=base64-parts'

      - name: Run complete Windows no-mutation validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\ci_v213_r70_validate.ps1 -ProjectRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'Complete R70 Fix2 Windows validation failed.' }
          Write-Host 'V213_FIX2_WINDOWS_VALIDATION = PASS; production_mutation=false'

      - name: Commit validated source-only fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temporary = @(
            '.github/workflows/v213-activation-mode-gateway-fix2-validation-r2.yml',
            '.github/patches/v213-fix2.part-01.b64',
            '.github/patches/v213-fix2.part-02.b64',
            '.github/patches/v213-fix2.part-03.b64',
            '.github/patches/v213-fix2.part-04.b64',
            '.github/patches/v213-fix2.part-05.b64',
            '.github/patches/v213-fix2.part-06.b64'
          )
          foreach ($path in $temporary) { Remove-Item -LiteralPath $path -Force }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $sourceFiles = @(
            'activate-v213-seven-field-schedule.ps1',
            'activate-v213-seven-field-schedule-serenity-latest.ps1',
            'cloud/src/v213/activation-v2.ts',
            'cloud/test/v213-activation.test.ts',
            'scripts/ci_v213_r70_package.ps1',
            'scripts/ci_v213_r70_validate.ps1',
            'scripts/run_v213_local_llm_bridge_core.ps1',
            'scripts/v213_optional_bls_alignment_audit.py',
            'scripts/v213_serenity_latest_static_audit.py'
          )
          git add -- $sourceFiles
          git add -u -- $temporary
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Validated Fix2 source contains whitespace errors.' }
          $staged = @(git diff --cached --name-only -- | ForEach-Object { ([string]$_).Trim().Replace('\','/') } | Where-Object { $_ } | Sort-Object)
          $expected = @($sourceFiles + $temporary | Sort-Object)
          $delta = @(Compare-Object -ReferenceObject $expected -DifferenceObject $staged)
          if ($delta.Count -ne 0) {
            Write-Host ('EXPECTED_STAGED=' + ($expected -join ','))
            Write-Host ('ACTUAL_STAGED=' + ($staged -join ','))
            throw 'Validated Fix2 commit scope is unexpected.'
          }
          git commit -m 'fix: align activation publication modes and gateway paths'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit validated Fix2 source.' }
          git push origin HEAD:$env:VALIDATION_BRANCH
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push validated Fix2 source branch.' }
          Write-Host 'V213_FIX2_VALIDATED_SOURCE_COMMIT = PASS'
