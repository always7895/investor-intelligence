name: V2.1.3 Final Serenity Multi-Source Audited Delivery

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-final-serenity-multisource-audited-delivery.yml
      - config/v213-serenity-evidence-freshness-policy.json
      - config/v213-serenity-public-logic-policy.json
      - config/v213-market-corroboration-degradation-policy.json
      - scripts/audit_v213_serenity_release_v2.ps1
      - scripts/audit_v213_serenity_release_v3.ps1
      - scripts/audit_v213_generated_snapshot_v2.ps1
      - scripts/audit_v213_generated_snapshot_v3.ps1
      - scripts/build_v213_activation_bundle.py
      - scripts/build_v213_activation_bundle_v2.py
      - scripts/v213_source_independence_gate.py
      - scripts/v213_source_independence_gate_v2.py
      - scripts/v213_source_independence_gate_v3.py
      - scripts/test_v213_activation_core.ps1
      - scripts/ci_v213_hotfix6_validate.ps1
      - scripts/ci_v213_hotfix6_package.ps1
      - activate-v213-seven-field-schedule-core.ps1
      - sync-v213-activation-bundle.ps1
      - cloud/src/v213/activation-v2.ts
      - cloud/test/v213-activation.test.ts
      - docs/V213_SERENITY_LOGIC_SOURCE_DIVERSITY_AUDIT.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-intelligence-v213-serenity-freshness-audited-delivery
  cancel-in-progress: true

jobs:
  final-audited-delivery:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      SOURCE_DIR: ${{ github.workspace }}\final-serenity-audited-${{ github.run_id }}

    steps:
      - name: Checkout exact source into isolated directory
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: final-serenity-audited-${{ github.run_id }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Audit static Serenity and source-independence contract
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $audit = Join-Path $env:RUNNER_TEMP "Investor-Intelligence-v2.1.3-Serenity-Static-Audit-$env:GITHUB_RUN_ID.json"
          .\scripts\audit_v213_serenity_release_v3.ps1 -ProjectRoot $PWD.Path -OutputPath $audit
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $audit -PathType Leaf)) {
            throw 'Static Serenity/source-independence audit did not produce a PASS receipt.'
          }
          $receipt = Get-Content -LiteralPath $audit -Raw -Encoding utf8 | ConvertFrom-Json
          if ($receipt.status -ne 'PASS') { throw 'Static audit receipt is not PASS.' }
          "SERENITY_STATIC_AUDIT=$audit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run complete Windows no-mutation qualification
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          .\scripts\ci_v213_hotfix6_validate.ps1 -ProjectRoot $PWD.Path

      - name: Audit exact generated seven-payload snapshot
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $audit = Join-Path $env:RUNNER_TEMP "Investor-Intelligence-v2.1.3-Generated-Snapshot-Audit-$env:GITHUB_RUN_ID.json"
          .\scripts\audit_v213_generated_snapshot_v3.ps1 -ProjectRoot $PWD.Path -OutputPath $audit
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $audit -PathType Leaf)) {
            throw 'Generated snapshot audit did not produce a PASS receipt.'
          }
          $receipt = Get-Content -LiteralPath $audit -Raw -Encoding utf8 | ConvertFrom-Json
          if ($receipt.status -ne 'PASS') { throw 'Generated snapshot audit receipt is not PASS.' }
          "SERENITY_SNAPSHOT_AUDIT=$audit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile, package and independently verify final audited Hotfix6
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          .\scripts\ci_v213_hotfix6_package.ps1 -ProjectRoot $PWD.Path

      - name: Verify delivery files and hashes before upload
        shell: pwsh
        run: |
          foreach ($path in @($env:HF6_ZIP,$env:HF6_SHA_FILE,$env:HF6_VERIFICATION,$env:HF6_VALIDATION,$env:SERENITY_STATIC_AUDIT,$env:SERENITY_SNAPSHOT_AUDIT)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Final delivery file is missing: $path"
            }
          }
          $expected = (Get-Content -LiteralPath $env:HF6_SHA_FILE -Raw -Encoding ascii).Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $env:HF6_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual -or $actual -ne $env:HF6_SHA.ToLowerInvariant()) {
            throw "Final ZIP digest mismatch; expected=$expected actual=$actual env=$env:HF6_SHA"
          }
          Write-Host "V213_FINAL_DELIVERY_HASH = PASS; sha256=$actual" -ForegroundColor Green

      - name: Upload final Serenity multi-source audited delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Investor-Intelligence-v2.1.3-Hotfix6-Final-Serenity-MultiSource-Audited-Delivery
          path: |
            ${{ env.HF6_ZIP }}
            ${{ env.HF6_SHA_FILE }}
            ${{ env.HF6_VERIFICATION }}
            ${{ env.HF6_VALIDATION }}
            ${{ env.SERENITY_STATIC_AUDIT }}
            ${{ env.SERENITY_SNAPSHOT_AUDIT }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## v2.1.3 Final Serenity Multi-Source Audited Delivery
          - Public-source reconstruction only; no private/official Serenity formula claim: PASS
          - Quantitative shortcuts cannot prove bottleneck, replacement friction or TAM capture: PASS
          - Exact seven payload SHA-256 verification and identical Top20 order: PASS
          - Every ticker has at least two independent claim-source families/domains: PASS
          - Every ticker has qualifying primary and dated claim evidence: PASS
          - Positive Serenity advantages require fresh multi-source support: PASS
          - Same publisher/domain/syndicated copies do not multiply independence: PASS
          - Yahoo role is compatibility calculation only, never authoritative corroboration: PASS
          - High-confidence market inference requires two independent fresh providers: PASS
          - Independent provider conflicts are evaluated pairwise: PASS
          - Source conflicts are retained and never averaged: PASS
          - Stale LIVE/CACHED market observations: 0
          - Unresolved pairwise conflicts: 0
          - Unresolved compatibility-calculation divergences: 0
          - Uncorroborated valuation factor capped at 3.75: PASS
          - Atomic pointer-last commit, idempotent replay and exact rollback: PASS
          - Real Windows no-mutation qualification and packaged runtime verification: PASS
          - Production mutation by CI: false
          - ZIP SHA-256: ``$env:HF6_SHA``
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
