name: V2.1.3 Optional BLS Direct Source Hotfix R2

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-optional-bls-direct-source-hotfix-r2.yml

permissions:
  contents: write

concurrency:
  group: investor-intelligence-v213-optional-bls-direct-source-hotfix-r2
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: development/v2.1.3-serenity-public-logic-fidelity
          fetch-depth: 0

      - name: Align activation wrappers and add regression audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $wrappers = @(
            'activate-v213-seven-field-schedule.ps1',
            'activate-v213-seven-field-schedule-serenity-latest.ps1',
            'activate-v213-diversified-schedule.ps1'
          )
          $old = '$required=@(''us_sec'',''nasdaq'',''world_bank'',''us_bls'',''ecb'')'
          $new = '$required=@(''us_sec'',''nasdaq'',''world_bank'',''ecb'')'
          foreach ($relative in $wrappers) {
            $path = Join-Path $PWD.Path $relative
            $value = [IO.File]::ReadAllText($path)
            if (-not $value.Contains($old) -and -not $value.Contains($new)) {
              throw "$relative does not contain the expected federation required-family declaration."
            }
            $value = $value.Replace($old,$new)
            [IO.File]::WriteAllText($path,$value,$utf8NoBom)
          }
          Copy-Item -LiteralPath $wrappers[0] -Destination $wrappers[1] -Force

          $auditPath = Join-Path $PWD.Path 'scripts/v213_serenity_latest_static_audit.py'
          $audit = [IO.File]::ReadAllText($auditPath)
          $marker = '# OPTIONAL_BLS_ACTIVATION_POLICY_ALIGNMENT_V1'
          if (-not $audit.Contains($marker)) {
            $block = @'
              # OPTIONAL_BLS_ACTIVATION_POLICY_ALIGNMENT_V1
              federation_policy = document("config/v213-source-federation-policy.json")
              live_sources = federation_policy.get("required_live_sources", {})
              bls_entries = [
                  row
                  for row in live_sources.values()
                  if isinstance(row, dict) and row.get("family") == "us_bls"
              ]
              if len(bls_entries) != 1:
                  failures.append("source-federation policy must define exactly one us_bls entry")
              else:
                  bls = bls_entries[0]
                  if bls.get("required") is not False:
                      failures.append("BLS macro context regressed to a required activation source")
                  if bls.get("outage_behavior") != "explicit_quality_degradation_not_company_claim_blocker":
                      failures.append("BLS outage behavior no longer preserves explicit degradation")
                  if bls.get("company_claim_evidence") is not False:
                      failures.append("BLS macro context is incorrectly treated as company-claim evidence")
              if federation_policy.get("temporary_macro_endpoint_unavailability_is_global_blocker") is not False:
                  failures.append("temporary macro endpoint outage is incorrectly a global blocker")
              if federation_policy.get("macro_context_is_company_claim_evidence") is not False:
                  failures.append("macro context is incorrectly treated as company-claim evidence")
              activation_gate = federation_policy.get("activation_gate", {})
              if int(activation_gate.get("minimum_successful_official_families", 0)) < 4:
                  failures.append("activation requires fewer than four successful official families")
              if activation_gate.get("temporary_macro_context_outage_is_quality_degradation") is not True:
                  failures.append("temporary macro outage is not explicitly a quality degradation")

              stale_required = "$required=@('us_sec','nasdaq','world_bank','us_bls','ecb')".casefold()
              current_required = "$required=@('us_sec','nasdaq','world_bank','ecb')".casefold()
              activation_thresholds = (
                  "$successful.count-lt5",
                  "$official.count-lt4",
                  "$missingrequired.count-gt0",
              )
              for wrapper in (
                  "activate-v213-seven-field-schedule.ps1",
                  "activate-v213-seven-field-schedule-serenity-latest.ps1",
                  "activate-v213-diversified-schedule.ps1",
              ):
                  compact = "".join(text(wrapper).split()).casefold()
                  if stale_required in compact:
                      failures.append(f"{wrapper} still hard-requires optional BLS")
                  if current_required not in compact:
                      failures.append(f"{wrapper} lacks the policy-aligned core required families")
                  for threshold in activation_thresholds:
                      if threshold not in compact:
                          failures.append(f"{wrapper} lost activation threshold: {threshold}")
          '@
            $needle = "`n    if failures:`n"
            $index = $audit.LastIndexOf($needle,[StringComparison]::Ordinal)
            if ($index -lt 0) { throw 'Static audit final failure block was not found.' }
            $audit = $audit.Substring(0,$index) + "`n" + $block.TrimEnd() + $audit.Substring($index)
            [IO.File]::WriteAllText($auditPath,$audit,$utf8NoBom)
          }

      - name: Run focused Windows regression gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonCandidates = @(
            'C:\Users\moon9\AppData\Local\Programs\Python\Python313\python.exe',
            'C:\Users\moon9\AppData\Local\Programs\Python\Python312\python.exe',
            'C:\Program Files\Python313\python.exe',
            'C:\Program Files\Python312\python.exe'
          )
          $pythonCommand = Get-Command python -ErrorAction SilentlyContinue
          if ($pythonCommand) { $pythonCandidates = @($pythonCommand.Source) + $pythonCandidates }
          $pythonCandidates += @(Get-ChildItem -Path 'C:\Users\*\AppData\Local\Programs\Python\Python*\python.exe' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          $python = $pythonCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (-not $python) { throw 'No validated Python executable was found on the Windows runner.' }
          Write-Host "PROJECT_PYTHON = $python"
          & $python scripts/v213_serenity_latest_static_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'Serenity latest static audit failed.' }
          & $python scripts/v213_source_federation.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source federation self-test failed.' }
          & $python scripts/v213_source_federation_gate.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source federation gate self-test failed.' }
          foreach ($script in @(
            'activate-v213-seven-field-schedule.ps1',
            'activate-v213-seven-field-schedule-serenity-latest.ps1',
            'activate-v213-diversified-schedule.ps1'
          )) {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -ProjectRoot $PWD.Path -SelfTest
            if ($LASTEXITCODE -ne 0) { throw "Activation self-test failed: $script" }
          }
          $canonical = 'activate-v213-seven-field-schedule.ps1'
          $alias = 'activate-v213-seven-field-schedule-serenity-latest.ps1'
          if ((Get-FileHash $canonical -Algorithm SHA256).Hash -ne (Get-FileHash $alias -Algorithm SHA256).Hash) {
            throw 'Canonical activation and compatibility alias are not byte-identical.'
          }
          $old = '$required=@(''us_sec'',''nasdaq'',''world_bank'',''us_bls'',''ecb'')'
          $new = '$required=@(''us_sec'',''nasdaq'',''world_bank'',''ecb'')'
          foreach ($script in @($canonical,$alias,'activate-v213-diversified-schedule.ps1')) {
            $value = Get-Content -LiteralPath $script -Raw -Encoding utf8
            if ($value.Contains($old)) { throw "$script still hard-requires BLS." }
            if (-not $value.Contains($new)) { throw "$script lacks policy-aligned core families." }
          }
          Write-Host 'V213_OPTIONAL_BLS_ALIGNMENT = PASS; bls_required=false; minimum_total_families=5; minimum_official_families=4; canonical_alias_equal=true'

      - name: Commit one validated source fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/workflows/v213-optional-bls-direct-source-hotfix-r2.yml' -Force
          Remove-Item -LiteralPath '.github/workflows/v213-optional-bls-direct-source-hotfix.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath '.github/workflows/v213-optional-bls-policy-alignment-hotfix.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath '.github/patches/v213-optional-bls-policy-alignment.patch' -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Validated source fix contains whitespace errors.' }
          git commit -m 'fix: align activation with optional BLS federation policy'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit optional-BLS source fix.' }
          git pull --rebase origin development/v2.1.3-serenity-public-logic-fidelity
          if ($LASTEXITCODE -ne 0) { throw 'Unable to rebase optional-BLS source fix.' }
          git push origin HEAD:development/v2.1.3-serenity-public-logic-fidelity
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push optional-BLS source fix.' }
