name: Full Candidate History Privacy Inventory

on:
  workflow_dispatch:
  pull_request:
    branches:
      - reconcile/phase3-authoritative-sources-v1
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: full-history-privacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == 'always7895')
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 50
    env:
      DELIVERY_ENABLED: 'false'
      LINE_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      LINE_ACCESS_MODE: 'disabled'
      CURRENT_PUBLIC_DATA_ENABLED: 'false'
      CLOUD_INFERENCE_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      FREE_ONLY_MODE: 'true'
      MEMORY_FEATURE_AVAILABLE: 'false'
      PYTHONUTF8: '1'
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

    steps:
      - name: Check out exact branch or PR head with complete ancestry
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify tested revision identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if (-not $env:TARGET_SHA -or $actual -ne $env:TARGET_SHA) {
            throw "Checked-out revision $actual does not match target $env:TARGET_SHA"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $actual -ne $env:PR_HEAD_SHA) {
            throw "Pull-request inventory must test exact head $env:PR_HEAD_SHA, found $actual"
          }
          $shallow = (git rev-parse --is-shallow-repository).Trim()
          if ($shallow -ne 'false') {
            throw 'Candidate history inventory requires a complete, non-shallow ancestry.'
          }

      - name: Resolve deterministic verified Python
        shell: pwsh
        run: .\scripts\resolve_python.ps1 -VenvPath .venv-full-history-privacy

      - name: Enforce workflow and current-tree boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PROJECT_PYTHON scripts/workflow_supply_chain_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Workflow supply-chain gate failed.' }
          & $env:PROJECT_PYTHON scripts/security_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Current-tree security/privacy gate failed.' }
          & $env:PROJECT_PYTHON -m compileall -q scripts tests
          if ($LASTEXITCODE -ne 0) { throw 'Python compile gate failed.' }
          & $env:PROJECT_PYTHON -m unittest discover -s tests -p 'test_full_history_privacy_scan.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Full-history scanner regressions failed.' }

      - name: Scan complete candidate ancestry without exposing matched content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP "history-privacy-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          Remove-Item -LiteralPath $report -Force -ErrorAction SilentlyContinue
          & $env:PROJECT_PYTHON scripts/full_history_privacy_scan.py --scope head --json-output $report
          if ($LASTEXITCODE -ne 0) { throw 'Full candidate-history inventory did not complete.' }
          if (-not (Test-Path -LiteralPath $report)) { throw 'History inventory report was not produced.' }
          $value = Get-Content -LiteralPath $report -Raw -Encoding utf8 | ConvertFrom-Json
          if ($value.audited_head -ne $env:TARGET_SHA) {
            throw "History inventory audited $($value.audited_head), expected $env:TARGET_SHA"
          }
          if ($value.matched_content_in_report -ne $false -or
              $value.raw_paths_in_report -ne $false -or
              $value.raw_email_addresses_in_report -ne $false) {
            throw 'History inventory report violated its content-free contract.'
          }
          $status = if ($value.clean) { 'NOT_REQUIRED' } else { 'REQUIRED_BEFORE_FINAL_RELEASE' }
          $countLines = @()
          if ($value.finding_counts) {
            foreach ($property in $value.finding_counts.PSObject.Properties | Sort-Object Name) {
              $countLines += "  - $($property.Name): $($property.Value)"
            }
          }
          $lines = @(
            '## Full candidate-history privacy inventory',
            "- Audited revision: ``$($value.audited_head)``",
            '- Scope: complete ancestry reachable from the exact candidate head',
            "- Git objects: $($value.object_counts.PSObject.Properties | ForEach-Object { $_.Value } | Measure-Object -Sum | Select-Object -ExpandProperty Sum)",
            "- Bytes scanned: $($value.bytes_scanned)",
            "- Content-free findings: $($value.finding_count)",
            "- History remediation status: $status",
            '- Matched content, raw paths and raw e-mail addresses in report: false',
            '- History rewrite/force-push performed: no',
            '- Final release gate: remains PENDING unless a future --require-clean scan passes'
          )
          if ($countLines.Count -gt 0) {
            $lines += '- Finding counts:'
            $lines += $countLines
          }
          ($lines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Remove-Item -LiteralPath $report -Force -ErrorAction SilentlyContinue

      - name: Record non-destructive scope
        shell: pwsh
        run: |
          @"
          - Repository history was read only.
          - No branch, commit, tag, issue, credential, deployment or local installation was modified.
          - Any remediation remains subject to offline backup and explicit owner approval.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
