name: V2.1.3 Optional BLS Source Fix R4

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-optional-bls-source-fix-r4.yml

permissions:
  contents: write

concurrency:
  group: investor-intelligence-v213-optional-bls-source-fix-r4
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 240
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: development/v2.1.3-serenity-public-logic-fidelity
          fetch-depth: 0

      - name: Apply policy-aligned source fix with LF-normalized audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $wrappers = @(
            'activate-v213-seven-field-schedule.ps1',
            'activate-v213-seven-field-schedule-serenity-latest.ps1',
            'activate-v213-diversified-schedule.ps1'
          )
          $old = '$required=@(''us_sec'',''nasdaq'',''world_bank'',''us_bls'',''ecb'')'
          $new = '$required=@(''us_sec'',''nasdaq'',''world_bank'',''ecb'')'
          foreach ($relative in $wrappers) {
            $path = Join-Path $PWD.Path $relative
            $value = [IO.File]::ReadAllText($path)
            if (-not $value.Contains($old) -and -not $value.Contains($new)) {
              throw "$relative does not contain the expected required-family declaration."
            }
            $value = $value.Replace($old,$new).Replace("`r`n","`n")
            [IO.File]::WriteAllText($path,$value,$utf8NoBom)
          }
          Copy-Item -LiteralPath $wrappers[0] -Destination $wrappers[1] -Force

          $auditBase64 = ''
          $auditPath = Join-Path $PWD.Path 'scripts/v213_optional_bls_alignment_audit.py'
          [IO.File]::WriteAllBytes($auditPath,[Convert]::FromBase64String($auditBase64))

          $validatePath = Join-Path $PWD.Path 'scripts/ci_v213_r70_validate.ps1'
          $validate = [IO.File]::ReadAllText($validatePath)
          $needle = "        @('scripts\v213_serenity_latest_static_audit.py'),"
          $auditLine = "        @('scripts\v213_optional_bls_alignment_audit.py'),"
          if (-not $validate.Contains($auditLine)) {
            if (-not $validate.Contains($needle)) { throw 'R70 validation Python-test insertion anchor is missing.' }
            $validate = $validate.Replace($needle,$needle+"`n"+$auditLine)
          }
          [IO.File]::WriteAllText($validatePath,$validate.Replace("`r`n","`n"),$utf8NoBom)

      - name: Run complete Windows no-mutation validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\ci_v213_r70_validate.ps1 -ProjectRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'Complete R70 Windows validation failed.' }
          Write-Host 'V213_OPTIONAL_BLS_SOURCE_FIX_VALIDATION = PASS; production_mutation=false'

      - name: Commit validated source fix and remove temporary patch machinery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temporary = @(
            '.github/workflows/v213-optional-bls-source-fix-r4.yml',
            '.github/workflows/v213-optional-bls-direct-source-hotfix-r3.yml',
            '.github/workflows/v213-optional-bls-direct-source-hotfix-r2.yml',
            '.github/workflows/v213-optional-bls-direct-source-hotfix.yml',
            '.github/workflows/v213-optional-bls-policy-alignment-hotfix.yml',
            '.github/patches/v213-optional-bls-policy-alignment.patch'
          )
          foreach ($path in $temporary) { Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue }
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          foreach ($path in @(
            'activate-v213-seven-field-schedule.ps1',
            'activate-v213-seven-field-schedule-serenity-latest.ps1',
            'activate-v213-diversified-schedule.ps1',
            'scripts/ci_v213_r70_validate.ps1',
            'scripts/v213_optional_bls_alignment_audit.py'
          )) {
            $value = [IO.File]::ReadAllText((Join-Path $PWD.Path $path)).Replace("`r`n","`n")
            [IO.File]::WriteAllText((Join-Path $PWD.Path $path),$value,$utf8NoBom)
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Validated source fix contains whitespace errors.' }
          git commit -m 'fix: align activation with optional BLS federation policy'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit optional-BLS source fix.' }
          git pull --rebase origin development/v2.1.3-serenity-public-logic-fidelity
          if ($LASTEXITCODE -ne 0) { throw 'Unable to rebase optional-BLS source fix.' }
          git push origin HEAD:development/v2.1.3-serenity-public-logic-fidelity
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push optional-BLS source fix.' }
