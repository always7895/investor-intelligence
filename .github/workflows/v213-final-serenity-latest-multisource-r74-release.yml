name: V2.1.3 Final Serenity Latest Multi-Source R74 Release Delivery

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-final-serenity-latest-multisource-r74-release.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: investor-intelligence-v213-serenity-latest-r74
  cancel-in-progress: true

jobs:
  delivery:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_DIR: ${{ github.workspace }}\r74-${{ github.run_id }}

    steps:
      - name: Checkout exact final source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: r74-${{ github.run_id }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Validate latest public source, per-ticker evidence and Windows runtime
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          .\scripts\ci_v213_r70_validate.ps1 -ProjectRoot $PWD.Path

      - name: Build, verify and copy final package to Desktop
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          .\scripts\ci_v213_r70_package.ps1 -ProjectRoot $PWD.Path

      - name: Upload Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Investor-Intelligence-v2.1.3-Serenity-Latest-MultiSource-R70-Final
          path: |
            ${{ env.R70_ZIP }}
            ${{ env.R70_SHA_FILE }}
            ${{ env.R70_VERIFICATION }}
            ${{ env.R70_RECEIPT }}
            ${{ env.R70_VALIDATION }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish fixed-tag private GitHub release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tag='v2.1.3-serenity-latest-r70-final'
          gh release view $tag --repo always7895/investor-intelligence *> $null
          if($LASTEXITCODE-eq0){gh release delete $tag --repo always7895/investor-intelligence --yes --cleanup-tag;if($LASTEXITCODE-ne0){throw 'Unable to replace prior private release.'}}
          gh release create $tag --repo always7895/investor-intelligence --target '${{ github.sha }}' --title 'Investor Intelligence v2.1.3 Serenity Latest Multi-Source R70' --notes "Windows-validated private delivery. Production mutation by CI: false. SHA-256: $env:R70_SHA" $env:R70_ZIP $env:R70_SHA_FILE $env:R70_VERIFICATION $env:R70_RECEIPT $env:R70_VALIDATION
          if($LASTEXITCODE-ne0){throw 'Private release creation failed.'}
          Write-Host "V213_R74_PRIVATE_RELEASE = PASS; tag=$tag; sha256=$env:R70_SHA"

      - name: Publish fixed status file
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $success='${{ job.status }}'-eq'success'-and$env:R70_SHA-match'^[0-9a-f]{64}$'
          $status=if($success){'PASS'}else{'FAIL'}
          $document=[ordered]@{schema_version=1;status=$status;job_status='${{ job.status }}';workflow_run_id='${{ github.run_id }}';source_commit='${{ github.sha }}';release_tag=$(if($success){'v2.1.3-serenity-latest-r70-final'}else{''});package=$(if($success){'Investor-Intelligence-v2.1.3-Serenity-Latest-MultiSource-R70.zip'}else{''});zip_sha256=$(if($success){$env:R70_SHA}else{''});desktop_delivery=$(if($success){$env:R70_DESKTOP}else{''});production_mutation_by_ci=$false;completed_at=(Get-Date).ToUniversalTime().ToString('o')}
          $json=$document|ConvertTo-Json -Depth 8
          $content=[Convert]::ToBase64String([Text.UTF8Encoding]::new($false).GetBytes($json+"`n"))
          $path='delivery/v213-serenity-latest-r70/release.json';$api="https://api.github.com/repos/always7895/investor-intelligence/contents/$path"
          $headers=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='Investor-Intelligence-R74-status'}
          $existingSha='';try{$existing=Invoke-RestMethod -Method Get -Uri ($api+'?ref=${{ github.ref_name }}') -Headers $headers -TimeoutSec 30;$existingSha=[string]$existing.sha}catch{if([int]$_.Exception.Response.StatusCode-ne404){throw}}
          $body=[ordered]@{message="delivery: publish private release status for run ${{ github.run_id }}";content=$content;branch='${{ github.ref_name }}'};if($existingSha){$body.sha=$existingSha}
          Invoke-RestMethod -Method Put -Uri $api -Headers $headers -ContentType 'application/json' -Body ($body|ConvertTo-Json -Depth 5) -TimeoutSec 60|Out-Null
          Write-Host "V213_R74_STATUS = $status"
