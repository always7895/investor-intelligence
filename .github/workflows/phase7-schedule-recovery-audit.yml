name: Phase 7 Scheduling and Recovery Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - reconcile/phase3-authoritative-sources-v1
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: phase7-schedule-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == 'always7895')
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 40
    env:
      DELIVERY_ENABLED: 'false'
      LINE_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      LINE_ACCESS_MODE: 'disabled'
      CURRENT_PUBLIC_DATA_ENABLED: 'false'
      CLOUD_INFERENCE_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      FREE_ONLY_MODE: 'true'
      MEMORY_FEATURE_AVAILABLE: 'false'
      PYTHONUTF8: '1'
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

    steps:
      - name: Check out exact branch or PR head revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tested revision identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if (-not $env:TARGET_SHA -or $actual -ne $env:TARGET_SHA) {
            throw "Checked-out revision $actual does not match target $env:TARGET_SHA"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $actual -ne $env:PR_HEAD_SHA) {
            throw "Pull-request audit must test exact head $env:PR_HEAD_SHA, found $actual"
          }

      - name: Resolve deterministic verified Python
        shell: pwsh
        run: .\scripts\resolve_python.ps1 -VenvPath .venv-phase7-schedule

      - name: Enforce workflow supply-chain policy
        shell: pwsh
        run: |
          & $env:PROJECT_PYTHON scripts/workflow_supply_chain_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Workflow supply-chain gate failed.' }

      - name: Install immutable Python dependency lock
        shell: pwsh
        run: |
          & $env:PROJECT_PYTHON -m pip install --isolated --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple --require-hashes -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { throw 'Isolated hash-locked Python dependency installation failed.' }
          & $env:PROJECT_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Installed Python dependency consistency check failed.' }

      - name: Validate disabled scheduling and recovery policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PROJECT_PYTHON scripts/security_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Security/privacy gate failed.' }
          & $env:PROJECT_PYTHON scripts/schedule_planner.py --validate
          if ($LASTEXITCODE -ne 0) { throw 'Schedule policy validation failed.' }
          & $env:PROJECT_PYTHON -m compileall -q scripts tests
          if ($LASTEXITCODE -ne 0) { throw 'Python compile gate failed.' }
          & $env:PROJECT_PYTHON -m unittest discover -s tests -p 'test_schedule_planner.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Schedule/recovery regressions failed.' }

      - name: Record exact-head Phase 7 scope
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $lines = @(
            '## Phase 7 scheduling and recovery',
            "- Tested revision: ``$actual``",
            '- Timezone: Asia/Taipei',
            '- Scheduler enabled: false',
            '- Automatic task registration: false',
            '- Overlap behavior: skip active job',
            '- Missed-run catch-up: at most one',
            '- Clock rollback: fail closed',
            '- Privacy/rights/schema/paid/auth failures: non-retryable',
            '- Commands executed or tasks registered: no'
          )
          ($lines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
