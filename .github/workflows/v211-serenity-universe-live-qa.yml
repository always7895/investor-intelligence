name: v2.1.1 Serenity Universe + Live Q&A

# Hosted Actions are optional for this patch. The production activation runner
# performs the same Python/TypeScript gates locally before any live mutation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install hash-locked Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: V2.1.1 Serenity universe synthetic acceptance
        run: |
          python scripts/v211_serenity_top20.py --self-test
          python -m unittest tests.test_v211_serenity_universe -v

      - name: V2.1.1 public snapshot self-test
        run: python scripts/build_v211_public_snapshot.py --self-test

      - name: Verify discovery policy is owner-independent
        shell: python
        run: |
          from pathlib import Path
          material = (
              Path('config/v211-serenity-policy.json').read_text(encoding='utf-8')
              + Path('scripts/v211_serenity_top20.py').read_text(encoding='utf-8')
          ).upper()
          for forbidden in ('AAOI', 'SIVE'):
              if forbidden in material:
                  raise SystemExit(f'owner-specific ticker leaked into discovery: {forbidden}')
          print('V211_OWNER_INDEPENDENT_DISCOVERY = PASS')

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install Worker dependencies
        working-directory: cloud
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Worker typecheck
        working-directory: cloud
        run: npm run typecheck

      - name: Worker regression + v2.1.1 research Q&A tests
        working-directory: cloud
        run: npm test
