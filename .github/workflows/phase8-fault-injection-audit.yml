name: Phase 8 Synthetic Fault-Injection Matrix Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - reconcile/phase3-authoritative-sources-v1
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: phase8-fault-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == 'always7895')
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 90
    env:
      DELIVERY_ENABLED: 'false'
      LINE_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      LINE_ACCESS_MODE: 'disabled'
      CURRENT_PUBLIC_DATA_ENABLED: 'false'
      CLOUD_INFERENCE_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      FREE_ONLY_MODE: 'true'
      MEMORY_FEATURE_AVAILABLE: 'false'
      PYTHONUTF8: '1'
      EXPECTED_WORKER_LOCK_SHA256: '365ca38feb288fbed62bb5723303186e5e591c44b7d60b242e530db357535a57'
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}

    steps:
      - name: Check out exact branch or PR head revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tested revision identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if (-not $env:TARGET_SHA -or $actual -ne $env:TARGET_SHA) {
            throw "Checked-out revision $actual does not match target $env:TARGET_SHA"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $actual -ne $env:PR_HEAD_SHA) {
            throw "Pull-request audit must test exact head $env:PR_HEAD_SHA, found $actual"
          }

      - name: Resolve deterministic verified Python
        shell: pwsh
        run: .\scripts\resolve_python.ps1 -VenvPath .venv-phase8-faults

      - name: Enforce workflow supply-chain policy
        shell: pwsh
        run: |
          & $env:PROJECT_PYTHON scripts/workflow_supply_chain_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Workflow supply-chain gate failed.' }

      - name: Install immutable Python dependency lock
        shell: pwsh
        run: |
          & $env:PROJECT_PYTHON -m pip install --isolated --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple --require-hashes -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { throw 'Isolated hash-locked Python dependency installation failed.' }
          & $env:PROJECT_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Installed Python dependency consistency check failed.' }

      - name: Validate repository-only boundaries before packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PROJECT_PYTHON scripts/security_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Security/privacy gate failed.' }
          & $env:PROJECT_PYTHON scripts/line_public_boundary_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Shared LINE public-only boundary failed.' }
          & $env:PROJECT_PYTHON scripts/kv_namespace_isolation_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'KV namespace isolation gate failed.' }
          & $env:PROJECT_PYTHON scripts/authoritative_source_catalog.py
          if ($LASTEXITCODE -ne 0) { throw 'Authoritative source catalog gate failed.' }
          & $env:PROJECT_PYTHON scripts/release_candidate_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Fail-closed release truth gate failed.' }

      - name: Validate matrix and implemented Python boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PROJECT_PYTHON scripts/phase8_fault_injection_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 8 matrix validation failed.' }
          & $env:PROJECT_PYTHON -m compileall -q scripts tests
          if ($LASTEXITCODE -ne 0) { throw 'Python compile gate failed.' }
          & $env:PROJECT_PYTHON -m unittest discover -s tests -p 'test_phase8_fault_injection_gate.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Phase 8 matrix regressions failed.' }
          & $env:PROJECT_PYTHON -m unittest discover -s tests -p 'test_secure_public_fetch_canonical.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Secure public fetch regressions failed.' }
          & $env:PROJECT_PYTHON -m unittest discover -s tests -p 'test_source_ingestion_boundaries.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Source-ingestion boundary regressions failed.' }
          & $env:PROJECT_PYTHON -m unittest discover -s tests -p 'test_release_package.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Reproducible package and tamper regressions failed.' }
          & $env:PROJECT_PYTHON -m unittest discover -s tests -p 'test_run_repo_script.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Isolated repository script launcher regressions failed.' }

      - name: Resolve service-accessible Node.js
        shell: pwsh
        run: .\scripts\resolve_node.ps1 -MinimumVersion 22.0.0

      - name: Verify committed Worker dependency lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path cloud/package-lock.json)) { throw 'cloud/package-lock.json is required.' }
          $actual = (Get-FileHash cloud/package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_WORKER_LOCK_SHA256) { throw "Worker lock hash mismatch: $actual" }

      - name: Run tenant deletion and complete Worker fault regressions
        working-directory: cloud
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PROJECT_NPM ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          & $env:PROJECT_NPM run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed.' }
          & $env:PROJECT_NPM test
          if ($LASTEXITCODE -ne 0) { throw 'Worker fault regressions failed.' }

      - name: Build, verify and run a clean package with a second verified Python root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapPython = [System.IO.Path]::GetFullPath($env:PROJECT_PYTHON)
          $short = $env:TARGET_SHA.Substring(0, 12)
          $version = "0.0.0-dev.$short"
          $packageRoot = Join-Path $env:RUNNER_TEMP "investor-intelligence-phase8-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $extractRoot = Join-Path $packageRoot 'clean-install'
          $cleanPipCache = Join-Path $packageRoot 'empty-pip-cache'
          $cleanRuntimeRoot = Join-Path $env:RUNNER_TEMP 'portable-python-3.12.10-.venv-phase8-clean-install'
          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $cleanRuntimeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageRoot,$cleanPipCache | Out-Null

          & $bootstrapPython scripts/release_package.py --output-dir $packageRoot --version $version --synthetic
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic release package build failed.' }
          $stem = "investor-intelligence-$version"
          $archive = Join-Path $packageRoot "$stem.zip"
          $checksum = Join-Path $packageRoot "$stem.sha256"
          $manifest = Join-Path $packageRoot "$stem.manifest.json"
          $sbom = Join-Path $packageRoot "$stem.sbom.spdx.json"
          & $bootstrapPython scripts/run_repo_script.py verify_release_package.py --archive $archive --checksum $checksum --manifest $manifest --sbom $sbom --policy config/release-package-policy.json
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic release package verification failed.' }

          .\scripts\resolve_python.ps1 -VenvPath .venv-phase8-clean-install
          $cleanPython = [System.IO.Path]::GetFullPath($env:PROJECT_PYTHON)
          if (-not (Test-Path -LiteralPath $cleanPython -PathType Leaf)) {
            throw 'Second verified portable Python executable is missing.'
          }
          if ($cleanPython.Equals($bootstrapPython, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw 'Clean-install acceptance must use a distinct verified Python root.'
          }
          $cleanRuntimeActual = [System.IO.Path]::GetFullPath((Split-Path -Parent $cleanPython))
          if (-not $cleanRuntimeActual.Equals([System.IO.Path]::GetFullPath($cleanRuntimeRoot), [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Unexpected clean Python root: $cleanRuntimeActual"
          }

          $env:PIP_CACHE_DIR = $cleanPipCache
          & $cleanPython -m pip install --isolated --no-cache-dir --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple --require-hashes -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { throw 'Second portable Python hash-locked dependency installation failed.' }
          & $cleanPython -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Second portable Python dependency consistency check failed.' }
          & $cleanPython scripts/run_repo_script.py clean_install_acceptance.py --archive $archive --checksum $checksum --manifest $manifest --sbom $sbom --policy config/release-package-policy.json --extract-to $extractRoot
          if ($LASTEXITCODE -ne 0) { throw 'Clean-install Python acceptance failed.' }
          "PACKAGE_ROOT=$packageRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EXTRACT_ROOT=$extractRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLEAN_PYTHON_ROOT=$cleanRuntimeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run Worker from clean extraction with an empty npm cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $npmCache = Join-Path $env:PACKAGE_ROOT 'empty-npm-cache'
          New-Item -ItemType Directory -Force -Path $npmCache | Out-Null
          Push-Location (Join-Path $env:EXTRACT_ROOT 'cloud')
          try {
            & $env:PROJECT_NPM ci --ignore-scripts --no-audit --no-fund --cache $npmCache
            if ($LASTEXITCODE -ne 0) { throw 'Clean-install npm ci failed.' }
            & $env:PROJECT_NPM run typecheck
            if ($LASTEXITCODE -ne 0) { throw 'Clean-install Worker typecheck failed.' }
            & $env:PROJECT_NPM test
            if ($LASTEXITCODE -ne 0) { throw 'Clean-install Worker tests failed.' }
          } finally {
            Pop-Location
          }

      - name: Record exact-head Phase 8 scope
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $lines = @(
            '## Phase 8 synthetic fault matrix',
            "- Tested revision: ``$actual``",
            '- Production/destructive fault injection: forbidden',
            '- Real credentials/user data: forbidden',
            '- Retained scenario implementations: all 18',
            '- Repository-only LINE/workflow/history boundaries are executed before packaging where applicable',
            '- Deletion during retry: epoch-isolated and tested',
            '- Reproducible ZIP, manifest, SPDX SBOM and SHA-256 tamper rejection: tested',
            '- Clean extraction: second clean SHA-verified portable Python root plus Worker tested with empty caches',
            '- Release status remains fail-closed pending canonical acceptance and history remediation',
            '- Deployment or external-user admission: not performed'
          )
          ($lines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Remove ephemeral package, clean Python and Node working state
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath cloud\node_modules -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath .npm-cache -Recurse -Force -ErrorAction SilentlyContinue
          if ($env:PACKAGE_ROOT) {
            Remove-Item -LiteralPath $env:PACKAGE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($env:CLEAN_PYTHON_ROOT) {
            Remove-Item -LiteralPath $env:CLEAN_PYTHON_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          }
