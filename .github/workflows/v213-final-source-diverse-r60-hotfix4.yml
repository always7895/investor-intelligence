name: V2.1.3 Source-Diverse R60 Hotfix4 Release

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-intelligence-v213-r60-hotfix4
  cancel-in-progress: true

jobs:
  release:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      SOURCE_DIR: ${{ github.workspace }}\hf4-${{ github.run_id }}

    steps:
      - name: Checkout exact source into isolated directory
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: hf4-${{ github.run_id }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Prepare verified Python and hash-locked dependencies
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\resolve_python.ps1 -VenvPath .venv-v213-r60-hf4
          & $env:PROJECT_PYTHON -m pip install --isolated --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple --require-hashes -r requirements-ci.txt
          if($LASTEXITCODE-ne0){throw 'Hash-locked Python dependency installation failed.'}
          & $env:PROJECT_PYTHON -m pip check
          if($LASTEXITCODE-ne0){throw 'Python dependency check failed.'}

      - name: Validate methodology, source gates and intermediate boundaries
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          $commands=@(
            @('scripts\reconcile_v213_order_evidence.py','--self-test'),
            @('scripts\build_v213_scheduled_top20_report.py','--self-test'),
            @('scripts\v213_source_federation.py','--self-test'),
            @('scripts\v213_source_federation_gate.py','--self-test'),
            @('scripts\v213_apply_diversified_operationalization.py','--self-test'),
            @('scripts\v213_build_v21_public_snapshot.py','--self-test'),
            @('scripts\v213_pipeline_boundary_self_test.py'),
            @('scripts\v213_source_independence_gate.py','--self-test'),
            @('scripts\v213_source_independence_gate_v2.py','--wrapper-self-test'),
            @('scripts\v213_source_independence_gate_v3.py','--wrapper-self-test'),
            @('scripts\v213_methodology_and_source_audit.py'),
            @('scripts\v213_local_llm_gateway.py','--self-test'),
            @('scripts\audit_v213_bilingual_public_fields.py'),
            @('scripts\audit_v213_source_diversity_fields.py')
          )
          foreach($command in $commands){
            & $env:PROJECT_PYTHON @command
            if($LASTEXITCODE-ne0){throw "Python/audit test failed: $($command -join ' ')"}
          }
          & $env:PROJECT_PYTHON (Join-Path $PWD.Path 'tests\test_v213_v21_progress_runner.py')
          if($LASTEXITCODE-ne0){throw 'Safe-preselection recursion regression failed.'}
          & $env:PROJECT_PYTHON (Join-Path $PWD.Path 'tests\test_v213_v212_progress_runner.py')
          if($LASTEXITCODE-ne0){throw 'Provisional five-field bridge regression failed.'}
          & $env:PROJECT_PYTHON -m compileall -q scripts tests
          if($LASTEXITCODE-ne0){throw 'Python compileall failed.'}

      - name: Typecheck and run complete Worker regression
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\resolve_node.ps1 -MinimumVersion 22.0.0
          Push-Location cloud
          try{
            npm.cmd ci --ignore-scripts --no-audit --no-fund
            if($LASTEXITCODE-ne0){throw 'npm ci failed.'}
            npm.cmd run typecheck
            if($LASTEXITCODE-ne0){throw 'TypeScript typecheck failed.'}
            npm.cmd test
            if($LASTEXITCODE-ne0){throw 'Worker tests failed.'}
          }finally{Pop-Location}

      - name: Parse PowerShell and verify market-quality activation contract
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(
            'run-v213-local-source-diverse.ps1',
            'run-v213-local.ps1',
            'run-v213-local-llm-bridge-source-diverse.ps1',
            'scripts\run_v213_local_llm_bridge_core.ps1',
            'scripts\run_v213_local_llm_bridge_core_v2.ps1',
            'activate-v213-seven-field-schedule.ps1',
            'activate-v213-seven-field-schedule-core.ps1',
            'install-v213-source-diverse-runtime-v2.ps1',
            'install-v213-runtime.ps1',
            'register-v213-refresh-tasks.ps1',
            'sync-v213-top20-report.ps1'
          )
          foreach($path in $paths){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Out-String|Write-Host;throw "$path PowerShell 7 parser errors"}
          }
          $probe=Join-Path $env:RUNNER_TEMP 'v213-r60-hf4-ps51-parse.ps1'
          @'
          param([string[]]$Paths)
          foreach($path in $Paths){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Out-String|Write-Host;exit 1}
          }
          '@|Set-Content $probe -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $probe -Paths $paths
          if($LASTEXITCODE-ne0){throw 'Windows PowerShell 5.1 parser gate failed.'}
          foreach($path in $paths){
            $text=Get-Content $path -Raw -Encoding utf8
            if($text-match '(?<![A-Za-z0-9_])(return|throw|exit)\$'){
              throw "Compressed PowerShell token boundary found: $path"
            }
          }
          $refresh=Get-Content run-v213-local-source-diverse.ps1 -Raw -Encoding utf8
          $ordered=@(
            'v213_v21_progress_runner.py',
            'v213_v212_progress_runner.py',
            'reconcile_v213_order_evidence.py',
            'build_v213_scheduled_top20_report.py',
            'v213_source_federation.py',
            'v213_source_federation_gate.py',
            'v213_apply_diversified_operationalization.py',
            'v213_source_independence_gate_v3.py',
            'v213_build_v21_public_snapshot.py'
          )
          $previous=-1
          foreach($token in $ordered){
            $position=$refresh.IndexOf($token,[StringComparison]::Ordinal)
            if($position-le$previous){throw "Refresh pipeline order is invalid at: $token"}
            $previous=$position
          }
          if($refresh.Contains("& `$python 'scripts\build_v21_public_snapshot.py'")){
            throw 'Legacy snapshot builder is still called before diversified finalization.'
          }
          $activation=Get-Content activate-v213-seven-field-schedule.ps1 -Raw -Encoding utf8
          foreach($marker in @(
            'V213_MARKET_CORROBORATION_QUALITY = DEGRADED',
            'market_corroboration_status',
            'uncorroborated Top20 row exceeds the valuation-confidence cap',
            'v213_source_independence_gate_v3.py'
          )){if(-not$activation.Contains($marker)){throw "Activation quality marker missing: $marker"}}
          if($activation.Replace(' ','').Contains('if($nonYahoo-lt0.75){throw')){
            throw 'Activation still treats market endpoint availability as an unconditional global blocker.'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\run-v213-local-source-diverse.ps1 -ProjectRoot $PWD.Path -SelfTest
          if($LASTEXITCODE-ne0){throw 'Source-diverse entrypoint self-test failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\run-v213-local-llm-bridge-source-diverse.ps1 -ProjectRoot $PWD.Path -SelfTest
          if($LASTEXITCODE-ne0){throw 'HealthSchema2 bridge self-test failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\activate-v213-seven-field-schedule.ps1 -SelfTest
          if($LASTEXITCODE-ne0){throw 'Market-quality activation self-test failed.'}
          Write-Host 'R60_HF4_POWERSHELL_AND_ACTIVATION_CONTRACT = PASS'

      - name: Run real Windows no-mutation end-to-end refresh
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        timeout-minutes: 50
        run: |
          $ErrorActionPreference='Stop'
          $testRoot=Join-Path $env:RUNNER_TEMP ('v213-r60-hf4-live-'+[guid]::NewGuid().ToString('N'))
          $savedLocal=$env:LOCALAPPDATA
          $savedContact=$env:SEC_CONTACT_EMAIL
          $env:LOCALAPPDATA=Join-Path $testRoot 'LocalAppData'
          $env:SEC_CONTACT_EMAIL='investor-intelligence-public-research@example.com'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA|Out-Null
          try{
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\run-v213-local-source-diverse.ps1 -ProjectRoot $PWD.Path -NoModelBridge -NoSync -NoAutoActivation
            if($LASTEXITCODE-ne0){throw 'Real no-mutation source-diverse refresh failed.'}
            $top20=@(Get-Content data\cache\top20_public_latest.json -Raw -Encoding utf8|ConvertFrom-Json)
            if($top20.Count-ne20){throw 'Live refresh did not produce exactly 20 final Top20 rows.'}
            foreach($row in $top20){
              if([string]$row.scoring_version-ne'system-operationalization-v2.1.3-diversified'){
                throw "Live refresh retained a provisional row: $($row.ticker)"
              }
              if([int]$row.source_count-lt2-or@($row.evidence).Count-lt2){
                throw "Final row lacks transparent multi-source evidence: $($row.ticker)"
              }
            }
            $report=Get-Content data\cache\v213_top20_report_public_latest.json -Raw -Encoding utf8|ConvertFrom-Json
            if(@($report.records).Count-ne20){throw 'Seven-field report does not contain 20 rows.'}
            for($index=0;$index-lt20;$index++){
              if([string]$top20[$index].ticker-ne[string]$report.records[$index].ticker){
                throw "Top20/report order mismatch at rank $($index+1)."
              }
            }
            $federation=Get-Content data\cache\v213_source_federation_latest.json -Raw -Encoding utf8|ConvertFrom-Json
            if($federation.gates.pass-ne$true){throw 'Live source federation gate did not pass.'}
            $sourceAudit=Get-Content data\cache\v213_source_independence_latest.json -Raw -Encoding utf8|ConvertFrom-Json
            if([string]$sourceAudit.status-ne'PASS'){throw 'Claim-level source-independence blocking gates did not pass.'}
            if(@($sourceAudit.violations).Count-ne0-or@($sourceAudit.blocking_violations).Count-ne0){
              throw 'Source audit contains blocking violations despite PASS status.'
            }
            $portfolio=$sourceAudit.portfolio
            if([double]$portfolio.claim_primary_coverage_ratio-lt0.75){throw 'Claim primary coverage is below 75%.'}
            if([int]$portfolio.claim_source_families-lt2-or[int]$portfolio.claim_source_domains-lt2){throw 'Claim family/domain independence is below two.'}
            if([double]$portfolio.maximum_single_family_share-gt0.70){throw 'Source-family concentration exceeds 70%.'}
            $target=[double]$portfolio.non_yahoo_market_coverage_target_ratio
            $coverage=[double]$portfolio.non_yahoo_market_coverage_ratio
            if($coverage-lt$target){
              if([string]$portfolio.market_corroboration_status-ne'DEGRADED'){
                throw 'Low market coverage is not explicitly labelled DEGRADED.'
              }
              if($portfolio.market_corroboration_global_blocker-ne$false){
                throw 'Market endpoint unavailability is incorrectly a global blocker.'
              }
              if(@($sourceAudit.degradations)-notcontains'INSUFFICIENT_NON_YAHOO_MARKET_COVERAGE'){
                throw 'Market coverage degradation code is missing.'
              }
            }
            for($index=0;$index-lt20;$index++){
              $sourceRow=$sourceAudit.records[$index]
              $providers=[int]$sourceRow.market_corroboration.independent_provider_count
              if($providers-lt1){
                if($sourceRow.eligible_for_high_confidence_model_inference-ne$false){throw "Uncorroborated row is HIGH eligible: $($sourceRow.ticker)"}
                if([string]$sourceRow.public_logic_state.model_inference_confidence-ne'LIMITED'){throw "Uncorroborated row does not cap model confidence: $($sourceRow.ticker)"}
                if(@($sourceRow.missing_or_review)-notcontains'NON_YAHOO_MARKET_CORROBORATION'){throw "Uncorroborated row does not disclose missing market evidence: $($sourceRow.ticker)"}
                if([double]$top20[$index].serenity_factors.valuation_expectations-gt3.75){throw "Uncorroborated row exceeds valuation cap: $($sourceRow.ticker)"}
              }
            }
            $snapshot=Get-Content data\cache\v21_public_snapshot_upload.json -Raw -Encoding utf8|ConvertFrom-Json
            $snapshotTop20=@(ConvertFrom-Json -InputObject ([string]$snapshot.payloads.top20_json))
            if($snapshotTop20.Count-ne20){throw 'Diversified signed snapshot does not contain 20 rows.'}
            for($index=0;$index-lt20;$index++){
              if([string]$snapshotTop20[$index].ticker-ne[string]$top20[$index].ticker){throw "Signed snapshot order mismatch at rank $($index+1)."}
            }
            Write-Host ("R60_HF4_LIVE_NO_MUTATION_END_TO_END = PASS; market_status={0}; non_yahoo={1:P0}; claim_primary={2:P0}"-f$portfolio.market_corroboration_status,$coverage,[double]$portfolio.claim_primary_coverage_ratio)
          }finally{
            $env:LOCALAPPDATA=$savedLocal
            $env:SEC_CONTACT_EMAIL=$savedContact
            Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Compile Hotfix4 model-select EXE
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          $csc=@(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )|Where-Object{Test-Path $_ -PathType Leaf}|Select-Object -First 1
          if(-not$csc){throw 'csc.exe is unavailable.'}
          $source=Get-Content launcher\InvestorIntelligenceLauncher.cs -Raw -Encoding utf8
          $source=$source.Replace('const string Revision = "ModelSelect-R43";','const string Revision = "SourceDiverse-R60-Hotfix4";')
          $temporarySource=Join-Path $env:RUNNER_TEMP 'InvestorIntelligenceLauncher-R60-Hotfix4.cs'
          [IO.File]::WriteAllText($temporarySource,$source,[Text.UTF8Encoding]::new($false))
          $exe=Join-Path $env:RUNNER_TEMP 'InvestorIntelligence-R60-Hotfix4.exe'
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll "/out:$exe" $temporarySource
          if($LASTEXITCODE-ne0){throw 'Hotfix4 launcher compilation failed.'}
          foreach($argument in @('--pipe-hold-self-test','--model-selection-self-test')){
            $process=Start-Process -FilePath $exe -ArgumentList $argument -PassThru
            if(-not$process.WaitForExit(20000)){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue;throw "Launcher self-test timed out: $argument"}
            if($process.ExitCode-ne0){throw "Launcher self-test failed: $argument / $($process.ExitCode)"}
          }
          "HF4_EXE=$exe"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build one-click Hotfix4 ZIP
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP "ii-v213-r60-hf4-$env:GITHUB_RUN_ID"
          $stage=Join-Path $root 'Investor-Intelligence-v2.1.3-SourceDiverse-R60-Hotfix4'
          $versions=Join-Path $stage 'versions'
          New-Item -ItemType Directory -Force -Path $stage,$versions|Out-Null
          $refs=[ordered]@{
            '2.1.0'='bbc2987e54eccef350685447b48e1841c4e5ba19'
            '2.1.1'='22593c82743ad97aff91469ba001700d2a384c48'
            '2.1.2'='1a36935bf8532be074707eeb7f941d8a46be6ca9'
            '2.1.3'=$env:GITHUB_SHA.ToLowerInvariant()
          }
          foreach($entry in $refs.GetEnumerator()){
            $archive=Join-Path $versions ("Investor-Intelligence-v$($entry.Key)-source.zip")
            git archive --format=zip --output="$archive" $entry.Value
            if($LASTEXITCODE-ne0){throw "git archive failed for v$($entry.Key)"}
          }
          Expand-Archive (Join-Path $versions 'Investor-Intelligence-v2.1.3-source.zip') $stage -Force
          Copy-Item -LiteralPath (Join-Path $stage 'run-v213-local-source-diverse.ps1') -Destination (Join-Path $stage 'run-v213-local.ps1') -Force
          Copy-Item -LiteralPath (Join-Path $stage 'run-v213-local-llm-bridge-source-diverse.ps1') -Destination (Join-Path $stage 'run-v213-local-llm-bridge.ps1') -Force
          Copy-Item -LiteralPath (Join-Path $stage 'install-v213-source-diverse-runtime-v2.ps1') -Destination (Join-Path $stage 'install-v213-source-diverse-runtime.ps1') -Force
          Remove-Item -LiteralPath (Join-Path $stage 'tmp') -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $env:HF4_EXE -Destination (Join-Path $stage 'InvestorIntelligence.exe') -Force
          [ordered]@{
            schema_version=7
            package_version='2.1.3'
            launcher_revision='SourceDiverse-R60-Hotfix4'
            current_commit=$env:GITHUB_SHA.ToLowerInvariant()
            versions=$refs
            local_model=[ordered]@{
              explicit_selector=$true
              preferred_model='RVN-Q6_K-multilingual-mtp'
              silent_model_substitution=$false
              health_schema_version=2
            }
            pipeline=[ordered]@{
              provisional_scoring_version='system-operationalization-v2.1.3-safe-preselection'
              provisional_snapshot_promotion_blocked=$true
              source_federation_precedes_final_scoring=$true
              diversified_scoring_version='system-operationalization-v2.1.3-diversified'
              claim_source_gate='scripts/v213_source_independence_gate_v3.py'
              claim_source_independence_precedes_snapshot=$true
              canonical_snapshot_builder='scripts/v213_build_v21_public_snapshot.py'
              live_no_mutation_release_smoke=$true
            }
            market_quality=[ordered]@{
              policy='v213-market-corroboration-graceful-degradation-v1'
              target_non_yahoo_coverage=0.75
              endpoint_unavailability_is_global_blocker=$false
              required_for_high_confidence_inference=$true
              required_for_uncapped_valuation_confidence=$true
              uncorroborated_valuation_factor_max=3.75
              failures_disclosed=$true
              source_conflicts_averaged=$false
              published_returns_averaged_across_providers=$false
            }
            serenity_public_logic=[ordered]@{
              label='public-logic high-fidelity reconstruction'
              private_method_reproduced=$false
              official_formula=$false
              official_score=$false
            }
            source_fidelity=[ordered]@{
              yahoo_role='compatibility_calculation_only'
              independent_market_attempts=@('stooq_daily_csv','nasdaq_historical_api','hfmarketdata_daily_bars','optional_alpha_vantage_adjusted')
              official_macro_sources=@('world_bank','us_bls','ecb','fred_official_macro')
              primary_sources=@('SEC/regulatory filings','issuer primary disclosures')
              duplicate_or_syndicated_sources_count_once=$true
            }
            bilingual_fields=@('config/field-labels.zh-en.json','config/v213-source-diversity-field-labels.zh-en.json')
            schedule=@('08:00 Asia/Taipei','21:00 Asia/Taipei')
            local_refresh=@('07:20','20:20')
            production_deployment_performed_by_packaging=$false
          }|ConvertTo-Json -Depth 12|Set-Content (Join-Path $stage 'VERSION-REFS.json') -Encoding utf8
          $manifest=@()
          Get-ChildItem $stage -File -Recurse|ForEach-Object{
            $manifest+=[ordered]@{
              path=$_.FullName.Substring($stage.Length+1).Replace('\','/')
              bytes=$_.Length
              sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            schema_version=7
            commit=$env:GITHUB_SHA.ToLowerInvariant()
            generated_utc=(Get-Date).ToUniversalTime().ToString('o')
            files=$manifest
          }|ConvertTo-Json -Depth 12|Set-Content (Join-Path $stage 'MANIFEST.json') -Encoding utf8
          Get-ChildItem $stage -File -Recurse|ForEach-Object{
            '{0}  {1}'-f(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.FullName.Substring($stage.Length+1).Replace('\','/')
          }|Set-Content (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          $zip=Join-Path $root 'Investor-Intelligence-v2.1.3-SourceDiverse-R60-Hotfix4.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaFile=$zip+'.sha256'
          Set-Content -LiteralPath $shaFile -Value $sha -Encoding ascii
          "HF4_ZIP=$zip"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "HF4_SHA_FILE=$shaFile"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "HF4_SHA=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R60_HOTFIX4_ZIP_SHA256=$sha"

      - name: Verify final package and stable runtime
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          $check=Join-Path $env:RUNNER_TEMP "ii-v213-r60-hf4-check-$env:GITHUB_RUN_ID"
          $stable=Join-Path $env:RUNNER_TEMP "ii-v213-r60-hf4-stable-$env:GITHUB_RUN_ID"
          Expand-Archive $env:HF4_ZIP $check
          foreach($file in @(
            'InvestorIntelligence.exe','run-v213-local.ps1',
            'scripts\v213_v21_progress_runner.py','scripts\v213_v212_progress_runner.py',
            'scripts\v213_source_federation.py','scripts\v213_source_federation_gate.py',
            'scripts\v213_apply_diversified_operationalization.py',
            'scripts\v213_source_independence_gate_v3.py',
            'scripts\v213_build_v21_public_snapshot.py','scripts\v213_pipeline_boundary_self_test.py',
            'config\v213-market-corroboration-degradation-policy.json',
            'install-v213-source-diverse-runtime.ps1','VERSION-REFS.json','MANIFEST.json','SHA256SUMS.txt'
          )){if(-not(Test-Path -LiteralPath (Join-Path $check $file) -PathType Leaf)){throw "Final package missing: $file"}}
          if(Test-Path -LiteralPath (Join-Path $check 'tmp')){throw 'Temporary probe directory leaked into final package.'}
          & $env:PROJECT_PYTHON (Join-Path $check 'scripts\v213_pipeline_boundary_self_test.py')
          if($LASTEXITCODE-ne0){throw 'Packaged pipeline boundary self-test failed.'}
          & $env:PROJECT_PYTHON (Join-Path $check 'scripts\v213_source_independence_gate_v3.py') '--wrapper-self-test'
          if($LASTEXITCODE-ne0){throw 'Packaged market-quality source gate self-test failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $check 'run-v213-local.ps1') -ProjectRoot $check -SelfTest
          if($LASTEXITCODE-ne0){throw 'Packaged refresh entrypoint self-test failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $check 'install-v213-source-diverse-runtime.ps1') -ProjectRoot $check -RuntimeRoot $stable
          if($LASTEXITCODE-ne0){throw 'Stable runtime installation failed.'}
          $stableRefresh=Get-Content (Join-Path $stable 'run-v213-local.ps1') -Raw -Encoding utf8
          if(-not$stableRefresh.Contains('v213_source_independence_gate_v3.py')){throw 'Stable runtime lost the market-quality-aware source gate.'}
          $refs=Get-Content (Join-Path $check 'VERSION-REFS.json') -Raw -Encoding utf8|ConvertFrom-Json
          if([string]$refs.current_commit-ne$env:GITHUB_SHA.ToLowerInvariant()){throw 'VERSION-REFS commit mismatch.'}
          if([string]$refs.launcher_revision-ne'SourceDiverse-R60-Hotfix4'){throw 'Launcher revision mismatch.'}
          if($refs.market_quality.endpoint_unavailability_is_global_blocker-ne$false){throw 'Package metadata lost graceful market-quality degradation.'}
          $manifest=Get-Content (Join-Path $check 'MANIFEST.json') -Raw -Encoding utf8|ConvertFrom-Json
          foreach($entry in @($manifest.files)){
            $path=Join-Path $check ([string]$entry.path).Replace('/','\')
            if(-not(Test-Path -LiteralPath $path -PathType Leaf)){throw "Manifest path missing: $($entry.path)"}
            $actual=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if($actual-ne[string]$entry.sha256){throw "Manifest hash mismatch: $($entry.path)"}
          }
          Write-Host 'R60_HOTFIX4_FINAL_PACKAGE_AND_STABLE_RUNTIME = PASS'

