name: V2.1.3 Publication-Mode and Spaced-Path Hotfix R3

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-publication-mode-spaced-path-hotfix-r3.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: investor-intelligence-v213-publication-mode-spaced-path-hotfix-r1
  cancel-in-progress: true

jobs:
  patch-validate-commit:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: development/v2.1.3-serenity-public-logic-fidelity
          fetch-depth: 0

      - name: Resolve verified Python
        id: python
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $python=''
          foreach($candidate in @($env:PROJECT_PYTHON,'C:\Users\moon9\AppData\Local\Programs\Python\Python313\python.exe','C:\Users\moon9\AppData\Local\Programs\Python\Python312\python.exe','python.exe','python3.exe','python')){
            if(-not$candidate){continue}
            $path=$candidate
            if(-not(Test-Path -LiteralPath $path -PathType Leaf)){
              $command=Get-Command $candidate -ErrorAction SilentlyContinue
              if($command){$path=$command.Source}
            }
            if($path-and(Test-Path -LiteralPath $path -PathType Leaf)){
              & $path -c "import sys; assert sys.version_info >= (3,10)" 2>$null
              if($LASTEXITCODE-eq0){$python=$path;break}
            }
          }
          if(-not$python){throw 'No verified Python runtime was found on the Windows runner.'}
          "python=$python"|Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "PROJECT_PYTHON = $python"

      - name: Apply minimal deterministic source patch
        shell: pwsh
        env:
          PATCH_PYTHON: ${{ steps.python.outputs.python }}
        run: |
          $ErrorActionPreference='Stop'
          $patcher=Join-Path $env:RUNNER_TEMP 'apply-v213-publication-mode-spaced-path-r3.py'
          @'
          from __future__ import annotations

          import base64
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 0 and new in text:
                  return text
              if count != 1:
                  raise RuntimeError(f'{label}: replacement count={count}')
              return text.replace(old, new, 1)

          publication_global = r'''$declaredStrict=Get-IntProperty $portfolio 'evidence_qualified_candidate_count' -1
              $declaredLimited=Get-IntProperty $portfolio 'limited_research_candidate_count' -1
              $hasFinalPublicationModes=$declaredStrict-ge0-and$declaredLimited-ge0
              if($hasFinalPublicationModes){
                  if(($declaredStrict+$declaredLimited)-ne20){throw 'Final publication-mode candidate counts do not total 20.'}
                  $freshnessAudit=Get-PropertyValue $Document 'freshness_audit' $null
                  if($null-eq$freshnessAudit-or[string](Get-PropertyValue $freshnessAudit 'status' '')-ne'PASS'){throw 'The final publication freshness audit is not PASS.'}
                  if((Get-IntProperty $freshnessAudit 'evidence_qualified_candidate_count' -1)-ne$declaredStrict-or(Get-IntProperty $freshnessAudit 'limited_research_candidate_count' -1)-ne$declaredLimited){throw 'Publication-mode counts disagree with the freshness audit.'}
                  if(-not(Get-BooleanProperty $portfolio 'all_rows_publication_provenance_multi_source')){throw 'At least one final row lacks multi-source publication provenance.'}
                  if((Get-IntProperty $portfolio 'limited_rows_high_confidence_eligible_count')-ne0){throw 'A LIMITED candidate is incorrectly HIGH eligible.'}
                  if(-not(Get-BooleanProperty $freshnessAudit 'all_tickers_publication_provenance_multi_source')){throw 'The freshness audit does not prove independent publication provenance for all rows.'}
                  if(-not(Get-BooleanProperty $freshnessAudit 'all_positive_advantages_fresh_multi_source')){throw 'The freshness audit does not prove fresh multi-source support for positive advantages.'}
                  if($declaredLimited-gt0){
                      if($claimFamilies-lt1-or$claimDomains-lt1){throw 'A LIMITED publication lacks primary company-claim provenance.'}
                  }
                  elseif($claimFamilies-lt2-or$claimDomains-lt2){throw 'An all-evidence-qualified publication has claim-relevant source independence below 2.'}
              }
              elseif($claimFamilies-lt2-or$claimDomains-lt2){throw 'Claim-relevant source-family/domain independence is below 2.'}'''

          publication_record = r'''$freshnessState=Get-PropertyValue $record 'freshness_state' $null
                  $mode=[string](Get-PropertyValue $record 'publication_evidence_mode' '')
                  if(-not$mode){$mode=[string](Get-PropertyValue $logic 'publication_evidence_mode' '')}
                  if(-not$mode-and-not$hasFinalPublicationModes){$mode='EVIDENCE_QUALIFIED'}
                  $recordClaimFamilies=Get-IntProperty $metrics 'claim_relevant_independent_families'
                  $recordClaimDomains=Get-IntProperty $metrics 'claim_relevant_independent_domains'
                  $recordClaimPrimary=Get-IntProperty $metrics 'claim_relevant_primary_sources'
                  $recordDatedRatio=Get-DoubleProperty $metrics 'claim_dated_evidence_ratio'
                  $missing=@(Get-Array (Get-PropertyValue $record 'missing_or_review' @())|ForEach-Object{[string]$_})
                  switch($mode){
                      'EVIDENCE_QUALIFIED' {
                          $actualStrict++
                          if($recordClaimFamilies-lt2-or$recordClaimDomains-lt2){throw 'An EVIDENCE_QUALIFIED record has claim-source independence below 2.'}
                          if($recordClaimPrimary-lt1){throw 'An EVIDENCE_QUALIFIED record lacks primary company evidence.'}
                          if($recordDatedRatio-lt0.8){throw 'An EVIDENCE_QUALIFIED record has insufficient dated claim evidence.'}
                      }
                      'LIMITED_RESEARCH_CANDIDATE' {
                          $actualLimited++
                          if($null-eq$freshnessState-or[string](Get-PropertyValue $freshnessState 'status' '')-ne'PASS'){throw 'A LIMITED candidate lacks a PASS freshness state.'}
                          if([string](Get-PropertyValue $freshnessState 'publication_evidence_mode' '')-ne'LIMITED_RESEARCH_CANDIDATE'){throw 'A LIMITED candidate freshness mode is inconsistent.'}
                          if($eligible){throw 'A LIMITED candidate is incorrectly HIGH eligible.'}
                          if([string](Get-PropertyValue $logic 'model_inference_confidence' '')-ne'LIMITED'){throw 'A LIMITED candidate does not cap model inference at LIMITED.'}
                          if(Get-BooleanProperty $logic 'validated_company_thesis' $true){throw 'A LIMITED candidate is incorrectly marked as a validated thesis.'}
                          if($recordClaimPrimary-lt1-or(Get-IntProperty $freshnessState 'claim_primary_units')-lt1){throw 'A LIMITED candidate lacks primary company evidence.'}
                          if((Get-IntProperty $freshnessState 'publication_provenance_origin_count')-lt2-or(Get-IntProperty $freshnessState 'publication_provenance_domain_count')-lt2){throw 'A LIMITED candidate lacks two independent publication origins/domains.'}
                          if($missing-notcontains'LIMITED_RESEARCH_CANDIDATE'-or$missing-notcontains'INDEPENDENT_CLAIM_CORROBORATION'){throw 'A LIMITED candidate does not disclose missing independent claim corroboration.'}
                          $limitedFactors=Get-PropertyValue $Top20[$index] 'serenity_factors' $null
                          if($null-eq$limitedFactors){throw 'A LIMITED candidate lacks Serenity factor fields.'}
                          foreach($factor in @('demand_wave','chokepoint','pricing_power','replacement_friction','tam_capture')){
                              if($null-eq$limitedFactors.PSObject.Properties[$factor]-or(Get-DoubleProperty $limitedFactors $factor)-ne0){throw "A LIMITED candidate retains a positive or missing sensitive factor: $factor"}
                          }
                          foreach($field in @('architecture','dependency_graph','bottleneck_or_expansion','company_capture','lifecycle')){
                              if([string](Get-PropertyValue $logic $field '')-ne'UNPROVEN'){throw "A LIMITED candidate retains claim-driven logic state: $field"}
                          }
                      }
                      default {throw "Unknown final publication evidence mode: $mode"}
                  }'''

          preflight_block = r'''if($PreflightOnly){
              Write-Host ("V213_ACTIVATION_PREFLIGHT_ONLY = PASS; evidence_qualified={0}; limited={1}; production_mutation=false"-f$sourceResult.evidence_qualified_candidate_count,$sourceResult.limited_research_candidate_count) -ForegroundColor Green
              exit 0
          }
          '''

          for relative in ('activate-v213-seven-field-schedule.ps1','activate-v213-diversified-schedule.ps1'):
              path = ROOT / relative
              text = path.read_text(encoding='utf-8-sig').replace('\r\n','\n')
              if '[switch]$PreflightOnly' not in text:
                  text = replace_once(text, '    [switch]$SelfTest\n)', '    [switch]$SelfTest,\n    [switch]$PreflightOnly\n)', relative + ' parameter')
              text = text.replace("if(-not$ConfirmActivation){throw 'Formal source-diverse scheduled activation requires -ConfirmActivation.'}", "if(-not$ConfirmActivation-and-not$PreflightOnly){throw 'Formal source-diverse scheduled activation requires -ConfirmActivation or -PreflightOnly.'}", 1)
              old_global = "if($claimFamilies-lt2-or$claimDomains-lt2){throw 'Claim-relevant source-family/domain independence is below 2.'}"
              if '$hasFinalPublicationModes=' not in text:
                  text = replace_once(text, old_global, publication_global, relative + ' global publication gate')
              if '$actualStrict=0' not in text:
                  text = replace_once(text, '$eligibleCount=0', '$eligibleCount=0\n              $actualStrict=0\n              $actualLimited=0', relative + ' publication counters')
              old_record = "$logic=Get-PropertyValue $record 'public_logic_state' $null\n                  if($null-eq$metrics-or$null-eq$market-or$null-eq$logic){throw 'A source record lacks source metrics, market corroboration or public logic state.'}\n                  $providerCount=Get-IntProperty $market 'independent_provider_count'"
              if "switch($mode)" not in text:
                  new_record = "$logic=Get-PropertyValue $record 'public_logic_state' $null\n                  if($null-eq$metrics-or$null-eq$market-or$null-eq$logic){throw 'A source record lacks source metrics, market corroboration or public logic state.'}\n                  " + publication_record + "\n                  $providerCount=Get-IntProperty $market 'independent_provider_count'"
                  text = replace_once(text, old_record, new_record, relative + ' record publication gate')
              count_anchor = "if($eligibleCount-ne(Get-IntProperty $portfolio 'high_confidence_model_inference_eligible_count')){"
              if 'Record-level publication-mode counts do not match' not in text:
                  insertion = "if($hasFinalPublicationModes-and($actualStrict-ne$declaredStrict-or$actualLimited-ne$declaredLimited)){throw 'Record-level publication-mode counts do not match the portfolio.'}\n              " + count_anchor
                  text = replace_once(text, count_anchor, insertion, relative + ' publication count check')
              return_anchor = 'high_confidence_eligible_count=$eligibleCount\n'
              if 'evidence_qualified_candidate_count=$actualStrict' not in text:
                  text = replace_once(text, return_anchor, return_anchor + '                  evidence_qualified_candidate_count=$actualStrict\n                  limited_research_candidate_count=$actualLimited\n', relative + ' return publication counts')
              old_log = 'Write-Host ("V213_SOURCE_INDEPENDENCE_PREFLIGHT = PASS; families={0}; domains={1}; claim_families={2}; claim_domains={3}; non_yahoo={4:P0}; market_status={5}; claim_primary={6:P0}; high_confidence={7}; source_sha256={8}"-f$sourceResult.independent_source_families,$sourceResult.independent_domains,$sourceResult.claim_source_families,$sourceResult.claim_source_domains,$sourceResult.non_yahoo_market_coverage_ratio,$sourceResult.market_corroboration_status,$sourceResult.claim_primary_coverage_ratio,$sourceResult.high_confidence_eligible_count,$sourceSha) -ForegroundColor Green'
              new_log = 'Write-Host ("V213_SOURCE_INDEPENDENCE_PREFLIGHT = PASS; families={0}; domains={1}; claim_families={2}; claim_domains={3}; non_yahoo={4:P0}; market_status={5}; claim_primary={6:P0}; high_confidence={7}; evidence_qualified={8}; limited={9}; source_sha256={10}"-f$sourceResult.independent_source_families,$sourceResult.independent_domains,$sourceResult.claim_source_families,$sourceResult.claim_source_domains,$sourceResult.non_yahoo_market_coverage_ratio,$sourceResult.market_corroboration_status,$sourceResult.claim_primary_coverage_ratio,$sourceResult.high_confidence_eligible_count,$sourceResult.evidence_qualified_candidate_count,$sourceResult.limited_research_candidate_count,$sourceSha) -ForegroundColor Green'
              if 'evidence_qualified={8}; limited={9}' not in text:
                  text = replace_once(text, old_log, new_log, relative + ' publication log')
              if 'V213_ACTIVATION_PREFLIGHT_ONLY = PASS' not in text:
                  config_anchor = "\n$configRoot=Join-Path $env:LOCALAPPDATA 'InvestorIntelligence\\UserData\\config'"
                  text = replace_once(text, config_anchor, '\n' + preflight_block + config_anchor, relative + ' PreflightOnly')
              path.write_text(text, encoding='utf-8', newline='\n')

          canonical = ROOT / 'activate-v213-seven-field-schedule.ps1'
          alias = ROOT / 'activate-v213-seven-field-schedule-serenity-latest.ps1'
          alias.write_bytes(canonical.read_bytes())

          bridge_path = ROOT / 'scripts' / 'run_v213_local_llm_bridge_core.ps1'
          bridge = bridge_path.read_text(encoding='utf-8-sig').replace('\r\n','\n')
          helper = r'''function New-GatewayArgumentLine {
              param([string]$GatewayScriptPath,[int]$Port)
              if([string]::IsNullOrWhiteSpace($GatewayScriptPath)-or$GatewayScriptPath.Contains('"')){throw 'Gateway script path is empty or contains an unsupported quote character.'}
              return ('"{0}" --host 127.0.0.1 --port {1}'-f$GatewayScriptPath,$Port)
          }
          function Get-BridgeLogTail {
              param([string]$Path)
              if(-not(Test-Path -LiteralPath $Path -PathType Leaf)){return '<missing>'}
              $lines=@(Get-Content -LiteralPath $Path -Tail 20 -ErrorAction SilentlyContinue|ForEach-Object{([string]$_).Trim()}|Where-Object{$_})
              if($lines.Count-eq0){return '<empty>'}
              return ($lines-join' | ')
          }
          '''
          if 'function New-GatewayArgumentLine' not in bridge:
              bridge = replace_once(bridge, 'function Test-HealthModel {', helper + '\nfunction Test-HealthModel {', 'bridge helper')
          probe = "from pathlib import Path\nimport sys\nimport time\nPath(__file__).with_suffix('.args.txt').write_text('\\n'.join(sys.argv[1:]), encoding='utf-8')\ntime.sleep(1)\n"
          probe_b64 = base64.b64encode(probe.encode()).decode()
          if 'V213_BRIDGE_SPACED_PATH_PROCESS_SELF_TEST' not in bridge:
              marker = "              Write-Host 'V213_BRIDGE_STRICTMODE_HEALTH_SELF_TEST = PASS' -ForegroundColor Green"
              probe_test = r'''              $testPython=''
              if($env:PROJECT_PYTHON-and(Test-Path -LiteralPath $env:PROJECT_PYTHON -PathType Leaf)){$testPython=$env:PROJECT_PYTHON}
              if(-not$testPython){foreach($name in @('python.exe','python3.exe','python')){$command=Get-Command $name -ErrorAction SilentlyContinue;if($command){$testPython=$command.Source;break}}}
              if(-not$testPython){throw 'Bridge spaced-path process self-test requires Python.'}
              $testRoot=Join-Path $env:TEMP ('Investor Intelligence Bridge Path (1)-'+[guid]::NewGuid().ToString('N'))
              New-Item -ItemType Directory -Force -Path $testRoot|Out-Null
              $testScript=Join-Path $testRoot 'gateway launch probe.py';$resultPath=[IO.Path]::ChangeExtension($testScript,'.args.txt')
              $testStdout=Join-Path $testRoot 'probe.stdout.log';$testStderr=Join-Path $testRoot 'probe.stderr.log'
              [IO.File]::WriteAllBytes($testScript,[Convert]::FromBase64String('__PROBE_B64__'))
              $argumentLine=New-GatewayArgumentLine $testScript 18814
              $probeProcess=$null
              try{
                  $probeProcess=Start-Process -FilePath $testPython -ArgumentList $argumentLine -PassThru -WindowStyle Hidden -RedirectStandardOutput $testStdout -RedirectStandardError $testStderr
                  $deadline=(Get-Date).AddSeconds(15)
                  while((Get-Date)-lt$deadline-and-not(Test-Path -LiteralPath $resultPath -PathType Leaf)){Start-Sleep -Milliseconds 200}
                  if(-not(Test-Path -LiteralPath $resultPath -PathType Leaf)){throw "Spaced-path Python probe did not start. stderr=$(Get-BridgeLogTail $testStderr)"}
                  if((@(Get-Content -LiteralPath $resultPath -Encoding utf8)-join'|')-ne'--host|127.0.0.1|--port|18814'){throw 'Spaced-path Python probe received corrupted arguments.'}
              }
              finally{
                  if($probeProcess-and(Get-Process -Id $probeProcess.Id -ErrorAction SilentlyContinue)){Stop-Process -Id $probeProcess.Id -Force -ErrorAction SilentlyContinue}
                  Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
              }
              Write-Host 'V213_BRIDGE_STRICTMODE_HEALTH_SELF_TEST = PASS; V213_BRIDGE_SPACED_PATH_PROCESS_SELF_TEST = PASS' -ForegroundColor Green'''.replace('__PROBE_B64__', probe_b64)
              bridge = replace_once(bridge, marker, probe_test, 'bridge spaced-path SelfTest')
          old_start = "$gateway = Start-Process -FilePath $python -ArgumentList @($GatewayScript, '--host', '127.0.0.1', '--port', [string]$GatewayPort) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr"
          new_start = "$gatewayArguments = New-GatewayArgumentLine $GatewayScript $GatewayPort\n$gateway = Start-Process -FilePath $python -ArgumentList $gatewayArguments -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr"
          if '$gatewayArguments = New-GatewayArgumentLine' not in bridge:
              bridge = replace_once(bridge, old_start, new_start, 'bridge quoted Start-Process')
          old_wait = '    [void](Wait-LocalGatewayHealth $GatewayPort $gateway.Id $Model)'
          new_wait = '''    try{[void](Wait-LocalGatewayHealth $GatewayPort $gateway.Id $Model)}
              catch{
                  $stderrTail=Get-BridgeLogTail $stderr;$stdoutTail=Get-BridgeLogTail $stdout
                  throw "Local gateway startup failed. $($_.Exception.Message) stderr_tail=$stderrTail; stdout_tail=$stdoutTail"
              }'''
          if 'stderr_tail=$stderrTail' not in bridge:
              bridge = replace_once(bridge, old_wait, new_wait, 'bridge startup diagnostics')
          bridge_path.write_text(bridge, encoding='utf-8', newline='\n')

          audit_path = ROOT / 'scripts' / 'v213_serenity_latest_static_audit.py'
          audit = audit_path.read_text(encoding='utf-8-sig').replace('\r\n','\n')
          audit_marker = '# PUBLICATION_MODE_ACTIVATION_AND_SPACED_PATH_ALIGNMENT_V2'
          if audit_marker not in audit:
              audit_block = r'''    # PUBLICATION_MODE_ACTIVATION_AND_SPACED_PATH_ALIGNMENT_V2
              require(
                  canonical_activation,
                  (
                      "LIMITED_RESEARCH_CANDIDATE",
                      "V213_ACTIVATION_PREFLIGHT_ONLY",
                      "all_rows_publication_provenance_multi_source",
                      "all_positive_advantages_fresh_multi_source",
                      "production_mutation=false",
                  ),
                  failures,
              )
              require(
                  "scripts/run_v213_local_llm_bridge_core.ps1",
                  ("New-GatewayArgumentLine","V213_BRIDGE_SPACED_PATH_PROCESS_SELF_TEST","stderr_tail=$stderrTail"),
                  failures,
              )
          '''
              needle = '\n    if failures:\n'
              index = audit.rfind(needle)
              if index < 0:
                  raise RuntimeError('static audit final failure anchor missing')
              audit = audit[:index] + '\n' + audit_block.rstrip() + audit[index:]
              audit_path.write_text(audit, encoding='utf-8', newline='\n')

          release_path = ROOT / '.github' / 'workflows' / 'v213-final-serenity-latest-multisource-r74-release.yml'
          release = release_path.read_text(encoding='utf-8-sig').replace('\r\n','\n')
          if '      - activate-v213-seven-field-schedule.ps1' not in release:
              anchor = '      - launcher/InvestorIntelligenceLauncher.cs'
              release = replace_once(release, anchor, anchor + '\n      - activate-v213-seven-field-schedule.ps1\n      - activate-v213-seven-field-schedule-serenity-latest.ps1\n      - activate-v213-diversified-schedule.ps1\n      - scripts/run_v213_local_llm_bridge_core.ps1', 'R74 path filters')
          if 'Validate actual publication-mode preflight and spaced-path process launch' not in release:
              step_anchor = '      - name: Build, verify and copy final package to Desktop'
              extra = r'''      - name: Validate actual publication-mode preflight and spaced-path process launch
                shell: pwsh
                working-directory: ${{ env.SOURCE_DIR }}
                env:
                  PROJECT_PYTHON: ${{ env.PROJECT_PYTHON }}
                run: |
                  $ErrorActionPreference='Stop'
                  & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\activate-v213-seven-field-schedule.ps1 -ProjectRoot $PWD.Path -PreflightOnly
                  if($LASTEXITCODE-ne0){throw 'Actual all-LIMITED activation preflight failed.'}
                  & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\run_v213_local_llm_bridge_core.ps1 -ProjectRoot $PWD.Path -SelfTest
                  if($LASTEXITCODE-ne0){throw 'Bridge spaced-path process self-test failed.'}
                  $spaceRoot=Join-Path $env:RUNNER_TEMP ('Investor Intelligence R70 Validation Path (1)-${{ github.run_id }}')
                  Remove-Item -LiteralPath $spaceRoot -Recurse -Force -ErrorAction SilentlyContinue
                  New-Item -ItemType Directory -Force -Path $spaceRoot|Out-Null
                  & robocopy.exe $PWD.Path $spaceRoot /MIR /XD .git node_modules /NFL /NDL /NJH /NJS /NP | Out-Null
                  if($LASTEXITCODE-gt7){throw "Spaced-path validation copy failed with robocopy exit $LASTEXITCODE."}
                  & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $spaceRoot 'activate-v213-seven-field-schedule.ps1') -ProjectRoot $spaceRoot -SelfTest
                  if($LASTEXITCODE-ne0){throw 'Spaced-path activation SelfTest failed.'}
                  & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $spaceRoot 'activate-v213-seven-field-schedule.ps1') -ProjectRoot $spaceRoot -PreflightOnly
                  if($LASTEXITCODE-ne0){throw 'Spaced-path actual activation preflight failed.'}
                  & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $spaceRoot 'scripts\run_v213_local_llm_bridge_core.ps1') -ProjectRoot $spaceRoot -SelfTest
                  if($LASTEXITCODE-ne0){throw 'Spaced-path bridge process launch failed.'}
                  Remove-Item -LiteralPath $spaceRoot -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host 'V213_R70_ACTUAL_PUBLICATION_MODE_PREFLIGHT = PASS; all_limited=true; spaced_path=true; production_mutation=false'
          '''
              release = replace_once(release, step_anchor, extra.rstrip() + '\n\n' + step_anchor, 'R74 actual preflight step')
          release_path.write_text(release, encoding='utf-8', newline='\n')

          canonical_text = canonical.read_text(encoding='utf-8')
          bridge_text = bridge_path.read_text(encoding='utf-8')
          required = (
              '$hasFinalPublicationModes=',
              'LIMITED_RESEARCH_CANDIDATE',
              'V213_ACTIVATION_PREFLIGHT_ONLY = PASS',
          )
          for marker in required:
              if marker not in canonical_text:
                  raise RuntimeError(f'canonical activation missing {marker}')
          for marker in ('New-GatewayArgumentLine','V213_BRIDGE_SPACED_PATH_PROCESS_SELF_TEST','stderr_tail=$stderrTail'):
              if marker not in bridge_text:
                  raise RuntimeError(f'bridge missing {marker}')
          if canonical.read_bytes() != alias.read_bytes():
              raise RuntimeError('canonical and compatibility alias differ')
          print('V213_PUBLICATION_MODE_SPACED_PATH_SOURCE_PATCH_R3 = PASS', flush=True)
          '@ | Set-Content -LiteralPath $patcher -Encoding utf8
          & $env:PATCH_PYTHON -m py_compile $patcher
          if($LASTEXITCODE-ne0){throw 'R3 patcher syntax validation failed.'}
          & $env:PATCH_PYTHON $patcher
          if($LASTEXITCODE-ne0){throw 'R3 deterministic source patch failed.'}

      - name: Run complete Windows validation and actual no-mutation preflight
        shell: pwsh
        env:
          PROJECT_PYTHON: ${{ steps.python.outputs.python }}
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\ci_v213_r70_validate.ps1 -ProjectRoot $PWD.Path
          if($LASTEXITCODE-ne0){throw 'Complete R70 Windows validation failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\activate-v213-seven-field-schedule.ps1 -ProjectRoot $PWD.Path -PreflightOnly
          if($LASTEXITCODE-ne0){throw 'Actual all-LIMITED activation preflight failed.'}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\run_v213_local_llm_bridge_core.ps1 -ProjectRoot $PWD.Path -SelfTest
          if($LASTEXITCODE-ne0){throw 'Bridge spaced-path process self-test failed.'}
          $spaceRoot=Join-Path $env:RUNNER_TEMP ('Investor Intelligence Hotfix Validation Path (1)-${{ github.run_id }}')
          Remove-Item -LiteralPath $spaceRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $spaceRoot|Out-Null
          & robocopy.exe $PWD.Path $spaceRoot /MIR /XD .git node_modules /NFL /NDL /NJH /NJS /NP | Out-Null
          if($LASTEXITCODE-gt7){throw "Spaced-path validation copy failed with robocopy exit $LASTEXITCODE."}
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $spaceRoot 'activate-v213-seven-field-schedule.ps1') -ProjectRoot $spaceRoot -SelfTest
          if($LASTEXITCODE-ne0){throw 'Spaced-path activation SelfTest failed.'}
