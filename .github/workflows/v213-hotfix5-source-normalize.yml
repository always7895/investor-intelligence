name: V2.1.3 Hotfix5 Source Normalize

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-hotfix5-source-normalize.yml
      - activate-v213-seven-field-schedule-core.ps1
      - run-v213-local-source-diverse.ps1
      - run-v213-local.ps1
      - install-v213-runtime.ps1
      - install-v213-source-diverse-runtime-v2.ps1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investor-intelligence-v213-hotfix5-source-normalize
  cancel-in-progress: false

jobs:
  normalize:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 10
    steps:
      - name: Checkout branch with write credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: development/v2.1.3-serenity-public-logic-fidelity
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Normalize Hotfix5 source contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [Text.UTF8Encoding]::new($false)
          function Write-IfChanged([string]$Path,[string]$Text) {
            $current = Get-Content -LiteralPath $Path -Raw -Encoding utf8
            if ($current -ne $Text) {
              [IO.File]::WriteAllText((Resolve-Path $Path), $Text, $utf8)
            }
          }

          $corePath = 'activate-v213-seven-field-schedule-core.ps1'
          $core = Get-Content -LiteralPath $corePath -Raw -Encoding utf8
          $core = $core.Replace('$name: $($_.Exception.Message)', '${name}: $($_.Exception.Message)')
          Write-IfChanged $corePath $core
          if ((Get-Content -LiteralPath $corePath -Raw -Encoding utf8).Contains('$name:')) {
            throw 'Unsafe variable-colon interpolation remains in activation core.'
          }

          $sourceDiversePath = 'run-v213-local-source-diverse.ps1'
          $sourceDiverse = Get-Content -LiteralPath $sourceDiversePath -Raw -Encoding utf8
          $sourceDiverse = $sourceDiverse.Replace('scripts\build_v213_activation_bundle.py', 'scripts\build_v213_activation_bundle_v2.py')
          Write-IfChanged $sourceDiversePath $sourceDiverse
          Write-IfChanged 'run-v213-local.ps1' $sourceDiverse
          foreach ($path in @($sourceDiversePath,'run-v213-local.ps1')) {
            $verified = Get-Content -LiteralPath $path -Raw -Encoding utf8
            if (-not $verified.Contains('build_v213_activation_bundle_v2.py')) {
              throw "Hotfix5 builder is not canonical in $path"
            }
            if ($verified.Contains('sync-v21-public-snapshot.ps1')) {
              throw "Legacy pre-activation sync remains in $path"
            }
          }

          $runtimePath = 'install-v213-runtime.ps1'
          $runtime = Get-Content -LiteralPath $runtimePath -Raw -Encoding utf8
          if (-not $runtime.Contains("'scripts\build_v213_activation_bundle_v2.py'")) {
            $runtime = $runtime.Replace(
              "    'scripts\v213_build_v21_public_snapshot.py',",
              "    'scripts\v213_build_v21_public_snapshot.py',`r`n    'scripts\build_v213_activation_bundle_v2.py',`r`n    'sync-v213-activation-bundle.ps1',")
          }
          Write-IfChanged $runtimePath $runtime
          $runtimeVerified = Get-Content -LiteralPath $runtimePath -Raw -Encoding utf8
          foreach ($marker in @('scripts\build_v213_activation_bundle_v2.py','sync-v213-activation-bundle.ps1')) {
            if (-not $runtimeVerified.Contains($marker)) { throw "Stable runtime requirement missing: $marker" }
          }

          $overlayPath = 'install-v213-source-diverse-runtime-v2.ps1'
          $overlay = Get-Content -LiteralPath $overlayPath -Raw -Encoding utf8
          if (-not $overlay.Contains("'scripts\build_v213_activation_bundle_v2.py'")) {
            $overlay = $overlay.Replace(
              "    'scripts\v213_source_independence_gate_v3.py'='scripts\v213_source_independence_gate_v3.py'",
              "    'scripts\v213_source_independence_gate_v3.py'='scripts\v213_source_independence_gate_v3.py'`r`n    'scripts\build_v213_activation_bundle_v2.py'='scripts\build_v213_activation_bundle_v2.py'`r`n    'sync-v213-activation-bundle.ps1'='sync-v213-activation-bundle.ps1'")
          }
          Write-IfChanged $overlayPath $overlay
          $overlayVerified = Get-Content -LiteralPath $overlayPath -Raw -Encoding utf8
          foreach ($marker in @('scripts\build_v213_activation_bundle_v2.py','sync-v213-activation-bundle.ps1')) {
            if (-not $overlayVerified.Contains($marker)) { throw "Source-diverse runtime copy map missing: $marker" }
          }

          $releasePath = '.github/workflows/v213-final-source-diverse-r60-hotfix5.yml'
          $release = Get-Content -LiteralPath $releasePath -Raw -Encoding utf8
          $oldOrder = @'
          $previous = -1
          foreach ($token in $ordered) {
            $position = $refresh.IndexOf($token, [StringComparison]::Ordinal)
            if ($position -le $previous) { throw "Refresh pipeline order is invalid at: $token" }
            $previous = $position
          }
'@
          $newOrder = @'
          $previous = $refresh.IndexOf("Stage 3 'Provisional Top20 candidate engine", [StringComparison]::Ordinal)
          if ($previous -lt 0) { throw 'Stage 3 runtime pipeline marker is missing.' }
          foreach ($token in $ordered) {
            $position = $refresh.IndexOf($token, $previous + 1, [StringComparison]::Ordinal)
            if ($position -le $previous) { throw "Refresh pipeline order is invalid at: $token" }
            $previous = $position
          }
'@
          if ($release.Contains($oldOrder)) {
            $release = $release.Replace($oldOrder, $newOrder)
          }
          $release = $release.Replace(
            "foreach (`$argument in @('--self-test','--pipe-hold-self-test','--model-selection-self-test')) {",
            "foreach (`$argument in @('--pipe-hold-self-test','--model-selection-self-test')) {")
          Write-IfChanged $releasePath $release
          $releaseVerified = Get-Content -LiteralPath $releasePath -Raw -Encoding utf8
          if (-not $releaseVerified.Contains("`$refresh.IndexOf(`$token, `$previous + 1")) {
            throw 'Hotfix5 release pipeline audit still scans pre-pipeline self-test references.'
          }
          $compileSectionStart = $releaseVerified.IndexOf('- name: Compile Hotfix5 atomic model-select EXE')
          $packageSectionStart = $releaseVerified.IndexOf('- name: Build one-click Hotfix5 atomic ZIP')
          if ($compileSectionStart -lt 0 -or $packageSectionStart -le $compileSectionStart) {
            throw 'Hotfix5 compile/package workflow sections are missing.'
          }
          $compileSection = $releaseVerified.Substring($compileSectionStart, $packageSectionStart - $compileSectionStart)
          if ($compileSection.Contains("'--self-test'")) {
            throw 'Pre-package temporary EXE still runs a package-layout self-test.'
          }

          foreach ($path in @(
            $corePath,
            $sourceDiversePath,
            'run-v213-local.ps1',
            $runtimePath,
            $overlayPath,
            'sync-v213-activation-bundle.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $errors | Out-String | Write-Host
              throw "$path still has PowerShell parser errors."
            }
          }
          Write-Host 'V213_HOTFIX5_SOURCE_NORMALIZATION = PASS; builder=v2; canonical_run_local=source_diverse; runtime=atomic; release_audit=pipeline_scoped'

      - name: Remove tracked tool probes
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'tmp') {
            Remove-Item -LiteralPath 'tmp' -Recurse -Force
          }

      - name: Commit normalized source when required
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.git\AUTO_MERGE.lock' -Force -ErrorAction SilentlyContinue
          $changes = git status --porcelain
          if (-not $changes) {
            Write-Host 'V213_HOTFIX5_SOURCE_NORMALIZATION_COMMIT = NO_CHANGES'
            exit 0
          }
          git config user.name 'Investor Intelligence Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git commit -m 'fix: scope Hotfix5 release audit to runtime pipeline'
          git push origin HEAD:development/v2.1.3-serenity-public-logic-fidelity
          Write-Host 'V213_HOTFIX5_SOURCE_NORMALIZATION_COMMIT = PASS'
