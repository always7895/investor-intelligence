name: V2.1.3 Serenity Freshness Audited Delivery

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-serenity-freshness-audited-delivery.yml
      - config/v213-serenity-evidence-freshness-policy.json
      - config/v213-serenity-public-logic-policy.json
      - config/v213-market-corroboration-degradation-policy.json
      - scripts/audit_v213_serenity_release_v2.ps1
      - scripts/build_v213_activation_bundle.py
      - scripts/build_v213_activation_bundle_v2.py
      - scripts/v213_source_independence_gate.py
      - scripts/v213_source_independence_gate_v2.py
      - scripts/v213_source_independence_gate_v3.py
      - scripts/ci_v213_hotfix6_validate.ps1
      - scripts/ci_v213_hotfix6_package.ps1
      - activate-v213-seven-field-schedule-core.ps1
      - cloud/src/v213/activation-v2.ts
      - cloud/test/v213-activation.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-intelligence-v213-serenity-freshness-audited-delivery
  cancel-in-progress: true

jobs:
  audited-delivery:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      SOURCE_DIR: ${{ github.workspace }}\serenity-audited-${{ github.run_id }}

    steps:
      - name: Checkout exact source into isolated directory
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: serenity-audited-${{ github.run_id }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Audit Serenity public logic, source independence and freshness
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $audit = Join-Path $env:RUNNER_TEMP "Investor-Intelligence-v2.1.3-Serenity-Freshness-Audit-$env:GITHUB_RUN_ID.json"
          .\scripts\audit_v213_serenity_release_v2.ps1 -ProjectRoot $PWD.Path -OutputPath $audit
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $audit -PathType Leaf)) {
            throw 'Serenity freshness release audit did not produce a PASS receipt.'
          }
          "SERENITY_AUDIT=$audit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run complete Windows no-mutation qualification
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          .\scripts\ci_v213_hotfix6_validate.ps1 -ProjectRoot $PWD.Path

      - name: Compile, package and independently verify audited Hotfix6
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          .\scripts\ci_v213_hotfix6_package.ps1 -ProjectRoot $PWD.Path

      - name: Upload audited Hotfix6 delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Investor-Intelligence-v2.1.3-Hotfix6-Serenity-Freshness-Audited-Delivery
          path: |
            ${{ env.HF6_ZIP }}
            ${{ env.HF6_SHA_FILE }}
            ${{ env.HF6_VERIFICATION }}
            ${{ env.HF6_VALIDATION }}
            ${{ env.SERENITY_AUDIT }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## v2.1.3 Serenity Freshness Audited Delivery
          - Public-logic reconstruction only; no private or official Serenity formula claim: PASS
          - Final Top20 per-ticker claim families >= 2: PASS
          - Final Top20 per-ticker claim domains >= 2: PASS
          - Final Top20 per-ticker primary claim source >= 1: PASS
          - Positive advantage factors require fresh multi-source support: PASS
          - Same domain, same publisher family and syndicated copies do not multiply independence: PASS
          - Stale LIVE/CACHED market data rejected: PASS
          - Market data and macro context cannot prove company advantages: PASS
          - Source conflicts retained and never averaged: PASS
          - Latest same-run seven-payload bundle: PASS
          - Atomic pointer-last commit and exact rollback: PASS
          - Production mutation by CI: false
          - ZIP SHA-256: ``$env:HF6_SHA``
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
