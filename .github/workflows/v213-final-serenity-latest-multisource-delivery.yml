name: V2.1.3 Final Serenity Latest Multi-Source Delivery

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-final-serenity-latest-multisource-delivery.yml
      - scripts/normalize_v213_final_source_gate.ps1
      - scripts/audit_v213_serenity_release_v6.ps1
      - scripts/audit_v213_generated_snapshot_v2.ps1
      - scripts/audit_v213_generated_snapshot_v4.ps1
      - scripts/v213_source_independence_gate.py
      - scripts/v213_source_independence_gate_v2.py
      - scripts/v213_source_independence_gate_v3.py
      - scripts/v213_source_independence_gate_v4.py
      - scripts/build_v213_activation_bundle.py
      - scripts/build_v213_activation_bundle_v2.py
      - scripts/test_v213_activation_core.ps1
      - scripts/ci_v213_hotfix6_validate.ps1
      - scripts/ci_v213_hotfix6_package.ps1
      - config/v213-serenity-evidence-freshness-policy.json
      - config/v213-serenity-public-logic-policy.json
      - config/v213-market-corroboration-degradation-policy.json
      - run-v213-local-source-diverse.ps1
      - activate-v213-seven-field-schedule-core.ps1
      - sync-v213-activation-bundle.ps1
      - cloud/src/v213/activation-v2.ts
      - cloud/test/v213-activation.test.ts
      - docs/V213_SERENITY_LOGIC_SOURCE_DIVERSITY_AUDIT.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investor-intelligence-v213-serenity-freshness-audited-delivery
  cancel-in-progress: true

jobs:
  final-latest-multisource-delivery:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      SOURCE_DIR: ${{ github.workspace }}\final-latest-multisource-${{ github.run_id }}
      TARGET_BRANCH: development/v2.1.3-serenity-public-logic-fidelity

    steps:
      - name: Checkout writable target branch into isolated directory
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: development/v2.1.3-serenity-public-logic-fidelity
          path: final-latest-multisource-${{ github.run_id }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: true

      - name: Normalize stable v3 entrypoint and latest-data policy
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          .\scripts\normalize_v213_final_source_gate.ps1 -ProjectRoot $PWD.Path
          git config user.name "Investor Intelligence Release Bot"
          git config user.email "investor-intelligence-release-bot@users.noreply.github.com"
          git add -- scripts/v213_source_independence_gate_v3.py config/v213-serenity-evidence-freshness-policy.json
          git diff --cached --quiet
          $diffCode = $LASTEXITCODE
          if ($diffCode -eq 1) {
            git commit -m "fix: normalize final v4 source gate and latest-data policy"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to commit normalized final source gate.' }
            git push origin "HEAD:refs/heads/$env:TARGET_BRANCH"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to push normalized final source gate.' }
          }
          elseif ($diffCode -ne 0) {
            throw "git diff --cached failed with exit code $diffCode"
          }
          $effective = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $effective -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve effective normalized commit SHA.'
          }
          "EFFECTIVE_SHA=$effective" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "V213_EFFECTIVE_SOURCE_COMMIT = $effective" -ForegroundColor Cyan

      - name: Audit final static Serenity and source-independence contract
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $env:GITHUB_SHA = $env:EFFECTIVE_SHA
          $audit = Join-Path $env:RUNNER_TEMP "Investor-Intelligence-v2.1.3-Serenity-Static-Audit-$env:GITHUB_RUN_ID.json"
          .\scripts\audit_v213_serenity_release_v6.ps1 -ProjectRoot $PWD.Path -OutputPath $audit
          if (-not (Test-Path -LiteralPath $audit -PathType Leaf)) {
            throw 'Final static Serenity audit receipt is missing.'
          }
          $receipt = Get-Content -LiteralPath $audit -Raw -Encoding utf8 | ConvertFrom-Json
          if ($receipt.status -ne 'PASS') { throw 'Final static Serenity audit is not PASS.' }
          "SERENITY_STATIC_AUDIT=$audit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run complete Windows no-mutation qualification
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $env:GITHUB_SHA = $env:EFFECTIVE_SHA
          .\scripts\ci_v213_hotfix6_validate.ps1 -ProjectRoot $PWD.Path

      - name: Audit exact generated seven-payload snapshot and latest data
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $env:GITHUB_SHA = $env:EFFECTIVE_SHA
          $audit = Join-Path $env:RUNNER_TEMP "Investor-Intelligence-v2.1.3-Generated-Snapshot-Audit-$env:GITHUB_RUN_ID.json"
          .\scripts\audit_v213_generated_snapshot_v4.ps1 -ProjectRoot $PWD.Path -OutputPath $audit
          if (-not (Test-Path -LiteralPath $audit -PathType Leaf)) {
            throw 'Final generated-snapshot audit receipt is missing.'
          }
          $receipt = Get-Content -LiteralPath $audit -Raw -Encoding utf8 | ConvertFrom-Json
          if ($receipt.status -ne 'PASS') { throw 'Final generated-snapshot audit is not PASS.' }
          "SERENITY_SNAPSHOT_AUDIT=$audit" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile, package and independently verify final build
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $env:GITHUB_SHA = $env:EFFECTIVE_SHA
          .\scripts\ci_v213_hotfix6_package.ps1 -ProjectRoot $PWD.Path

      - name: Verify packaged source gate, policy, receipts and ZIP hash
        shell: pwsh
        run: |
          foreach ($path in @(
            $env:HF6_ZIP,$env:HF6_SHA_FILE,$env:HF6_VERIFICATION,$env:HF6_VALIDATION,
            $env:SERENITY_STATIC_AUDIT,$env:SERENITY_SNAPSHOT_AUDIT
          )) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Final delivery file is missing: $path"
            }
          }
          $expected = (Get-Content -LiteralPath $env:HF6_SHA_FILE -Raw -Encoding ascii).Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $env:HF6_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual -or $actual -ne $env:HF6_SHA.ToLowerInvariant()) {
            throw "Final ZIP digest mismatch; expected=$expected actual=$actual env=$env:HF6_SHA"
          }
          $check = Join-Path $env:RUNNER_TEMP ("ii-v213-final-latest-package-check-" + [guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $env:HF6_ZIP -DestinationPath $check
          try {
            foreach ($relative in @(
              'scripts\v213_source_independence_gate_v3.py',
              'scripts\v213_source_independence_gate_v4.py',
              'scripts\build_v213_activation_bundle_v2.py',
              'config\v213-serenity-evidence-freshness-policy.json'
            )) {
              if (-not (Test-Path -LiteralPath (Join-Path $check $relative) -PathType Leaf)) {
                throw "Final package is missing: $relative"
              }
            }
            $entry = Get-Content -LiteralPath (Join-Path $check 'scripts\v213_source_independence_gate_v3.py') -Raw -Encoding utf8
            if (-not $entry.Contains('v213_source_independence_gate_v4.py')) { throw 'Packaged v3 entrypoint does not delegate to v4.' }
            $implementation = Get-Content -LiteralPath (Join-Path $check 'scripts\v213_source_independence_gate_v4.py') -Raw -Encoding utf8
            foreach ($marker in @(
              'MIN_HIGH_CONFIDENCE_MARKET_PROVIDERS = 2',
              'MARKET_HIGH_CONFIDENCE_FRESHEST_MAX_AGE_DAYS = 4.0',
              'market_conflicts_compared_pairwise_without_yahoo_authority',
              'worker_degradation_schema_compatible=true'
            )) {
              if (-not $implementation.Contains($marker)) { throw "Packaged v4 source gate marker is missing: $marker" }
            }
            $policy = Get-Content -LiteralPath (Join-Path $check 'config\v213-serenity-evidence-freshness-policy.json') -Raw -Encoding utf8 | ConvertFrom-Json
            if (
              [double]$policy.current_state_claim_max_age_days -gt 135 -or
              [double]$policy.market_observation_max_age_days -gt 7 -or
              [double]$policy.market_high_confidence_freshest_max_age_days -gt 4 -or
              [double]$policy.market_comparable_provider_max_lag_days -gt 3 -or
              [int]$policy.minimum_independent_market_providers_for_high_confidence -lt 2 -or
              $policy.latest_available_evidence_must_be_selected -ne $true
            ) { throw 'Packaged latest-data policy was weakened.' }
          }
          finally {
            Remove-Item -LiteralPath $check -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host "V213_FINAL_LATEST_MULTISOURCE_PACKAGE = PASS; commit=$env:EFFECTIVE_SHA; sha256=$actual" -ForegroundColor Green

      - name: Upload final latest multi-source audited delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Investor-Intelligence-v2.1.3-Hotfix6-Final-Latest-MultiSource-Audited-Delivery
          path: |
            ${{ env.HF6_ZIP }}
            ${{ env.HF6_SHA_FILE }}
            ${{ env.HF6_VERIFICATION }}
            ${{ env.HF6_VALIDATION }}
            ${{ env.SERENITY_STATIC_AUDIT }}
            ${{ env.SERENITY_SNAPSHOT_AUDIT }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## v2.1.3 Final Serenity Latest Multi-Source Delivery
          - Effective normalized commit: ``$env:EFFECTIVE_SHA``
          - Public-source reconstruction only; no private/official Serenity formula claim: PASS
          - Keyword, growth, margin or price shortcuts cannot prove an advantage: PASS
          - Every final ticker has >=2 claim families, >=2 domains and primary evidence: PASS
          - Every positive advantage has fresh primary plus fresh independent non-primary corroboration: PASS
          - Current-state company evidence maximum age: 135 days
          - Market hard maximum age: 7 days
          - High-confidence freshest market maximum age: 4 days
          - Comparable provider date lag maximum: 3 days
          - High-confidence market inference requires two comparable independent providers: PASS
          - Same metric basis is required before return comparison: PASS
          - Yahoo is compatibility calculation only, never authoritative corroboration: PASS
          - Independent-provider conflicts are pairwise and never averaged: PASS
          - Stale/undated providers cannot count: PASS
          - Latest available publication/as-of must be selected: PASS
          - Seven payload digests and identical Top20 order: PASS
          - Atomic pointer-last commit, idempotent replay and exact rollback: PASS
          - Real Windows no-mutation qualification and packaged runtime verification: PASS
          - Production mutation by qualification/packaging: false
          - ZIP SHA-256: ``$env:HF6_SHA``
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
