name: V2.1.3 Final Serenity Latest Multi-Source R70 Delivery

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-final-serenity-latest-multisource-r70.yml
      - config/v213-serenity-latest-multisource-policy-v5.json
      - config/v213-serenity-methodology-lineage-v1.json
      - scripts/v213_refresh_serenity_public_sources.py
      - scripts/v213_serenity_latest_multisource_audit.py
      - scripts/v213_tam_capture_claim_guard.py
      - scripts/v213_serenity_latest_static_audit.py
      - run-v213-local-serenity-latest.ps1
      - activate-v213-seven-field-schedule-serenity-latest.ps1
      - install-v213-serenity-latest-runtime.ps1
      - scripts/ci_v213_r70_validate.ps1
      - scripts/ci_v213_r70_package.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-intelligence-v213-serenity-latest-r70
  cancel-in-progress: true

jobs:
  delivery:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_DIR: ${{ github.workspace }}\r70-${{ github.run_id }}

    steps:
      - name: Checkout exact R70 source into isolated directory
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: r70-${{ github.run_id }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Validate Serenity logic, source diversity, freshness and Windows runtime
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          .\scripts\ci_v213_r70_validate.ps1 -ProjectRoot $PWD.Path

      - name: Compile, package, verify and copy delivery to Desktop
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          .\scripts\ci_v213_r70_package.ps1 -ProjectRoot $PWD.Path

      - name: Upload final R70 one-click package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Investor-Intelligence-v2.1.3-Serenity-Latest-MultiSource-R70
          path: |
            ${{ env.R70_ZIP }}
            ${{ env.R70_SHA_FILE }}
            ${{ env.R70_VERIFICATION }}
            ${{ env.R70_RECEIPT }}
            ${{ env.R70_VALIDATION }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## Investor Intelligence v2.1.3 Serenity Latest Multi-Source R70
          - Latest public Serenity metadata verified at run time: PASS
          - Public-post source used as company-fact authority: false
          - Per-ticker claim source families/domains/primary gates: PASS
          - Two comparable non-Yahoo providers required for high confidence: PASS
          - Yahoo used as truth anchor: false
          - Source values averaged: false
          - Market, company, macro and snapshot freshness gates: PASS
          - Serenity factor-to-evidence ledger: PASS
          - Severe thesis-killer precedence: PASS
          - Layer-first / three-plus value-chain layers: PASS
          - Worker, PowerShell 7, Windows PowerShell 5.1 and EXE tests: PASS
          - Real Windows no-mutation refresh: PASS
          - Atomic seven-payload bundle and exact rollback: PASS
          - Production mutation by CI: false
          - Desktop delivery: ``$env:R70_DESKTOP``
          - ZIP SHA-256: ``$env:R70_SHA``
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
