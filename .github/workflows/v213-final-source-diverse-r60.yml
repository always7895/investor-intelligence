name: V2.1.3 Final Source-Diverse R60

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-intelligence-v213-final-source-diverse-r60
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'

    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Prepare verified Python with hash-locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\resolve_python.ps1 -VenvPath .venv-v213-r60
          & $env:PROJECT_PYTHON -m pip install --isolated --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple --require-hashes -r requirements-ci.txt
          if($LASTEXITCODE-ne0){throw 'Hash-locked Python dependency installation failed.'}
          & $env:PROJECT_PYTHON -m pip check
          if($LASTEXITCODE-ne0){throw 'Python dependency check failed.'}

      - name: Validate Serenity policy, source diversity and bilingual schemas
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $commands=@(
            @('scripts\reconcile_v213_order_evidence.py','--self-test'),
            @('scripts\build_v213_scheduled_top20_report.py','--self-test'),
            @('scripts\v213_source_independence_gate.py','--self-test'),
            @('scripts\v213_source_independence_gate_v2.py','--wrapper-self-test'),
            @('scripts\v213_local_llm_gateway.py','--self-test'),
            @('scripts\audit_v213_bilingual_public_fields.py'),
            @('scripts\audit_v213_source_diversity_fields.py')
          )
          foreach($command in $commands){
            & $env:PROJECT_PYTHON @command
            if($LASTEXITCODE-ne0){throw "Python/audit test failed: $($command -join ' ')"}
          }
          & $env:PROJECT_PYTHON -m compileall -q scripts
          if($LASTEXITCODE-ne0){throw 'Python compileall failed.'}
          $policy=Get-Content config\v213-serenity-public-logic-policy.json -Raw -Encoding utf8|ConvertFrom-Json
          if($policy.non_claims.private_method_reproduced-ne$false){throw 'Policy claims private-method reproduction.'}
          if($policy.non_claims.official_serenity_formula-ne$false){throw 'Policy claims an official Serenity formula.'}
          if($policy.non_claims.official_serenity_score-ne$false){throw 'Policy claims an official Serenity score.'}
          if([int]$policy.minimums.portfolio_independent_source_families-lt3){throw 'Independent source-family floor is below 3.'}
          if([int]$policy.minimums.portfolio_independent_domains-lt3){throw 'Independent-domain floor is below 3.'}
          if([double]$policy.minimums.non_yahoo_market_coverage_ratio-lt.75){throw 'Non-Yahoo market coverage floor is below 75%.'}
          if([double]$policy.minimums.maximum_single_family_share-gt.70){throw 'Maximum source-family concentration is above 70%.'}
          Write-Host 'R60_SERENITY_SOURCE_AND_BILINGUAL_POLICY = PASS'

      - name: Typecheck and run complete Worker regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\resolve_node.ps1 -MinimumVersion 22.0.0
          Push-Location cloud
          try{
            npm.cmd ci --ignore-scripts --no-audit --no-fund
            if($LASTEXITCODE-ne0){throw 'npm ci failed.'}
            npm.cmd run typecheck
            if($LASTEXITCODE-ne0){throw 'TypeScript typecheck failed.'}
            npm.cmd test
            if($LASTEXITCODE-ne0){throw 'Worker tests failed.'}
          }finally{Pop-Location}

      - name: Parse PowerShell 7 and Windows PowerShell 5.1; run safe self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(
            'run-v213-local-source-diverse.ps1',
            'run-v213-local-llm-bridge-source-diverse.ps1',
            'scripts\run_v213_local_llm_bridge_core.ps1',
            'scripts\run_v213_local_llm_bridge_core_v2.ps1',
            'activate-v213-seven-field-schedule.ps1',
            'install-v213-source-diverse-runtime-v2.ps1',
            'install-v213-runtime.ps1',
            'register-v213-refresh-tasks.ps1',
            'sync-v213-top20-report.ps1'
          )
          foreach($path in $paths){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Out-String|Write-Host;throw "$path PowerShell 7 parser errors"}
          }
          $probe=Join-Path $env:RUNNER_TEMP 'v213-r60-ps51-parse.ps1'
          @'
          param([string[]]$Paths)
          foreach($path in $Paths){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Out-String|Write-Host;exit 1}
          }
          '@|Set-Content $probe -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $probe -Paths $paths
          if($LASTEXITCODE-ne0){throw 'Windows PowerShell 5.1 parser gate failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\run-v213-local-llm-bridge-source-diverse.ps1 -ProjectRoot $PWD.Path -SelfTest
          if($LASTEXITCODE-ne0){throw 'StrictMode-safe HealthSchema2 bridge self-test failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\activate-v213-seven-field-schedule.ps1 -SelfTest
          if($LASTEXITCODE-ne0){throw 'Activation JSON/health self-test failed.'}
          Write-Host 'R60_POWERSHELL_AND_SAFE_SELF_TESTS = PASS'

      - name: Audit final source-diverse implementation contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $refresh=Get-Content run-v213-local-source-diverse.ps1 -Raw -Encoding utf8
          $bridgeWrapper=Get-Content run-v213-local-llm-bridge-source-diverse.ps1 -Raw -Encoding utf8
          $bridge=Get-Content scripts\run_v213_local_llm_bridge_core.ps1 -Raw -Encoding utf8
          $bridgeV2=Get-Content scripts\run_v213_local_llm_bridge_core_v2.ps1 -Raw -Encoding utf8
          $gateway=Get-Content scripts\v213_local_llm_gateway.py -Raw -Encoding utf8
          $source=Get-Content scripts\v213_source_independence_gate.py -Raw -Encoding utf8
          $sourceV2=Get-Content scripts\v213_source_independence_gate_v2.py -Raw -Encoding utf8
          $activation=Get-Content activate-v213-seven-field-schedule.ps1 -Raw -Encoding utf8
          foreach($needle in @('reconcile_v213_order_evidence.py','v213_source_independence_gate_v2.py','--enforce','order evidence reconciled before source audit')){if(-not$refresh.Contains($needle)){throw "Refresh contract missing: $needle"}}
          foreach($needle in @('run_v213_local_llm_bridge_core_v2.ps1','@PSBoundParameters')){if(-not$bridgeWrapper.Contains($needle)){throw "Bridge wrapper contract missing: $needle"}}
          foreach($needle in @('Get-ObjectPropertyValue','Resolve-GatewayPort','health_schema_version','v213-local-llm-gateway','Test-HealthModel')){if(-not$bridge.Contains($needle)){throw "Bridge core contract missing: $needle"}}
          foreach($needle in @('import requests','bootstrap_portable_python.ps1','--require-hashes')){if(-not$bridgeV2.Contains($needle)){throw "Bridge dependency contract missing: $needle"}}
          foreach($needle in @('SOURCE-INDEPENDENCE RULES','v213_source_independence_latest.json','cap confidence at LIMITED','Yahoo/yfinance','Conflicting sources')){if(-not$gateway.Contains($needle)){throw "Gateway fidelity contract missing: $needle"}}
          foreach($needle in @('stooq_daily_csv','nasdaq_historical_api','fred_official_macro','evidence_independence_score','source_diversity_is_not_truth_by_itself','CACHE_MAX_AGE_SECONDS')){if(-not$source.Contains($needle)){throw "Source gate contract missing: $needle"}}
          foreach($needle in @('stlouisfed.org','official_macro')){if(-not$sourceV2.Contains($needle)){throw "FRED normalization fix missing: $needle"}}
          foreach($needle in @('V213_SOURCE_INDEPENDENCE_PREFLIGHT','health-schema-v2','install-v213-source-diverse-runtime.ps1','rollback')){if(-not$activation.Contains($needle)){throw "Activation contract missing: $needle"}}
          Write-Host 'R60_SOURCE_DIVERSE_IMPLEMENTATION_AUDIT = PASS'

      - name: Integration-test exact model, HealthSchema2 and occupied unknown port
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $testRoot=Join-Path $env:RUNNER_TEMP ('v213-r60-gateway-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $testRoot|Out-Null
          $savedLocal=$env:LOCALAPPDATA
          $env:LOCALAPPDATA=Join-Path $testRoot 'LocalAppData'
          $model='RVN-Q6_K-multilingual-mtp'
          $upstreamPort=19121
          $occupiedPort=18861
          $server=Join-Path $testRoot 'fake_llama.py'
          @'
          import json,sys
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          model=sys.argv[2]
          class H(BaseHTTPRequestHandler):
              def log_message(self,*args): pass
              def respond(self,obj):
                  raw=json.dumps(obj).encode('utf-8')
                  self.send_response(200);self.send_header('content-type','application/json');self.send_header('content-length',str(len(raw)));self.end_headers();self.wfile.write(raw)
              def do_GET(self):
                  self.respond({'data':[{'id':model}]} if 'models' in self.path else {'ok':True})
              def do_POST(self):
                  self.rfile.read(int(self.headers.get('content-length','0')))
                  self.respond({'choices':[{'message':{'role':'assistant','content':'OK'}}]})
          ThreadingHTTPServer(('127.0.0.1',int(sys.argv[1])),H).serve_forever()
          '@|Set-Content $server -Encoding utf8
          $fake=Start-Process -FilePath $env:PROJECT_PYTHON -ArgumentList @($server,[string]$upstreamPort,$model) -PassThru -WindowStyle Hidden
          $occupier=Start-Process -FilePath $env:PROJECT_PYTHON -ArgumentList @('-m','http.server',[string]$occupiedPort,'--bind','127.0.0.1') -PassThru -WindowStyle Hidden
          try{
            Start-Sleep -Seconds 2
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\run-v213-local-llm-bridge-source-diverse.ps1 -ProjectRoot $PWD.Path -LlamaBaseUrl "http://127.0.0.1:$upstreamPort" -GatewayPort $occupiedPort -Model $model -NoTunnel -StopExisting
            if($LASTEXITCODE-ne0){throw 'Source-diverse bridge integration run failed.'}
            $statePath=Join-Path $env:LOCALAPPDATA 'InvestorIntelligence\UserData\config\v213-local-model.json'
            $state=Get-Content $statePath -Raw -Encoding utf8|ConvertFrom-Json
            if([int]$state.gateway_port-eq$occupiedPort){throw 'Occupied unknown port was reused.'}
            if([string]$state.model-ne$model){throw 'Exact selected model was changed.'}
            if([int]$state.health_schema_version-ne2){throw 'Persisted HealthSchema version is not 2.'}
            $health=Invoke-RestMethod -Method Get -Uri ([string]$state.gateway_url+'/health') -TimeoutSec 10
            if([string]$health.service-ne'v213-local-llm-gateway'){throw 'v2.1.3 gateway service identity is missing.'}
            if([int]$health.health_schema_version-ne2){throw 'Gateway HealthSchema2 response is missing.'}
            if($health.selected_model_available-ne$true-or[string]$health.selected_model-ne$model){throw 'Exact selected model did not pass gateway health.'}
            if(-not(Get-Process -Id $occupier.Id -ErrorAction SilentlyContinue)){throw 'Unknown port owner was incorrectly terminated.'}
            Write-Host "R60_HEALTH_SCHEMA2_EXACT_MODEL_INTEGRATION = PASS; gateway_port=$($state.gateway_port); model=$model"
          }finally{
            try{
              $state=Get-Content (Join-Path $env:LOCALAPPDATA 'InvestorIntelligence\UserData\config\v213-local-model.json') -Raw -Encoding utf8|ConvertFrom-Json
              Stop-Process -Id ([int]$state.gateway_pid) -Force -ErrorAction SilentlyContinue
            }catch{}
            Stop-Process -Id $fake.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $occupier.Id -Force -ErrorAction SilentlyContinue
            $env:LOCALAPPDATA=$savedLocal
            Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Compile ModelSelect launcher with R60 revision
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc=@(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )|Where-Object{Test-Path $_ -PathType Leaf}|Select-Object -First 1
          if(-not$csc){throw 'csc.exe is unavailable.'}
          $source=Get-Content launcher\InvestorIntelligenceLauncher.cs -Raw -Encoding utf8
          $source=$source.Replace('const string Revision = "ModelSelect-R43";','const string Revision = "SourceDiverse-R60";')
          $temporarySource=Join-Path $env:RUNNER_TEMP 'InvestorIntelligenceLauncher-R60.cs'
          [IO.File]::WriteAllText($temporarySource,$source,[Text.UTF8Encoding]::new($false))
          $exe=Join-Path $env:RUNNER_TEMP 'InvestorIntelligence.exe'
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll "/out:$exe" $temporarySource
          if($LASTEXITCODE-ne0){throw 'R60 launcher compilation failed.'}
          foreach($argument in @('--pipe-hold-self-test','--model-selection-self-test')){
            $process=Start-Process -FilePath $exe -ArgumentList $argument -PassThru
            if(-not$process.WaitForExit(20000)){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue;throw "Launcher self-test timed out: $argument"}
            if($process.ExitCode-ne0){throw "Launcher self-test failed: $argument / $($process.ExitCode)"}
          }
          "R60_EXE=$exe"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'R60_MODELSELECT_LAUNCHER = PASS'

      - name: Build final one-click source-diverse ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP "ii-v213-r60-$env:GITHUB_RUN_ID"
          $stage=Join-Path $root 'Investor-Intelligence-v2.1.3-SourceDiverse-R60'
          $versions=Join-Path $stage 'versions'
          New-Item -ItemType Directory -Force -Path $stage,$versions|Out-Null
          $refs=[ordered]@{
            '2.1.0'='bbc2987e54eccef350685447b48e1841c4e5ba19'
            '2.1.1'='22593c82743ad97aff91469ba001700d2a384c48'
            '2.1.2'='1a36935bf8532be074707eeb7f941d8a46be6ca9'
            '2.1.3'=$env:GITHUB_SHA.ToLowerInvariant()
          }
          foreach($entry in $refs.GetEnumerator()){
            $archive=Join-Path $versions ("Investor-Intelligence-v$($entry.Key)-source.zip")
            git archive --format=zip --output="$archive" $entry.Value
            if($LASTEXITCODE-ne0){throw "git archive failed for v$($entry.Key)"}
          }
          Expand-Archive (Join-Path $versions 'Investor-Intelligence-v2.1.3-source.zip') $stage -Force
          Copy-Item -LiteralPath (Join-Path $stage 'run-v213-local-source-diverse.ps1') -Destination (Join-Path $stage 'run-v213-local.ps1') -Force
          Copy-Item -LiteralPath (Join-Path $stage 'run-v213-local-llm-bridge-source-diverse.ps1') -Destination (Join-Path $stage 'run-v213-local-llm-bridge.ps1') -Force
          Copy-Item -LiteralPath (Join-Path $stage 'install-v213-source-diverse-runtime-v2.ps1') -Destination (Join-Path $stage 'install-v213-source-diverse-runtime.ps1') -Force
          Remove-Item -LiteralPath (Join-Path $stage 'tmp') -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $env:R60_EXE -Destination (Join-Path $stage 'InvestorIntelligence.exe') -Force
          [ordered]@{
            schema_version=5
            package_version='2.1.3'
            launcher_revision='SourceDiverse-R60'
            current_commit=$env:GITHUB_SHA.ToLowerInvariant()
            versions=$refs
            local_model=[ordered]@{
              explicit_selector=$true
              preferred_model='RVN-Q6_K-multilingual-mtp'
              silent_model_substitution=$false
              health_schema_version=2
              stale_or_unknown_gateway_port_reused=$false
              unknown_port_owner_killed=$false
              bridge_dependency_bootstrap='hash_locked_portable_python'
            }
            serenity_public_logic=[ordered]@{
              label='public-logic high-fidelity reconstruction'
              private_method_reproduced=$false
              official_formula=$false
              official_score=$false
              state_machine=@('UNPROVEN','EVIDENCE_FORMING','COMMERCIAL_VALIDATION','INSTITUTIONAL_VALIDATION','THESIS_IMPAIRED','THESIS_BROKEN')
            }
            source_fidelity=[ordered]@{
              policy='config/v213-serenity-public-logic-policy.json'
              gate='scripts/v213_source_independence_gate_v2.py'
              sidecar='data/cache/v213_source_independence_latest.json'
              observation_cache_max_hours=72
              calculation_source='yfinance_adjusted_close_compatibility_only'
              independent_market_sources=@('stooq_daily_csv','nasdaq_historical_api','optional_alpha_vantage_adjusted')
              official_macro_source='fred_official_macro'
              primary_sources=@('SEC/regulatory filings','issuer primary disclosures')
              minimum_non_yahoo_market_coverage=.75
              duplicate_or_syndicated_sources_count_once=$true
              same_domain_or_corporate_family_counts_once=$true
              source_conflicts_are_averaged=$false
              single_source_high_confidence_inference=$false
            }
            bilingual_fields=@('config/field-labels.zh-en.json','config/v213-source-diversity-field-labels.zh-en.json')
            schedule=@('08:00 Asia/Taipei','21:00 Asia/Taipei')
            local_refresh=@('07:20','20:20')
            production_deployment_performed_by_packaging=$false
          }|ConvertTo-Json -Depth 12|Set-Content (Join-Path $stage 'VERSION-REFS.json') -Encoding utf8
          $manifest=@()
          Get-ChildItem $stage -File -Recurse|ForEach-Object{
            $manifest+=[ordered]@{
              path=$_.FullName.Substring($stage.Length+1).Replace('\','/')
              bytes=$_.Length
              sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{schema_version=5;commit=$env:GITHUB_SHA.ToLowerInvariant();generated_utc=(Get-Date).ToUniversalTime().ToString('o');files=$manifest}|ConvertTo-Json -Depth 12|Set-Content (Join-Path $stage 'MANIFEST.json') -Encoding utf8
          Get-ChildItem $stage -File -Recurse|ForEach-Object{
            '{0}  {1}'-f(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.FullName.Substring($stage.Length+1).Replace('\','/')
          }|Set-Content (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          $zip=Join-Path $root 'Investor-Intelligence-v2.1.3-SourceDiverse-R60.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaFile=$zip+'.sha256'
          Set-Content -LiteralPath $shaFile -Value $sha -Encoding ascii
          "R60_ZIP=$zip"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "R60_SHA_FILE=$shaFile"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "R60_SHA=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "R60_FINAL_ZIP_SHA256=$sha"

      - name: Verify final package and stable source-diverse runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $check=Join-Path $env:RUNNER_TEMP "ii-v213-r60-check-$env:GITHUB_RUN_ID"
          $stable=Join-Path $env:RUNNER_TEMP "ii-v213-r60-stable-$env:GITHUB_RUN_ID"
          Expand-Archive $env:R60_ZIP $check
          foreach($file in @(
            'InvestorIntelligence.exe',
            'run-v213-local.ps1',
            'run-v213-local-llm-bridge.ps1',
            'scripts\run_v213_local_llm_bridge_core_v2.ps1',
            'scripts\v213_source_independence_gate_v2.py',
            'config\v213-serenity-public-logic-policy.json',
            'config\v213-source-diversity-field-labels.zh-en.json',
            'install-v213-source-diverse-runtime.ps1',
            'VERSION-REFS.json','MANIFEST.json','SHA256SUMS.txt'
          )){if(-not(Test-Path -LiteralPath (Join-Path $check $file) -PathType Leaf)){throw "Final package missing: $file"}}
          if(Test-Path -LiteralPath (Join-Path $check 'tmp')){throw 'Temporary probe directory leaked into final package.'}
          $localScript=Get-Content (Join-Path $check 'run-v213-local.ps1') -Raw -Encoding utf8
          if(-not$localScript.Contains('v213_source_independence_gate_v2.py')){throw 'Canonical packaged refresh script is not source-diverse.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $check 'run-v213-local-llm-bridge.ps1') -ProjectRoot $check -SelfTest
          if($LASTEXITCODE-ne0){throw 'Packaged bridge HealthSchema2 self-test failed.'}
          & $env:PROJECT_PYTHON (Join-Path $check 'scripts\v213_source_independence_gate_v2.py') --wrapper-self-test
          if($LASTEXITCODE-ne0){throw 'Packaged FRED source-family normalization self-test failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $check 'install-v213-source-diverse-runtime.ps1') -ProjectRoot $check -RuntimeRoot $stable
          if($LASTEXITCODE-ne0){throw 'Stable source-diverse runtime installation failed.'}
          foreach($file in @(
            'run-v213-local.ps1','run-v213-local-llm-bridge.ps1',
            'scripts\run_v213_local_llm_bridge_core_v2.ps1',
            'scripts\v213_source_independence_gate_v2.py',
            'config\v213-serenity-public-logic-policy.json',
            'V213-SOURCE-DIVERSE-RUNTIME.json'
          )){if(-not(Test-Path -LiteralPath (Join-Path $stable $file) -PathType Leaf)){throw "Stable runtime missing: $file"}}
          $stableScript=Get-Content (Join-Path $stable 'run-v213-local.ps1') -Raw -Encoding utf8
          if(-not$stableScript.Contains('v213_source_independence_gate_v2.py')){throw 'Stable runtime refresh script lost source-diverse gate.'}
          Write-Host 'R60_FINAL_PACKAGE_AND_STABLE_RUNTIME = PASS'

      - name: Upload R60 one-click package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Investor-Intelligence-v2.1.3-SourceDiverse-R60
          path: |
            ${{ env.R60_ZIP }}
            ${{ env.R60_SHA_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## Investor Intelligence v2.1.3 SourceDiverse-R60
          - Explicit model selector; preferred RVN-Q6_K-multilingual-mtp: PASS
          - Silent model substitution: blocked
          - StrictMode-safe HealthSchema2 and unknown occupied-port recovery: PASS
          - Order evidence reconciled before source-independence audit: PASS
          - Yahoo/yfinance role: compatibility calculation only
          - Independent market sources: Stooq, Nasdaq, optional Alpha Vantage
          - Official macro: FRED (normalized as official_macro)
          - Primary evidence: SEC/regulatory and issuer disclosures
          - Duplicate/syndicated/same-domain inflation: blocked
          - Conflicts retained; single-source HIGH-confidence inference: blocked
          - Serenity private method / official formula or score claimed: false
          - Bilingual public + source-diversity schemas: PASS
          - Production deployment performed by this workflow: false
          - Final ZIP SHA-256: ``$env:R60_SHA``
          "@|Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
