name: V2.1.3 Hotfix5 Core Self-Test Patch

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-hotfix5-core-selftest-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: development/v2.1.3-serenity-public-logic-fidelity
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Replace batch emitter with encoded PowerShell emitter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'activate-v213-seven-field-schedule-core.ps1'
          $text = Get-Content -LiteralPath $path -Raw -Encoding utf8
          $pattern = '(?s)    \$testCmd = Join-Path \$testRoot ''emit\.cmd''\r?\n.*?    finally \{ Remove-Item -LiteralPath \$testRoot -Recurse -Force -ErrorAction SilentlyContinue \}'
          $replacement = @'
    $powershell = (Get-Command powershell.exe -ErrorAction Stop).Source
    $json = '{"versions":[{"version_id":"' + $version + '","percentage":100}]}'
    $childScript = "[Console]::OutputEncoding=[Text.UTF8Encoding]::new(`$false);[Console]::Error.WriteLine('search...');[Console]::Out.WriteLine('$json');exit 0"
    $encodedCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($childScript))
    try {
        $captured = Invoke-NativeCapture $powershell @('-NoProfile','-NonInteractive','-EncodedCommand',$encodedCommand) $testRoot
        if ($captured.ExitCode -ne 0) { throw "Native capture self-test process failed. stderr=$($captured.Stderr)" }
        if ($captured.Stderr -notmatch 'search\.\.\.') { throw 'Native stderr was not captured separately.' }
        if ($captured.Stdout -match 'search\.\.\.') { throw 'Native stderr contaminated stdout.' }
        if ((Get-SingleActiveVersion $captured.Stdout) -ne $version) { throw 'Wrangler JSON parser self-test failed.' }
        & (Join-Path $ProjectRoot 'sync-v213-activation-bundle.ps1') -SelfTest
        if ($LASTEXITCODE -ne 0) { throw 'Activation transaction client self-test failed.' }
    }
    finally { Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue }
'@
          $matches = [regex]::Matches($text,$pattern)
          if ($matches.Count -ne 1) { throw "Expected one reviewed activation-core self-test block; found $($matches.Count)." }
          $updated = [regex]::Replace($text,$pattern,[Text.RegularExpressions.MatchEvaluator]{ param($match) $replacement },1)
          [IO.File]::WriteAllText((Resolve-Path $path),$updated,[Text.UTF8Encoding]::new($false))
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
          if ($errors.Count) { $errors | Out-String | Write-Host; throw 'Patched activation core has parser errors.' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\activate-v213-seven-field-schedule-core.ps1 -ProjectRoot $PWD.Path -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Patched activation-core self-test failed.' }
          Write-Host 'V213_HOTFIX5_CORE_SELFTEST_PATCH = PASS'

      - name: Commit source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.git\AUTO_MERGE.lock' -Force -ErrorAction SilentlyContinue
          if (-not (git status --porcelain)) { Write-Host 'NO_CHANGES'; exit 0 }
          git config user.name 'Investor Intelligence Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add activate-v213-seven-field-schedule-core.ps1
          git commit -m 'fix: use encoded PowerShell in activation-core capture test'
          git push origin HEAD:development/v2.1.3-serenity-public-logic-fidelity
          if ($LASTEXITCODE -ne 0) { throw 'Source patch push failed.' }
          Write-Host 'V213_HOTFIX5_CORE_SELFTEST_PATCH_COMMIT = PASS'
