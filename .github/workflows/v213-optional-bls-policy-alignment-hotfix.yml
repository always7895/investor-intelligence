name: V2.1.3 Optional BLS Activation Policy Alignment Hotfix

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-optional-bls-policy-alignment-hotfix.yml

permissions:
  contents: write

concurrency:
  group: investor-intelligence-v213-optional-bls-policy-alignment
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: development/v2.1.3-serenity-public-logic-fidelity
          fetch-depth: 0

      - name: Apply policy-aligned optional-BLS activation fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patchPath = '.github/patches/v213-optional-bls-policy-alignment.patch'
          git apply --check --inaccurate-eof --whitespace=nowarn $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Optional-BLS policy patch no longer applies cleanly.' }
          git apply --inaccurate-eof --whitespace=nowarn $patchPath
          if ($LASTEXITCODE -ne 0) { throw 'Optional-BLS policy patch failed.' }
          Remove-Item -LiteralPath $patchPath -Force
          Remove-Item -LiteralPath '.github/workflows/v213-optional-bls-policy-alignment-hotfix.yml' -Force

      - name: Run focused regression gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/v213_serenity_latest_static_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'Serenity latest static audit failed.' }
          python scripts/v213_source_federation.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source federation self-test failed.' }
          python scripts/v213_source_federation_gate.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source federation gate self-test failed.' }
          foreach ($script in @(
            'activate-v213-seven-field-schedule.ps1',
            'activate-v213-seven-field-schedule-serenity-latest.ps1',
            'activate-v213-diversified-schedule.ps1'
          )) {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script -ProjectRoot $PWD.Path -SelfTest
            if ($LASTEXITCODE -ne 0) { throw "Activation self-test failed: $script" }
          }
          if ((Get-FileHash 'activate-v213-seven-field-schedule.ps1' -Algorithm SHA256).Hash -ne (Get-FileHash 'activate-v213-seven-field-schedule-serenity-latest.ps1' -Algorithm SHA256).Hash) {
            throw 'Canonical activation and compatibility alias are not byte-identical.'
          }

      - name: Commit one atomic source fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Patched source contains whitespace errors.' }
          git commit -m 'fix: align activation with optional BLS federation policy'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit policy-aligned activation fix.' }
          git push origin HEAD:development/v2.1.3-serenity-public-logic-fidelity
          if ($LASTEXITCODE -ne 0) { throw 'Unable to push policy-aligned activation fix.' }
