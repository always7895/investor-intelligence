name: V2.1.3 All-in-One Distribution

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-intelligence-v213-all-in-one
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'

    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Validate Python, methodology and source-federation components
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\resolve_python.ps1 -VenvPath .venv-v213-package
          & $env:PROJECT_PYTHON -m pip install --isolated --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple --require-hashes -r requirements-ci.txt
          if($LASTEXITCODE -ne 0){throw 'Hash-locked Python dependency installation failed.'}
          & $env:PROJECT_PYTHON -m pip check
          if($LASTEXITCODE -ne 0){throw 'pip check failed.'}
          $tests=@(
            @('scripts\reconcile_v213_order_evidence.py','--self-test'),
            @('scripts\build_v213_scheduled_top20_report.py','--self-test'),
            @('scripts\audit_v213_bilingual_public_fields.py'),
            @('scripts\v213_local_llm_gateway.py','--self-test'),
            @('scripts\adapters\nasdaq_symbol_directory.py'),
            @('scripts\v213_source_federation.py','--self-test'),
            @('scripts\v213_source_federation_gate.py','--self-test'),
            @('scripts\v213_apply_diversified_operationalization.py','--self-test'),
            @('scripts\v213_build_v21_public_snapshot.py','--self-test'),
            @('scripts\v213_methodology_and_source_audit.py')
          )
          foreach($test in $tests){
            & $env:PROJECT_PYTHON @test
            if($LASTEXITCODE -ne 0){throw "Python validation failed: $($test -join ' ')"}
          }
          & $env:PROJECT_PYTHON -m compileall -q scripts
          if($LASTEXITCODE -ne 0){throw 'Python compileall failed.'}

      - name: Typecheck and test Worker
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\resolve_node.ps1 -MinimumVersion 22.0.0
          Push-Location cloud
          try {
            npm.cmd ci --ignore-scripts --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'npm ci failed.'}
            npm.cmd run typecheck
            if($LASTEXITCODE -ne 0){throw 'TypeScript typecheck failed.'}
            npm.cmd test
            if($LASTEXITCODE -ne 0){throw 'Vitest failed.'}
          } finally { Pop-Location }

      - name: Parse PowerShell and run activation/bridge self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(
            'run-v213-local.ps1',
            'run-v213-local-llm-bridge.ps1',
            'activate-v213-seven-field-schedule.ps1',
            'activate-v213-seven-field-schedule-core.ps1',
            'activate-v213-diversified-schedule.ps1',
            'sync-v213-top20-report.ps1',
            'install-v213-runtime.ps1',
            'register-v213-refresh-tasks.ps1'
          )
          foreach($path in $paths){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Out-String|Write-Host;throw "$path pwsh parser errors"}
          }
          $probe=Join-Path $env:RUNNER_TEMP 'v213-ps51-parse.ps1'
          @'
          param([string[]]$Paths)
          $ErrorActionPreference='Stop'
          foreach($path in $Paths){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Out-String|Write-Host;throw "$path Windows PowerShell parser errors"}
          }
          '@ | Set-Content $probe -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $probe -Paths $paths
          if($LASTEXITCODE -ne 0){throw 'Windows PowerShell 5.1 parser gate failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\activate-v213-seven-field-schedule.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Diversified activation preflight self-test failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\activate-v213-seven-field-schedule-core.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Isolated Wrangler JSON stdout/stderr capture self-test failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\run-v213-local-llm-bridge.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw 'StrictMode-safe v2.1.3 bridge health-schema self-test failed.'}

      - name: Audit diversified methodology, live-source and observability contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $launcher=Get-Content launcher\InvestorIntelligenceLauncher.cs -Raw -Encoding utf8
          $refresh=Get-Content run-v213-local.ps1 -Raw -Encoding utf8
          $bridge=Get-Content run-v213-local-llm-bridge.ps1 -Raw -Encoding utf8
          $activation=Get-Content activate-v213-seven-field-schedule.ps1 -Raw -Encoding utf8
          $activationCore=Get-Content activate-v213-seven-field-schedule-core.ps1 -Raw -Encoding utf8
          $gateway=Get-Content scripts\v213_local_llm_gateway.py -Raw -Encoding utf8
          $federator=Get-Content scripts\v213_source_federation.py -Raw -Encoding utf8
          $federationGate=Get-Content scripts\v213_source_federation_gate.py -Raw -Encoding utf8
          $scorer=Get-Content scripts\v213_apply_diversified_operationalization.py -Raw -Encoding utf8
          foreach($needle in @(
            'LOG_MODE=LIVE_CHILD_FILE_TAIL','ANONYMOUS_STDOUT_PIPES=FALSE',
            'RAW_OUTPUT_FINAL_DRAIN=COMPLETE','FileShare.ReadWrite | FileShare.Delete',
            'PIPE_HOLD_PARENT_EXIT_TEST=PASS','ModelSelect-R43',
            'RVN-Q6_K-multilingual-mtp','v213-model-selection.json',
            '--model-selection-self-test','LastPowerShellLiveLine'
          )){
            if(-not $launcher.Contains($needle)){throw "Launcher contract missing: $needle"}
          }
          if($launcher.Contains('RedirectStandardOutput = true') -or $launcher.Contains('BeginOutputReadLine')){
            throw 'Launcher regressed to anonymous redirected stdout pipes.'
          }
          foreach($stage in 1..10){
            if($refresh -notmatch ("Stage\s+"+$stage+"\s+10")){throw "Refresh stage marker missing: $stage/10"}
          }
          foreach($needle in @(
            'v213_source_federation.py','v213_source_federation_gate.py',
            'v213_apply_diversified_operationalization.py','v213_build_v21_public_snapshot.py',
            'system-operationalization-v2.1.3-diversified','Yahoo is T3 seed only'
          )){
            if(-not $refresh.Contains($needle)){throw "Ten-stage refresh contract missing: $needle"}
          }
          foreach($needle in @(
            'Start-HealthyQuickTunnel','--protocol','http2','Resolve-Model',
            'selected_model_verified=true','selected_model_available','health_schema_version',
            'Resolve-AvailableGatewayPort','strictmode_missing_property_safe=true',
            'Wait-LocalGatewayHealth','Test-InvestorGatewayProcess'
          )){
            if(-not $bridge.Contains($needle)){throw "Selected-model bridge contract missing: $needle"}
          }
          foreach($needle in @(
            'V213_DIVERSIFIED_SOURCE_PREFLIGHT','source_federation_sha256',
            'system-operationalization-v2.1.3-diversified',
            'activate-v213-seven-field-schedule-core.ps1'
          )){
            if(-not $activation.Contains($needle)){throw "Canonical activation source gate missing: $needle"}
          }
          foreach($needle in @(
            'Invoke-NativeCapture','RedirectStandardOutput=$true','RedirectStandardError=$true',
            'V213_ACTIVATION_JSON_CAPTURE_SELF_TEST','V213_SELECTED_MODEL_PREFLIGHT',
            'wrangler_json_stdout_isolated=$true'
          )){
            if(-not $activationCore.Contains($needle)){throw "Exact rollback core missing: $needle"}
          }
          foreach($needle in @(
            'catalog is an inventory','publisher family','single market-data family',
            'severe','v2.1.3-evidence-standard-v3'
          )){
            if(-not $gateway.Contains($needle)){throw "Gateway methodology directive missing: $needle"}
          }
          foreach($needle in @(
            'world_bank_indicators','bls_public_data','ecb_sdmx','gleif_lei',
            'nasdaq_symbol_directory','yahoo_finance_public_unofficial',
            'catalog_source_count_is_not_live_use'
          )){
            if(-not $federator.Contains($needle)){throw "Live source federation missing: $needle"}
          }
          foreach($needle in @(
            'minimum_official_identity_or_filing_families','concentration_pass',
            'claim_scope_separation_enforced'
          )){
            if(-not $federationGate.Contains($needle)){throw "Source truth gate missing: $needle"}
          }
          foreach($needle in @(
            '"chokepoint": 0.0','"replacement_friction": 0.0',
            'min(old_valuation, 3.75)','CATALOG_COUNT = 101',
            'issuer_financial_claim_has_single_primary_family'
          )){
            if(-not $scorer.Contains($needle)){throw "Diversified scorer missing: $needle"}
          }
          $catalog=Get-Content config\authoritative-source-catalog.json -Raw -Encoding utf8|ConvertFrom-Json
          if([int]$catalog.catalog_source_count_snapshot -ne 101){throw 'Reviewed catalog count must be 101.'}
          Write-Host 'V213_DIVERSIFIED_METHODOLOGY_SOURCE_FEDERATION_AND_OBSERVABILITY = PASS'

      - name: Integration-test exact-model gateway with occupied legacy port
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $model='RVN-Q6_K-multilingual-mtp'
          function Test-PortFree([int]$Port){
            $listener=$null
            try{$listener=[Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback,$Port);$listener.Start();return $true}
            catch{return $false}
            finally{if($listener){try{$listener.Stop()}catch{}}}
          }
          $llamaPort=0;$requestedGatewayPort=0
          for($candidate=28130;$candidate -le 28280;$candidate+=3){
            if((Test-PortFree $candidate)-and(Test-PortFree ($candidate+1))-and(Test-PortFree ($candidate+2))){
              $llamaPort=$candidate;$requestedGatewayPort=$candidate+1;break
            }
          }
          if($llamaPort -eq 0){throw 'No free CI integration port triplet was found.'}
          $isolatedLocal=Join-Path $env:RUNNER_TEMP ('ii-v213-localappdata-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $isolatedLocal|Out-Null
          $oldLocalAppData=$env:LOCALAPPDATA
          $fakeLlama=$null;$legacyGateway=$null;$startedGatewayPid=0;$serversReady=$false
          try{
            $fakeLlama=Start-Process -FilePath $env:PROJECT_PYTHON -ArgumentList @(
              'scripts\v213_fake_llama_for_ci.py','--port',[string]$llamaPort,'--model',$model,'--mode','llama'
            ) -WorkingDirectory $PWD.Path -PassThru -WindowStyle Hidden
            $legacyGateway=Start-Process -FilePath $env:PROJECT_PYTHON -ArgumentList @(
              'scripts\v213_fake_llama_for_ci.py','--port',[string]$requestedGatewayPort,'--mode','legacy-gateway'
            ) -WorkingDirectory $PWD.Path -PassThru -WindowStyle Hidden
            $deadline=(Get-Date).AddSeconds(15)
            do{
              try{
                $llamaHealth=Invoke-RestMethod -Uri "http://127.0.0.1:$llamaPort/health" -TimeoutSec 2
                $legacyHealth=Invoke-RestMethod -Uri "http://127.0.0.1:$requestedGatewayPort/health" -TimeoutSec 2
                if($llamaHealth.ok -eq $true -and [string]$legacyHealth.service -eq 'v212-local-llm-gateway'){$serversReady=$true;break}
              }catch{}
              Start-Sleep -Milliseconds 300
            }while((Get-Date)-lt$deadline)
            if(-not $serversReady){throw 'CI fake llama/legacy gateway startup timed out.'}
            $env:LOCALAPPDATA=$isolatedLocal
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\run-v213-local-llm-bridge.ps1 `
              -ProjectRoot $PWD.Path -LlamaBaseUrl "http://127.0.0.1:$llamaPort" `
              -GatewayPort $requestedGatewayPort -Model $model -NoTunnel -StopExisting
            if($LASTEXITCODE -ne 0){throw 'Exact-model occupied-port bridge integration failed.'}
            $statePath=Join-Path $isolatedLocal 'InvestorIntelligence\UserData\config\v213-local-model.json'
            $state=Get-Content $statePath -Raw -Encoding utf8|ConvertFrom-Json
            $startedGatewayPid=[int]$state.gateway_pid
            if([string]$state.model -ne $model -or $state.selected_model_verified -ne $true){throw 'Bridge state did not retain the exact selected model.'}
            if([int]$state.gateway_port -eq $requestedGatewayPort){throw 'Bridge reused the occupied legacy gateway port.'}
            $health=Invoke-RestMethod -Uri (([string]$state.gateway_url).TrimEnd('/')+'/health') -TimeoutSec 10
            if([string]$health.service -ne 'v213-local-llm-gateway' -or [int]$health.health_schema_version -lt 2 -or $health.selected_model_available -ne $true -or [string]$health.selected_model -ne $model){
              throw 'Started gateway did not expose the v2.1.3 exact-model health schema.'
            }
            Write-Host "V213_LOCAL_MODEL_OCCUPIED_PORT_INTEGRATION = PASS; requested=$requestedGatewayPort; actual=$($state.gateway_port); model=$model"
          }finally{
            $env:LOCALAPPDATA=$oldLocalAppData
            if($startedGatewayPid -gt 0){Stop-Process -Id $startedGatewayPid -Force -ErrorAction SilentlyContinue}
            if($legacyGateway){Stop-Process -Id $legacyGateway.Id -Force -ErrorAction SilentlyContinue}
            if($fakeLlama){Stop-Process -Id $fakeLlama.Id -Force -ErrorAction SilentlyContinue}
            Remove-Item $isolatedLocal -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Compile and stress-test SourceFederation-R44 EXE launcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc=@(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )|Where-Object{Test-Path $_ -PathType Leaf}|Select-Object -First 1
          if(-not$csc){throw 'csc.exe unavailable.'}
          $source=Get-Content launcher\InvestorIntelligenceLauncher.cs -Raw -Encoding utf8
          $source=$source.Replace('ModelSelect-R43','SourceFederation-R44')
          $source=$source.Replace('本地模型 + 七欄 LINE / Local Model + Seven-Field LINE','本地模型 + 多來源 + 七欄 LINE / Local Model + Multi-Source + Seven-Field LINE')
          $source=$source.Replace('Ready / 就緒\r\nPreferred / 預設首選: ','Ready / 就緒\r\n101-source catalog + live federation | Preferred / 預設首選: ')
          $sourcePath=Join-Path $env:RUNNER_TEMP 'InvestorIntelligenceLauncher.SourceFederation-R44.cs'
          [IO.File]::WriteAllText($sourcePath,$source,[Text.UTF8Encoding]::new($false))
          $exe=Join-Path $env:RUNNER_TEMP 'InvestorIntelligence.exe'
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll "/out:$exe" $sourcePath
          if($LASTEXITCODE -ne 0){throw 'Launcher compilation failed.'}
          foreach($argument in @('--pipe-hold-self-test','--model-selection-self-test')){
            $test=Start-Process -FilePath $exe -ArgumentList $argument -PassThru
            if(-not $test.WaitForExit(20000)){
              Stop-Process -Id $test.Id -Force -ErrorAction SilentlyContinue
              throw "Launcher self-test timed out: $argument"
            }
            if($test.ExitCode -ne 0){throw "Launcher self-test failed ($argument): $($test.ExitCode)"}
          }
          Write-Host 'V213_SOURCE_FEDERATION_R44_LAUNCHER_SELF_TESTS = PASS'
          "V213_EXE=$exe"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "V213_LAUNCHER_SOURCE=$sourcePath"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build one-click all-version ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP "ii-v213-all-$env:GITHUB_RUN_ID"
          $stage=Join-Path $root 'Investor-Intelligence-v2.1.3-All-in-One'
          $current=Join-Path $root 'current-source'
          $versions=Join-Path $stage 'versions'
          New-Item -ItemType Directory -Force -Path $stage,$current,$versions | Out-Null
          $refs=[ordered]@{
            '2.1.0'='bbc2987e54eccef350685447b48e1841c4e5ba19'
            '2.1.1'='22593c82743ad97aff91469ba001700d2a384c48'
            '2.1.2'='1a36935bf8532be074707eeb7f941d8a46be6ca9'
            '2.1.3'=$env:GITHUB_SHA.ToLowerInvariant()
          }
          foreach($entry in $refs.GetEnumerator()|Where-Object{$_.Key -ne '2.1.3'}){
            $out=Join-Path $versions ("Investor-Intelligence-v"+$entry.Key+"-source.zip")
            git archive --format=zip --output="$out" $entry.Value
            if($LASTEXITCODE -ne 0){throw "git archive failed for v$($entry.Key)"}
          }
          $rawCurrent=Join-Path $root 'current-source.raw.zip'
          git archive --format=zip --output="$rawCurrent" $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){throw 'git archive failed for current v2.1.3 source.'}
          Expand-Archive $rawCurrent $current -Force
          Copy-Item $env:V213_LAUNCHER_SOURCE (Join-Path $current 'launcher\InvestorIntelligenceLauncher.cs') -Force
          $currentZip=Join-Path $versions 'Investor-Intelligence-v2.1.3-source.zip'
          Compress-Archive -Path (Join-Path $current '*') -DestinationPath $currentZip -CompressionLevel Optimal
          Copy-Item (Join-Path $current '*') $stage -Recurse -Force
          Copy-Item $env:V213_EXE (Join-Path $stage 'InvestorIntelligence.exe')

          $refsDoc=[ordered]@{
            schema_version=2
            package_version='2.1.3'
            launcher_revision='SourceFederation-R44'
            current_commit=$env:GITHUB_SHA.ToLowerInvariant()
            versions=$refs
            launcher='InvestorIntelligence.exe'
            stable_runtime='%LOCALAPPDATA%\InvestorIntelligence\V213Runtime'
            live_launcher_logs='%LOCALAPPDATA%\InvestorIntelligence\logs\launcher'
            live_refresh_transcripts='%LOCALAPPDATA%\InvestorIntelligence\logs\v213-refresh'
            local_model=[ordered]@{
              preferred_endpoint='http://127.0.0.1:8080/v1'
              supported_loopback_ports=@(8080,7905,14410,8813,8081,8000)
              dynamic_running_llama_port_discovery=$true
              selection_mode='explicit_persisted_exact_model'
              selection_file='%LOCALAPPDATA%\InvestorIntelligence\UserData\config\v213-model-selection.json'
              preferred_model='RVN-Q6_K-multilingual-mtp'
              silent_first_model_fallback=$false
              model_route_probe_required=$true
              health_schema_version=2
              stale_gateway_safe_recovery=$true
              formal_activation_requires_healthy_exact_model_bridge=$true
            }
            source_federation=[ordered]@{
              catalog_count=101
              catalog_is_live_use=$false
              required_global_live_families=@('us_sec','nasdaq','world_bank','us_bls','ecb')
              optional_live_families=@('gleif','alpha_vantage')
              yahoo_role='T3 candidate and market observation only'
              minimum_per_ticker_independent_families=2
              minimum_official_identity_or_filing_families=2
              minimum_ticker_coverage_ratio=0.8
              maximum_single_family_evidence_share=0.65
              unresolved_material_conflicts_allowed=0
            }
            methodology=[ordered]@{
              label='Serenity public-logic high-fidelity reconstruction'
              evidence_standard='serenity-public-logic-evidence-standard-v3'
              scoring_version='system-operationalization-v2.1.3-diversified'
              official_serenity_formula_claimed=$false
              private_process_reproduction_claimed=$false
              keyword_only_chokepoint_points=0
              gross_margin_only_replacement_friction_points=0
              revenue_only_tam_capture_cap_fraction=0.4
              single_market_provider_valuation_cap_fraction=0.25
              severe_primary_thesis_killer_is_asymmetric=$true
            }
            activation=[ordered]@{
              source_federation_preflight_before_mutation=$true
              wrangler_json_stdout_stderr_isolated=$true
              exact_prior_version_rollback=$true
            }
            bilingual_fields='config/field-labels.zh-en.json'
            scheduled_format='v213_seven_fields'
            schedule=@('08:00 Asia/Taipei','21:00 Asia/Taipei')
            local_refresh=@('07:20','20:20')
          }
          $refsDoc|ConvertTo-Json -Depth 10|Set-Content (Join-Path $stage 'VERSION-REFS.json') -Encoding utf8

          $manifest=@()
          Get-ChildItem $stage -File -Recurse|ForEach-Object{
            $manifest += [ordered]@{
              path=$_.FullName.Substring($stage.Length+1).Replace('\','/')
              bytes=$_.Length
              sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            schema_version=1;product='Investor Intelligence';version='2.1.3'
            commit=$env:GITHUB_SHA.ToLowerInvariant();generated_utc=(Get-Date).ToUniversalTime().ToString('o')
            files=$manifest
          }|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'MANIFEST.json') -Encoding utf8
          $sums=Get-ChildItem $stage -File -Recurse|ForEach-Object{
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.FullName.Substring($stage.Length+1).Replace('\','/')
          }
          $sums|Set-Content (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii
          $zip=Join-Path $root 'Investor-Intelligence-v2.1.3-All-in-One-SourceFederation-R44.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaFile=$zip+'.sha256'
          Set-Content $shaFile $sha -Encoding ascii
          "ALL_IN_ONE_ZIP=$zip"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ALL_IN_ONE_SHA_FILE=$shaFile"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ALL_IN_ONE_SHA=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ALL_IN_ONE_SHA256=$sha"

      - name: Verify final package, stable runtime and fail-closed preflights
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Invoke-BoundedExeTest([string]$Path,[string]$Argument,[string]$Label){
            $p=Start-Process -FilePath $Path -ArgumentList $Argument -PassThru
            if(-not $p.WaitForExit(20000)){
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "$Label timed out."
            }
            if($p.ExitCode -ne 0){throw "$Label failed with exit code $($p.ExitCode)."}
          }
          $check=Join-Path $env:RUNNER_TEMP "ii-v213-check-$env:GITHUB_RUN_ID"
          $stable=Join-Path $env:RUNNER_TEMP "ii-v213-stable-$env:GITHUB_RUN_ID"
          Expand-Archive $env:ALL_IN_ONE_ZIP $check
          $refs=Get-Content (Join-Path $check 'VERSION-REFS.json') -Raw -Encoding utf8|ConvertFrom-Json
          if([string]$refs.launcher_revision -ne 'SourceFederation-R44'){throw 'Package launcher revision mismatch.'}
          if([int]$refs.source_federation.catalog_count -ne 101){throw 'Package source catalog count mismatch.'}
          if($refs.methodology.official_serenity_formula_claimed -ne $false){throw 'Package methodology attribution is unsafe.'}
          $launcher=Join-Path $check 'InvestorIntelligence.exe'
          Invoke-BoundedExeTest $launcher '--self-test' 'Packaged EXE self-test'
          Invoke-BoundedExeTest $launcher '--pipe-hold-self-test' 'Packaged EXE inherited-handle self-test'
          Invoke-BoundedExeTest $launcher '--model-selection-self-test' 'Packaged EXE model-selection self-test'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $check 'activate-v213-seven-field-schedule.ps1') -SelfTest
