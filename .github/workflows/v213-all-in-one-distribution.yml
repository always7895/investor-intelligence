name: V2.1.3 All-in-One Distribution

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-intelligence-v213-all-in-one
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'

    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Validate v2.1.3 Python components
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\resolve_python.ps1 -VenvPath .venv-v213-package
          & $env:PROJECT_PYTHON scripts\reconcile_v213_order_evidence.py --self-test
          if($LASTEXITCODE -ne 0){throw 'v2.1.3 order-evidence reconciliation self-test failed.'}
          & $env:PROJECT_PYTHON scripts\build_v213_scheduled_top20_report.py --self-test
          if($LASTEXITCODE -ne 0){throw 'v2.1.3 scheduled report self-test failed.'}
          & $env:PROJECT_PYTHON scripts\audit_v213_bilingual_public_fields.py
          if($LASTEXITCODE -ne 0){throw 'Complete bilingual public-schema audit failed.'}
          & $env:PROJECT_PYTHON -m compileall -q scripts
          if($LASTEXITCODE -ne 0){throw 'Python compileall failed.'}

      - name: Typecheck and test Worker
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\resolve_node.ps1 -MinimumVersion 22.0.0
          Push-Location cloud
          try {
            npm.cmd ci --ignore-scripts --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'npm ci failed.'}
            npm.cmd run typecheck
            if($LASTEXITCODE -ne 0){throw 'TypeScript typecheck failed.'}
            npm.cmd test
            if($LASTEXITCODE -ne 0){throw 'Vitest failed.'}
          } finally { Pop-Location }

      - name: Parse PowerShell and test isolated Wrangler JSON capture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(
            'run-v213-local.ps1',
            'run-v213-local-llm-bridge.ps1',
            'activate-v213-seven-field-schedule.ps1',
            'sync-v213-top20-report.ps1',
            'install-v213-runtime.ps1',
            'register-v213-refresh-tasks.ps1'
          )
          foreach($path in $paths){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Out-String|Write-Host;throw "$path pwsh parser errors"}
          }
          $probe=Join-Path $env:RUNNER_TEMP 'v213-ps51-parse.ps1'
          @'
          param([string[]]$Paths)
          $ErrorActionPreference='Stop'
          foreach($path in $Paths){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Out-String|Write-Host;throw "$path Windows PowerShell parser errors"}
          }
          '@ | Set-Content $probe -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $probe -Paths $paths
          if($LASTEXITCODE -ne 0){throw 'Windows PowerShell 5.1 parser gate failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\activate-v213-seven-field-schedule.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Isolated Wrangler JSON stdout/stderr capture self-test failed.'}

      - name: Audit model selection, live observability and reconciliation contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $launcher=Get-Content launcher\InvestorIntelligenceLauncher.cs -Raw -Encoding utf8
          $refresh=Get-Content run-v213-local.ps1 -Raw -Encoding utf8
          $bridge=Get-Content run-v213-local-llm-bridge.ps1 -Raw -Encoding utf8
          $activation=Get-Content activate-v213-seven-field-schedule.ps1 -Raw -Encoding utf8
          foreach($needle in @(
            'LOG_MODE=LIVE_CHILD_FILE_TAIL',
            'ANONYMOUS_STDOUT_PIPES=FALSE',
            'RAW_OUTPUT_FINAL_DRAIN=COMPLETE',
            'FileShare.ReadWrite | FileShare.Delete',
            'PIPE_HOLD_PARENT_EXIT_TEST=PASS',
            'ModelSelect-R43',
            'RVN-Q6_K-multilingual-mtp',
            'v213-model-selection.json',
            '--model-selection-self-test',
            'LastPowerShellLiveLine'
          )){
            if(-not $launcher.Contains($needle)){throw "Launcher model-selection/pipe-free contract missing: $needle"}
          }
          if($launcher.Contains('RedirectStandardOutput = true') -or $launcher.Contains('BeginOutputReadLine')){
            throw 'Launcher regressed to anonymous redirected stdout pipes.'
          }
          foreach($stage in 1..8){
            if($refresh -notmatch ("Stage\s+"+$stage+"\s+8")){throw "Refresh stage marker missing: $stage/8"}
          }
          foreach($needle in @('reconcile_v213_order_evidence.py','v213_order_evidence_runtime.json','PYTHONUNBUFFERED=''1''')){
            if(-not $refresh.Contains($needle)){throw "Refresh reconciliation/progress contract missing: $needle"}
          }
          foreach($needle in @(
            'Start-HealthyQuickTunnel','quick tunnel attempt','--protocol','http2',
            'Resolve-Model','v213-model-selection.json','Test-SelectedModelRoute',
            'selected_model_verified=true','selected_model_available'
          )){
            if(-not $bridge.Contains($needle)){throw "Selected-model bridge contract missing: $needle"}
          }
          foreach($needle in @(
            'Invoke-NativeCapture','RedirectStandardOutput=$true','RedirectStandardError=$true',
            'V213_ACTIVATION_JSON_CAPTURE_SELF_TEST','V213_SELECTED_MODEL_PREFLIGHT',
            'wrangler_json_stdout_isolated=$true'
          )){
            if(-not $activation.Contains($needle)){throw "Activation JSON/model contract missing: $needle"}
          }
          Write-Host 'V213_MODEL_SELECTION_JSON_CAPTURE_AND_OBSERVABILITY = PASS'

      - name: Compile and stress-test bilingual EXE launcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $csc=@(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )|Where-Object{Test-Path $_ -PathType Leaf}|Select-Object -First 1
          if(-not$csc){throw 'csc.exe unavailable.'}
          $exe=Join-Path $env:RUNNER_TEMP 'InvestorIntelligence.exe'
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll "/out:$exe" launcher\InvestorIntelligenceLauncher.cs
          if($LASTEXITCODE -ne 0){throw 'Launcher compilation failed.'}
          foreach($argument in @('--pipe-hold-self-test','--model-selection-self-test')){
            $test=Start-Process -FilePath $exe -ArgumentList $argument -PassThru
            if(-not $test.WaitForExit(20000)){
              Stop-Process -Id $test.Id -Force -ErrorAction SilentlyContinue
              throw "Launcher self-test timed out: $argument"
            }
            if($test.ExitCode -ne 0){throw "Launcher self-test failed ($argument): $($test.ExitCode)"}
          }
          Write-Host 'V213_LAUNCHER_FILE_CAPTURE_AND_MODEL_SELECTION_SELF_TESTS = PASS'
          "V213_EXE=$exe"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build one-click all-version ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP "ii-v213-all-$env:GITHUB_RUN_ID"
          $stage=Join-Path $root 'Investor-Intelligence-v2.1.3-All-in-One'
          $versions=Join-Path $stage 'versions'
          New-Item -ItemType Directory -Force -Path $stage,$versions | Out-Null

          $refs=[ordered]@{
            '2.1.0'='bbc2987e54eccef350685447b48e1841c4e5ba19'
            '2.1.1'='22593c82743ad97aff91469ba001700d2a384c48'
            '2.1.2'='1a36935bf8532be074707eeb7f941d8a46be6ca9'
            '2.1.3'=$env:GITHUB_SHA.ToLowerInvariant()
          }
          foreach($entry in $refs.GetEnumerator()){
            $out=Join-Path $versions ("Investor-Intelligence-v"+$entry.Key+"-source.zip")
            git archive --format=zip --output="$out" $entry.Value
            if($LASTEXITCODE -ne 0){throw "git archive failed for v$($entry.Key)"}
          }

          Expand-Archive (Join-Path $versions 'Investor-Intelligence-v2.1.3-source.zip') $stage -Force
          Copy-Item $env:V213_EXE (Join-Path $stage 'InvestorIntelligence.exe')

          $refsDoc=[ordered]@{
            schema_version=1
            package_version='2.1.3'
            launcher_revision='ModelSelect-R43'
            current_commit=$env:GITHUB_SHA.ToLowerInvariant()
            versions=$refs
            launcher='InvestorIntelligence.exe'
            stable_runtime='%LOCALAPPDATA%\InvestorIntelligence\V213Runtime'
            live_launcher_logs='%LOCALAPPDATA%\InvestorIntelligence\logs\launcher'
            live_refresh_transcripts='%LOCALAPPDATA%\InvestorIntelligence\logs\v213-refresh'
            local_model=[ordered]@{
              preferred_endpoint='http://127.0.0.1:8080/v1'
              supported_loopback_ports=@(8080,7905,14410,8813,8081,8000)
              dynamic_running_llama_port_discovery=$true
              selection_mode='explicit_persisted_exact_model'
              selection_file='%LOCALAPPDATA%\InvestorIntelligence\UserData\config\v213-model-selection.json'
              preferred_model='RVN-Q6_K-multilingual-mtp'
              silent_first_model_fallback=$false
              model_route_probe_required=$true
              gateway='scripts/v213_local_llm_gateway.py'
              quick_tunnel_retry_attempts=3
              quick_tunnel_protocol='http2'
              formal_activation_requires_healthy_exact_model_bridge=$true
            }
            activation=[ordered]@{
              wrangler_json_stdout_stderr_isolated=$true
              noisy_stderr_json_parser_regression_test=$true
              exact_prior_version_rollback=$true
            }
            order_evidence=[ordered]@{
              historical_baseline='data/bootstrap/v213-r15r-order-baseline.json'
              runtime_reconciliation='scripts/reconcile_v213_order_evidence.py'
              runtime_baseline='data/cache/v213_order_evidence_runtime.json'
              local_model_used_for_order_totals=$false
              numeric_total_order_estimate_prohibited=$true
            }
            bilingual_fields='config/field-labels.zh-en.json'
            bilingual_public_schema_audit='scripts/audit_v213_bilingual_public_fields.py'
            scheduled_format='v213_seven_fields'
            schedule=@('08:00 Asia/Taipei','21:00 Asia/Taipei')
            local_refresh=@('07:20','20:20')
          }
          $refsDoc|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'VERSION-REFS.json') -Encoding utf8

          $manifest=@()
          Get-ChildItem $stage -File -Recurse|ForEach-Object{
            $manifest += [ordered]@{
              path=$_.FullName.Substring($stage.Length+1).Replace('\','/')
              bytes=$_.Length
              sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          [ordered]@{
            schema_version=1
            product='Investor Intelligence'
            version='2.1.3'
            commit=$env:GITHUB_SHA.ToLowerInvariant()
            generated_utc=(Get-Date).ToUniversalTime().ToString('o')
            files=$manifest
          }|ConvertTo-Json -Depth 8|Set-Content (Join-Path $stage 'MANIFEST.json') -Encoding utf8

          $sums=Get-ChildItem $stage -File -Recurse|ForEach-Object{
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.FullName.Substring($stage.Length+1).Replace('\','/')
          }
          $sums|Set-Content (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii

          $zip=Join-Path $root 'Investor-Intelligence-v2.1.3-All-in-One.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaFile=Join-Path $root 'Investor-Intelligence-v2.1.3-All-in-One.zip.sha256'
          Set-Content $shaFile $sha -Encoding ascii
          "ALL_IN_ONE_ZIP=$zip"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ALL_IN_ONE_SHA_FILE=$shaFile"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ALL_IN_ONE_SHA=$sha"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "ALL_IN_ONE_SHA256=$sha"

      - name: Verify final package stable runtime and EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Invoke-BoundedExeTest([string]$Path,[string]$Argument,[string]$Label){
            $p=Start-Process -FilePath $Path -ArgumentList $Argument -PassThru
            if(-not $p.WaitForExit(20000)){
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "$Label timed out."
            }
            if($p.ExitCode -ne 0){throw "$Label failed with exit code $($p.ExitCode)."}
          }
          $check=Join-Path $env:RUNNER_TEMP "ii-v213-check-$env:GITHUB_RUN_ID"
          $stable=Join-Path $env:RUNNER_TEMP "ii-v213-stable-$env:GITHUB_RUN_ID"
          Expand-Archive $env:ALL_IN_ONE_ZIP $check
          $launcher=Join-Path $check 'InvestorIntelligence.exe'
          Invoke-BoundedExeTest $launcher '--self-test' 'Packaged EXE self-test'
          Invoke-BoundedExeTest $launcher '--pipe-hold-self-test' 'Packaged EXE inherited-handle self-test'
          Invoke-BoundedExeTest $launcher '--model-selection-self-test' 'Packaged EXE model-selection self-test'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $check 'activate-v213-seven-field-schedule.ps1') -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Packaged activation JSON-capture self-test failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $check 'install-v213-runtime.ps1') -ProjectRoot $check -RuntimeRoot $stable
          if($LASTEXITCODE -ne 0){throw 'Stable runtime installation smoke test failed.'}
          $stableLauncher=Join-Path $stable 'InvestorIntelligence.exe'
          Invoke-BoundedExeTest $stableLauncher '--self-test' 'Stable runtime EXE self-test'
          Invoke-BoundedExeTest $stableLauncher '--pipe-hold-self-test' 'Stable runtime inherited-handle self-test'
          Invoke-BoundedExeTest $stableLauncher '--model-selection-self-test' 'Stable runtime model-selection self-test'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $stable 'activate-v213-seven-field-schedule.ps1') -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Stable runtime activation JSON-capture self-test failed.'}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $stable 'register-v213-refresh-tasks.ps1') -RuntimeRoot $stable -ValidateOnly
          if($LASTEXITCODE -ne 0){throw 'Refresh-task non-mutating validation failed.'}
          Write-Host 'INVESTOR_INTELLIGENCE_V213_STABLE_RUNTIME_MODEL_SELECTION_AND_JSON_CAPTURE = PASS'

      - name: Upload one-click package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Investor-Intelligence-v2.1.3-All-in-One
          path: |
            ${{ env.ALL_IN_ONE_ZIP }}
            ${{ env.ALL_IN_ONE_SHA_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## Investor Intelligence v2.1.3 All-in-One
          - Worker typecheck/tests: PASS
          - v2.1.3 order-evidence membership reconciliation self-test: PASS
          - v2.1.3 scheduled report self-test: PASS
          - complete bilingual current-public-schema audit: PASS
          - pwsh + Windows PowerShell 5.1 parser: PASS
          - Wrangler JSON stdout isolated from noisy stderr: PASS
          - live launcher log + eight-stage refresh observability: PASS
          - anonymous stdout/stderr pipes removed from launcher: PASS
          - inherited-handle bounded child-file capture: PASS
          - explicit persistent local-model selector: PASS
          - preferred model: RVN-Q6_K-multilingual-mtp
          - silent first-model fallback removed: PASS
          - selected model catalog match + minimal route probe + tunnel health binding: PASS
          - EXE launcher / stable-runtime copy: PASS
          - local refresh task action non-mutating validation: PASS
          - v2.1.0 / v2.1.1 / v2.1.2 / v2.1.3 source ZIPs: included
          - one-click outer ZIP SHA-256: ``$env:ALL_IN_ONE_SHA``
          - Production deployment: NOT performed by packaging workflow
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
