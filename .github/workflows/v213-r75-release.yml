name: V2.1.3 R75 Authoritative Windows Release

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Run Windows regression only; never package or qualify a release'
        type: boolean
        default: false
  push:
    branches:
      - 'pi/**'
      - development/v2.1.3-serenity-public-logic-fidelity

permissions:
  contents: read

concurrency:
  group: investor-intelligence-v213-r75-reviewed-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'always7895/investor-intelligence' && github.actor == 'always7895'
    runs-on: [self-hosted, Windows, X64, investor-intelligence-reviewed]
    timeout-minutes: 360
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      DELIVERY_ENABLED: 'false'
      LINE_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      LINE_ACCESS_MODE: 'disabled'
      PUBLIC_KV_SYNC_ENABLED: 'false'
      ACTIVE_SCAN_APPLY_CHANGES: 'false'
      CLOUD_INFERENCE_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      PRODUCTION_MUTATION_BY_CI: 'false'

    steps:
      - name: Check out exact immutable candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne '${{ github.sha }}'.ToLowerInvariant()) { throw "Checkout mismatch: $actual" }
          if (@(git status --porcelain).Count -ne 0) { throw 'Authoritative checkout is not clean.' }
          "R75_SOURCE_COMMIT=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run source-bound Windows validation only
        if: inputs.validation_only == true
        shell: pwsh
        run: |
          .\scripts\ci_v213_r75_validate.ps1 -ProjectRoot $PWD.Path -SkipLiveRefresh
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression failed.' }
          'Windows regression only; live_refresh=false; release_qualified=false; no package or Production mutation.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Preserve the historical Named Tunnel lane. All current candidates use
      # the receipt-bound FREE_RELAY packager with extracted ZIP/install tests.
      # The legacy generic packager remains manually available, never automatic.
      - name: Run R75 Named Tunnel deployment-hotfix validation
        if: github.ref_name == 'pi/r75-named-tunnel-deployment-hotfix' && inputs.validation_only != true
        shell: pwsh
        run: .\scripts\ci_v213_r75_named_tunnel_validate.ps1 -ProjectRoot $PWD.Path

      - name: Run current R75 release validation
        if: github.ref_name != 'pi/r75-named-tunnel-deployment-hotfix' && inputs.validation_only != true
        shell: pwsh
        run: .\scripts\ci_v213_r75_free_relay_validate.ps1 -ProjectRoot $PWD.Path

      - name: Build and independently verify immutable Named Tunnel deployment hotfix
        if: github.ref_name == 'pi/r75-named-tunnel-deployment-hotfix' && inputs.validation_only != true
        shell: pwsh
        run: ./scripts/ci_v213_r75_named_tunnel_package.ps1

      - name: Build and independently verify current immutable R75 package
        if: github.ref_name != 'pi/r75-named-tunnel-deployment-hotfix' && env.R75_QA_RELEASE_READY == 'true' && inputs.validation_only != true
        shell: pwsh
        run: ./scripts/ci_v213_r75_free_relay_package.ps1

      - name: Require current release qualification
        if: github.ref_name != 'pi/r75-named-tunnel-deployment-hotfix' && inputs.validation_only != true
        shell: pwsh
        run: |
          if ($env:R75_QA_RELEASE_READY -cne 'true' -or -not $env:R75_FREE_RELAY_PACKAGE_ROOT) {
            throw 'Current candidate lacks fresh live evidence or independently verified package.'
          }
          @"
          ## R75 current candidate
          - Exact source: ``$env:R75_SOURCE_COMMIT``
          - Full Windows regression and fresh source-bound live evidence: verified
          - Final ZIP extraction, Worker tests and isolated installer: verified
          - Production mutation by CI: false
          - GitHub Release publication: not performed by this workflow
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Remove ephemeral dependency and generated state
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath cloud\node_modules -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath data\cache -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath reports -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload immutable R75 Named Tunnel hotfix and receipts
        if: success() && github.ref_name == 'pi/r75-named-tunnel-deployment-hotfix' && inputs.validation_only != true
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: Investor-Intelligence-v2.1.3-R75-Named-Tunnel-Hotfix-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ env.R75_NAMED_TUNNEL_PACKAGE_ROOT }}/*.zip
            ${{ env.R75_NAMED_TUNNEL_PACKAGE_ROOT }}/*.sha256
            ${{ env.R75_NAMED_TUNNEL_PACKAGE_ROOT }}/*.json
            ${{ env.R75_NAMED_TUNNEL_PACKAGE_ROOT }}/*.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload current immutable R75 package and receipts
        if: success() && github.ref_name != 'pi/r75-named-tunnel-deployment-hotfix' && env.R75_QA_RELEASE_READY == 'true' && inputs.validation_only != true
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        # Validated final-release candidate evidence only; publication is separate.
        with:
          name: Investor-Intelligence-v2.1.3-R75-Free-Relay-Hotfix-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ env.R75_FREE_RELAY_PACKAGE_ROOT }}/*.zip
            ${{ env.R75_FREE_RELAY_PACKAGE_ROOT }}/*.sha256
            ${{ env.R75_FREE_RELAY_PACKAGE_ROOT }}/*.json
            ${{ env.R75_FREE_RELAY_PACKAGE_ROOT }}/*.txt
          if-no-files-found: error
          retention-days: 1
