name: V2.1.3 R75 Hardening Release

on:
  push:
    branches:
      - development/v2.1.3-r75-hardening
    paths:
      - activate-v213-seven-field-schedule.ps1
      - activate-v213-seven-field-schedule-serenity-latest.ps1
      - activate-v213-diversified-schedule.ps1
      - scripts/run_v213_local_llm_bridge_core.ps1
      - scripts/v212_local_llm_gateway.py
      - scripts/v213_local_llm_gateway.py
      - scripts/ci_v213_r75_validate.ps1
      - scripts/ci_v213_r75_package.ps1
      - cloud/src/v213/activation-v2.ts
      - cloud/test/v213-activation.test.ts
      - register-v213-refresh-tasks.ps1
      - launcher/InvestorIntelligenceLauncher.cs
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: investor-intelligence-v213-r75-hardening-release
  cancel-in-progress: true

jobs:
  validate-package:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 360
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      SOURCE_DIR: ${{ github.workspace }}\r75-${{ github.run_id }}

    steps:
      - name: Checkout exact R75 source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: r75-${{ github.run_id }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Run complete Windows no-mutation R75 validation
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\ci_v213_r75_validate.ps1 -ProjectRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'R75 Windows validation failed.' }

      - name: Build and independently verify R75 package
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\ci_v213_r75_package.ps1 -ProjectRoot $PWD.Path
          if ($LASTEXITCODE -ne 0) { throw 'R75 package build failed.' }

      - name: Upload R75 Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Investor-Intelligence-v2.1.3-R75-Hardening-Final
          path: |
            ${{ env.R75_ZIP }}
            ${{ env.R75_SHA_FILE }}
            ${{ env.R75_VERIFICATION }}
            ${{ env.R75_RECEIPT }}
            ${{ env.R75_VALIDATION }}
          if-no-files-found: error
          retention-days: 30
