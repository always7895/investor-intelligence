name: V2.1.3 Publication-Mode and Spaced-Path Hotfix R1

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-publication-mode-spaced-path-hotfix-r1.yml

permissions:
  contents: write

concurrency:
  group: investor-intelligence-v213-publication-mode-spaced-path-hotfix-r1
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: development/v2.1.3-serenity-public-logic-fidelity
          fetch-depth: 0

      - name: Apply publication-mode-aware activation and quoted gateway launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)

          $newSourceFunction = @'
          function Test-SourceIndependenceDocument {
              param(
                  [object]$Document,
                  [DateTimeOffset]$Now,
                  [object[]]$Top20
              )
              if($null-eq$Document){throw 'The claim-level source-independence document is missing.'}
              if((Get-IntProperty $Document 'schema_version')-lt3-or[string](Get-PropertyValue $Document 'product_version' '')-ne'2.1.3'){
                  throw 'The claim-level source-independence schema/product version is invalid.'
              }
              if([string](Get-PropertyValue $Document 'status' '')-ne'PASS'){
                  throw 'The claim-level source-independence gate is not PASS.'
              }
              $blocking=@(Get-Array (Get-PropertyValue $Document 'blocking_violations' @())|ForEach-Object{[string]$_}|Where-Object{$_})
              $violations=@(Get-Array (Get-PropertyValue $Document 'violations' @())|ForEach-Object{[string]$_}|Where-Object{$_})
              if($blocking.Count-gt0-or$violations.Count-gt0){
                  throw ('The source-independence document contains blocking violations: '+(@($blocking+$violations)|Select-Object -Unique)-join',')
              }
              $stamp=Get-FreshTimestamp $Document 'claim-level source-independence audit' $Now
              $records=@(Get-Array (Get-PropertyValue $Document 'records' @()))
              if($records.Count-ne20){throw 'The claim-level source-independence document must contain exactly 20 records.'}
              if($Top20.Count-ne20){throw 'The diversified Top20 must contain exactly 20 rows.'}
              for($index=0;$index-lt20;$index++){
                  $topTicker=[string](Get-PropertyValue $Top20[$index] 'ticker' '')
                  $sourceTicker=[string](Get-PropertyValue $records[$index] 'ticker' '')
                  if($topTicker-ne$sourceTicker){
                      throw "Top20/source-independence order mismatch at rank $($index+1): $topTicker vs $sourceTicker."
                  }
              }

              $portfolio=Get-PropertyValue $Document 'portfolio' $null
              if($null-eq$portfolio){throw 'The source-independence portfolio summary is missing.'}
              $freshnessAudit=Get-PropertyValue $Document 'freshness_audit' $null
              if($null-eq$freshnessAudit-or[string](Get-PropertyValue $freshnessAudit 'status' '')-ne'PASS'){
                  throw 'The final publication-mode freshness audit is not PASS.'
              }
              $families=Get-IntProperty $portfolio 'independent_source_families'
              $domains=Get-IntProperty $portfolio 'independent_domains'
              $claimFamilies=Get-IntProperty $portfolio 'claim_source_families'
              $claimDomains=Get-IntProperty $portfolio 'claim_source_domains'
              $nonYahoo=Get-DoubleProperty $portfolio 'non_yahoo_market_coverage_ratio'
              $target=Get-DoubleProperty $portfolio 'non_yahoo_market_coverage_target_ratio' $MarketCoverageTarget
              $claimPrimary=Get-DoubleProperty $portfolio 'claim_primary_coverage_ratio'
              $largestFamily=Get-DoubleProperty $portfolio 'maximum_single_family_share' 1.0
              $marketConflicts=Get-IntProperty $portfolio 'market_conflict_ticker_count'
              $marketStatus=[string](Get-PropertyValue $portfolio 'market_corroboration_status' '')
              $marketGlobalBlocker=Get-BooleanProperty $portfolio 'market_corroboration_global_blocker' $true
              $degradations=@(Get-Array (Get-PropertyValue $Document 'degradations' @())|ForEach-Object{[string]$_}|Where-Object{$_})
              $declaredStrict=Get-IntProperty $portfolio 'evidence_qualified_candidate_count' -1
              $declaredLimited=Get-IntProperty $portfolio 'limited_research_candidate_count' -1
              $freshStrict=Get-IntProperty $freshnessAudit 'evidence_qualified_candidate_count' -1
              $freshLimited=Get-IntProperty $freshnessAudit 'limited_research_candidate_count' -1
              if($families-lt3-or$domains-lt3){throw 'Portfolio source-family/domain independence is below 3.'}
              if($claimFamilies-lt1-or$claimDomains-lt1){throw 'Final publication lacks primary company-claim provenance.'}
              if($declaredLimited-eq0-and($claimFamilies-lt2-or$claimDomains-lt2)){
                  throw 'An all-evidence-qualified publication has claim-source independence below 2.'
              }
              if($claimPrimary-lt0.75){throw "Claim-relevant primary-source coverage is below 75% ($claimPrimary)."}
              if($largestFamily-gt0.70){throw "A single source family exceeds the 70% concentration cap ($largestFamily)."}
              if($marketConflicts-ne0){throw "The source-independence document contains $marketConflicts unresolved market-source conflicts."}
              if($declaredStrict-lt0-or$declaredLimited-lt0-or($declaredStrict+$declaredLimited)-ne20){
                  throw 'Portfolio publication-mode candidate counts are invalid.'
              }
              if($freshStrict-ne$declaredStrict-or$freshLimited-ne$declaredLimited){
                  throw 'Freshness-audit publication-mode counts do not match the portfolio.'
              }
              if(-not(Get-BooleanProperty $portfolio 'all_rows_publication_provenance_multi_source')){
                  throw 'At least one final row lacks independent publication provenance.'
              }
              if((Get-IntProperty $portfolio 'limited_rows_high_confidence_eligible_count')-ne0){
                  throw 'A LIMITED research candidate is incorrectly HIGH eligible.'
              }
              if(-not(Get-BooleanProperty $freshnessAudit 'all_tickers_publication_provenance_multi_source')){
                  throw 'The freshness audit does not prove multi-origin publication provenance for all rows.'
              }
              if(-not(Get-BooleanProperty $freshnessAudit 'all_positive_advantages_fresh_multi_source')){
                  throw 'The freshness audit does not prove fresh multi-source support for positive advantages.'
              }

              $marketDegraded=$nonYahoo-lt$target
              if($marketDegraded){
                  if($marketStatus-ne'DEGRADED'){
                      throw 'Low non-Yahoo market coverage is not explicitly labelled DEGRADED.'
                  }
                  if($marketGlobalBlocker){
                      throw 'The market-quality policy incorrectly makes endpoint unavailability a global blocker.'
                  }
                  if($degradations-notcontains$MarketDegradationCode){
                      throw 'The expected non-Yahoo market degradation code is missing.'
                  }
              }
              elseif($marketStatus-ne'CORROBORATED'){
                  throw 'Adequate non-Yahoo market coverage is not labelled CORROBORATED.'
              }

              $notice=Get-PropertyValue $Document 'methodology_notice' $null
              if($null-eq$notice){throw 'The source-independence methodology notice is missing.'}
              if(Get-BooleanProperty $notice 'official_serenity_formula' $true){throw 'The source document claims an official Serenity formula.'}
              if(Get-BooleanProperty $notice 'official_serenity_score' $true){throw 'The source document claims an official Serenity score.'}
              if(Get-BooleanProperty $notice 'private_method_reproduced' $true){throw 'The source document claims private-method reproduction.'}
              if(Get-BooleanProperty $notice 'single_source_inference_allowed' $true){throw 'The source document permits single-source inference.'}
              if(-not(Get-BooleanProperty $notice 'source_diversity_is_not_truth_by_itself')){throw 'The source document does not preserve the source-diversity/ground-truth distinction.'}
              if(-not(Get-BooleanProperty $notice 'official_macro_is_not_company_claim_evidence')){throw 'The source document does not isolate official macro context from company claims.'}
              if(Get-BooleanProperty $notice 'market_corroboration_unavailable_is_global_blocker' $true){throw 'The methodology notice does not preserve graceful market-quality degradation.'}
              if(-not(Get-BooleanProperty $notice 'market_corroboration_required_for_high_confidence_model_inference')){throw 'The methodology notice does not require market corroboration for high-confidence inference.'}
              if(-not(Get-BooleanProperty $notice 'market_corroboration_required_for_uncapped_valuation_factor')){throw 'The methodology notice does not cap valuation confidence without market corroboration.'}
              if(-not(Get-BooleanProperty $notice 'provider_failure_must_be_disclosed')){throw 'The methodology notice permits silent provider failure.'}
              if(-not(Get-BooleanProperty $notice 'market_data_is_not_averaged_into_published_returns')){throw 'The methodology notice permits averaging market sources into published returns.'}
              if(-not(Get-BooleanProperty $notice 'limited_research_candidate_publication_allowed')){throw 'The methodology notice does not preserve the reviewed LIMITED publication mode.'}
              if(Get-BooleanProperty $notice 'limited_research_candidate_is_validated_thesis' $true){throw 'The methodology notice incorrectly treats LIMITED candidates as validated theses.'}
              if(Get-BooleanProperty $notice 'limited_research_candidate_high_confidence_allowed' $true){throw 'The methodology notice incorrectly allows HIGH confidence for LIMITED candidates.'}
              if(-not(Get-BooleanProperty $notice 'limited_candidate_requires_primary_plus_independent_provenance')){throw 'The methodology notice lost the primary-plus-independent-provenance requirement.'}
              $valuationCap=Get-DoubleProperty $notice 'uncorroborated_valuation_factor_max' 3.75

              $eligibleCount=0
              $actualStrict=0
              $actualLimited=0
              $sensitiveFactors=@('demand_wave','chokepoint','pricing_power','replacement_friction','tam_capture')
              $claimDrivenFields=@('architecture','dependency_graph','bottleneck_or_expansion','company_capture','lifecycle')
              for($index=0;$index-lt20;$index++){
                  $record=$records[$index]
                  $eligible=Get-BooleanProperty $record 'eligible_for_high_confidence_model_inference'
                  $metrics=Get-PropertyValue $record 'source_metrics' $null
                  $market=Get-PropertyValue $record 'market_corroboration' $null
                  $logic=Get-PropertyValue $record 'public_logic_state' $null
                  $freshnessState=Get-PropertyValue $record 'freshness_state' $null
                  if($null-eq$metrics-or$null-eq$market-or$null-eq$logic-or$null-eq$freshnessState){
                      throw 'A source record lacks source metrics, market corroboration, public logic or final freshness state.'
                  }
                  if([string](Get-PropertyValue $freshnessState 'status' '')-ne'PASS'){
                      throw 'A source record freshness state is not PASS.'
                  }
                  $mode=[string](Get-PropertyValue $record 'publication_evidence_mode' '')
                  if(-not$mode){$mode=[string](Get-PropertyValue $logic 'publication_evidence_mode' '')}
                  if([string](Get-PropertyValue $freshnessState 'publication_evidence_mode' '')-ne$mode){
                      throw 'A record publication mode does not match its freshness state.'
                  }
                  $recordClaimFamilies=Get-IntProperty $metrics 'claim_relevant_independent_families'
                  $recordClaimDomains=Get-IntProperty $metrics 'claim_relevant_independent_domains'
                  $recordClaimPrimary=Get-IntProperty $metrics 'claim_relevant_primary_sources'
                  $recordDatedRatio=Get-DoubleProperty $metrics 'claim_dated_evidence_ratio'
                  $missing=@(Get-Array (Get-PropertyValue $record 'missing_or_review' @())|ForEach-Object{[string]$_})

                  switch($mode){
                      'EVIDENCE_QUALIFIED' {
                          $actualStrict++
                          if($recordClaimFamilies-lt2){throw 'An EVIDENCE_QUALIFIED record has fewer than two claim-relevant source families.'}
                          if($recordClaimDomains-lt2){throw 'An EVIDENCE_QUALIFIED record has fewer than two claim-relevant source domains.'}
                          if($recordClaimPrimary-lt1){throw 'An EVIDENCE_QUALIFIED record lacks claim-relevant primary evidence.'}
                          if($recordDatedRatio-lt0.8){throw 'An EVIDENCE_QUALIFIED record has insufficient dated claim evidence.'}
                      }
                      'LIMITED_RESEARCH_CANDIDATE' {
                          $actualLimited++
                          if($eligible){throw 'A LIMITED research candidate is incorrectly HIGH eligible.'}
                          if([string](Get-PropertyValue $logic 'model_inference_confidence' '')-ne'LIMITED'){
                              throw 'A LIMITED research candidate does not cap model inference at LIMITED.'
                          }
                          if(Get-BooleanProperty $logic 'validated_company_thesis' $true){
                              throw 'A LIMITED research candidate is incorrectly marked as a validated company thesis.'
                          }
                          if((Get-IntProperty $freshnessState 'publication_provenance_origin_count')-lt2-or(Get-IntProperty $freshnessState 'publication_provenance_domain_count')-lt2){
                              throw 'A LIMITED research candidate lacks two independent publication origins/domains.'
                          }
                          if((Get-IntProperty $freshnessState 'claim_primary_units')-lt1-or$recordClaimPrimary-lt1){
                              throw 'A LIMITED research candidate lacks latest-available primary company evidence.'
                          }
                          if($missing-notcontains'LIMITED_RESEARCH_CANDIDATE'-or$missing-notcontains'INDEPENDENT_CLAIM_CORROBORATION'){
                              throw 'A LIMITED research candidate does not disclose its missing independent claim corroboration.'
                          }
                          $topFactors=Get-PropertyValue $Top20[$index] 'serenity_factors' $null
                          if($null-eq$topFactors){throw 'A LIMITED research candidate lacks Serenity factor fields.'}
                          foreach($factor in $sensitiveFactors){
                              if($null-eq$topFactors.PSObject.Properties[$factor]){throw "A LIMITED research candidate lacks sensitive factor $factor."}
                              if((Get-DoubleProperty $topFactors $factor)-ne0){throw "A LIMITED research candidate retains positive sensitive factor $factor."}
                          }
                          foreach($field in $claimDrivenFields){
                              if([string](Get-PropertyValue $logic $field '')-ne'UNPROVEN'){
                                  throw "A LIMITED research candidate retains claim-driven logic state $field."
                              }
                          }
                      }
                      default { throw "Unknown final publication evidence mode: $mode" }
                  }

                  $providerCount=Get-IntProperty $market 'independent_provider_count'
                  $marketRowStatus=[string](Get-PropertyValue $market 'status' '')
                  if($eligible){
                      $eligibleCount++
                      if($mode-ne'EVIDENCE_QUALIFIED'){throw 'Only EVIDENCE_QUALIFIED records may be HIGH eligible.'}
                      if($recordClaimFamilies-lt2){throw 'A HIGH-eligible record has fewer than two claim-relevant source families.'}
                      if($recordClaimDomains-lt2){throw 'A HIGH-eligible record has fewer than two claim-relevant source domains.'}
                      if($recordClaimPrimary-lt1){throw 'A HIGH-eligible record lacks claim-relevant primary evidence.'}
                      if($recordDatedRatio-lt0.8){throw 'A HIGH-eligible record has insufficient dated claim evidence.'}
                      if($marketRowStatus-ne'CORROBORATED'-or$providerCount-lt1){throw 'A HIGH-eligible record lacks conflict-free non-Yahoo market corroboration.'}
                      if($missing-contains'MARKET_SOURCE_CONFLICT_REVIEW'){throw 'A HIGH-eligible record contains an unresolved market conflict.'}
                  }
                  if($providerCount-lt1){
                      if($eligible){throw 'An uncorroborated record is incorrectly HIGH eligible.'}
                      if($missing-notcontains$MarketMissingCode){throw 'An uncorroborated record does not disclose the missing market cross-check.'}
                      if([string](Get-PropertyValue $logic 'model_inference_confidence' '')-ne'LIMITED'){
                          throw 'An uncorroborated record does not cap model inference at LIMITED.'
                      }
                      $topFactors=Get-PropertyValue $Top20[$index] 'serenity_factors' $null
                      if($null-eq$topFactors-or(Get-DoubleProperty $topFactors 'valuation_expectations')-gt$valuationCap){
                          throw 'An uncorroborated Top20 row exceeds the valuation-confidence cap.'
                      }
                  }
              }
              if($actualStrict-ne$declaredStrict-or$actualLimited-ne$declaredLimited){
                  throw 'Record-level publication modes do not match the portfolio counts.'
              }
              if($eligibleCount-ne(Get-IntProperty $portfolio 'high_confidence_model_inference_eligible_count')){
                  throw 'High-confidence eligible count does not match the record-level truth.'
              }
              return [pscustomobject]@{
                  generated_at=$stamp.generated_at
                  age_seconds=$stamp.age_seconds
                  independent_source_families=$families
                  independent_domains=$domains
                  claim_source_families=$claimFamilies
                  claim_source_domains=$claimDomains
                  non_yahoo_market_coverage_ratio=$nonYahoo
                  non_yahoo_market_coverage_target_ratio=$target
                  claim_primary_coverage_ratio=$claimPrimary
                  maximum_single_family_share=$largestFamily
                  high_confidence_eligible_count=$eligibleCount
                  evidence_qualified_candidate_count=$actualStrict
                  limited_research_candidate_count=$actualLimited
                  fred_macro_status=[string](Get-PropertyValue $portfolio 'fred_macro_status' 'UNKNOWN')
                  market_corroboration_status=$marketStatus
                  market_quality_degraded=$marketDegraded
                  degradations=$degradations
              }
          }
          '@

          $newSelfTest = @'
          if($SelfTest){
              $now=[DateTimeOffset]::UtcNow
              $families=@('us_sec','nasdaq','world_bank','ecb','fred')
              $federation=[pscustomobject]@{
                  schema_version=1;product_version='2.1.3';generated_at=$now.ToString('o')
                  gates=[pscustomobject]@{
                      pass=$true;successful_families=$families;official_successful_families=$families
                      missing_required_families=@();ticker_coverage_ratio=1.0
                      unresolved_material_conflict_count=0;concentration_pass=$true
                      largest_family_share=0.34;yahoo_authoritative=$false
                      catalog_source_count_is_not_live_use=$true
                  }
              }
              $top20=@()
              $sourceRecords=@()
              for($index=1;$index-le20;$index++){
                  $ticker=('T{0:D2}'-f$index)
                  $top20+=[pscustomobject]@{
                      rank=$index;ticker=$ticker
                      serenity_factors=[pscustomobject]@{
                          demand_wave=0;chokepoint=0;pricing_power=0;replacement_friction=0;tam_capture=0;valuation_expectations=3.75
                      }
                  }
                  $sourceRecords+=[pscustomobject]@{
                      rank=$index;ticker=$ticker;evidence_independence_score=70
                      publication_evidence_mode='EVIDENCE_QUALIFIED'
                      eligible_for_high_confidence_model_inference=$false
                      source_metrics=[pscustomobject]@{
                          claim_relevant_independent_families=2
                          claim_relevant_independent_domains=2
                          claim_relevant_primary_sources=1
                          claim_dated_evidence_ratio=1.0
                      }
                      market_corroboration=[pscustomobject]@{status='UNAVAILABLE';independent_provider_count=0}
                      missing_or_review=@($MarketMissingCode)
                      public_logic_state=[pscustomobject]@{
                          model_inference_confidence='LIMITED';publication_evidence_mode='EVIDENCE_QUALIFIED';validated_company_thesis=$false
                          architecture='EVIDENCE_FORMING';dependency_graph='EVIDENCE_FORMING';bottleneck_or_expansion='EVIDENCE_FORMING';company_capture='EVIDENCE_FORMING';lifecycle='EVIDENCE_FORMING'
                      }
                      freshness_state=[pscustomobject]@{
                          status='PASS';publication_evidence_mode='EVIDENCE_QUALIFIED';claim_primary_units=1
                          publication_provenance_origin_count=2;publication_provenance_domain_count=2
                      }
                  }
              }
              $sourceAudit=[pscustomobject]@{
                  schema_version=3;product_version='2.1.3';status='PASS';quality_status='PASS_WITH_DEGRADATION';generated_at=$now.ToString('o')
                  violations=@();blocking_violations=@();degradations=@($MarketDegradationCode)
                  portfolio=[pscustomobject]@{
                      independent_source_families=5;independent_domains=5
                      claim_source_families=2;claim_source_domains=2
                      non_yahoo_market_coverage_ratio=0.0;non_yahoo_market_coverage_target_ratio=$MarketCoverageTarget
                      market_corroboration_status='DEGRADED';market_corroboration_global_blocker=$false
                      claim_primary_coverage_ratio=1.0;maximum_single_family_share=0.4
                      market_conflict_ticker_count=0;high_confidence_model_inference_eligible_count=0
                      evidence_qualified_candidate_count=20;limited_research_candidate_count=0
                      all_rows_publication_provenance_multi_source=$true;limited_rows_high_confidence_eligible_count=0
                      fred_macro_status='LIVE'
                  }
                  freshness_audit=[pscustomobject]@{
                      status='PASS';evidence_qualified_candidate_count=20;limited_research_candidate_count=0
                      all_tickers_publication_provenance_multi_source=$true
                      all_positive_advantages_fresh_multi_source=$true
                  }
                  methodology_notice=[pscustomobject]@{
                      official_serenity_formula=$false;official_serenity_score=$false
                      private_method_reproduced=$false;single_source_inference_allowed=$false
                      source_diversity_is_not_truth_by_itself=$true
                      official_macro_is_not_company_claim_evidence=$true
                      market_corroboration_unavailable_is_global_blocker=$false
                      market_corroboration_required_for_high_confidence_model_inference=$true
                      market_corroboration_required_for_uncapped_valuation_factor=$true
                      uncorroborated_valuation_factor_max=3.75
                      provider_failure_must_be_disclosed=$true
                      market_data_is_not_averaged_into_published_returns=$true
                      limited_research_candidate_publication_allowed=$true
                      limited_research_candidate_is_validated_thesis=$false
                      limited_research_candidate_high_confidence_allowed=$false
                      limited_candidate_requires_primary_plus_independent_provenance=$true
                  }
                  records=$sourceRecords
              }
              [void](Test-FederationDocument $federation $now)
              $sourceResult=Test-SourceIndependenceDocument $sourceAudit $now $top20
              if(-not$sourceResult.market_quality_degraded-or$sourceResult.high_confidence_eligible_count-ne0-or$sourceResult.evidence_qualified_candidate_count-ne20){
                  throw 'Evidence-qualified market-quality degradation self-test failed.'
              }
              $sourceRecords[0].eligible_for_high_confidence_model_inference=$true
              try{[void](Test-SourceIndependenceDocument $sourceAudit $now $top20);throw 'Uncorroborated HIGH inference self-test did not fail closed.'}catch{if($_.Exception.Message-eq'Uncorroborated HIGH inference self-test did not fail closed.'){throw}}
              $sourceRecords[0].eligible_for_high_confidence_model_inference=$false
              $sourceAudit.blocking_violations=@('INSUFFICIENT_CLAIM_PRIMARY_COVERAGE')
              try{[void](Test-SourceIndependenceDocument $sourceAudit $now $top20);throw 'Blocking-violation self-test did not fail closed.'}catch{if($_.Exception.Message-eq'Blocking-violation self-test did not fail closed.'){throw}}
              $sourceAudit.blocking_violations=@()

              $limitedAudit=$sourceAudit|ConvertTo-Json -Depth 40|ConvertFrom-Json
              $limitedTop20=$top20|ConvertTo-Json -Depth 20|ConvertFrom-Json
              foreach($record in @($limitedAudit.records)){
                  $record.publication_evidence_mode='LIMITED_RESEARCH_CANDIDATE'
                  $record.eligible_for_high_confidence_model_inference=$false
                  $record.source_metrics.claim_relevant_independent_families=1
                  $record.source_metrics.claim_relevant_independent_domains=1
                  $record.source_metrics.claim_relevant_primary_sources=1
                  $record.public_logic_state.model_inference_confidence='LIMITED'
                  $record.public_logic_state.publication_evidence_mode='LIMITED_RESEARCH_CANDIDATE'
                  $record.public_logic_state.validated_company_thesis=$false
                  foreach($field in @('architecture','dependency_graph','bottleneck_or_expansion','company_capture','lifecycle')){$record.public_logic_state.$field='UNPROVEN'}
                  $record.freshness_state.publication_evidence_mode='LIMITED_RESEARCH_CANDIDATE'
                  $record.freshness_state.claim_primary_units=1
                  $record.freshness_state.publication_provenance_origin_count=2
                  $record.freshness_state.publication_provenance_domain_count=2
                  $record.missing_or_review=@($MarketMissingCode,'INDEPENDENT_CLAIM_CORROBORATION','LIMITED_RESEARCH_CANDIDATE')
              }
              $limitedAudit.portfolio.claim_source_families=1
              $limitedAudit.portfolio.claim_source_domains=1
              $limitedAudit.portfolio.evidence_qualified_candidate_count=0
              $limitedAudit.portfolio.limited_research_candidate_count=20
              $limitedAudit.portfolio.all_rows_publication_provenance_multi_source=$true
              $limitedAudit.portfolio.limited_rows_high_confidence_eligible_count=0
              $limitedAudit.freshness_audit.evidence_qualified_candidate_count=0
              $limitedAudit.freshness_audit.limited_research_candidate_count=20
              $limitedAudit.freshness_audit.all_tickers_publication_provenance_multi_source=$true
              $limitedAudit.freshness_audit.all_positive_advantages_fresh_multi_source=$true
              $limitedResult=Test-SourceIndependenceDocument $limitedAudit $now @($limitedTop20)
              if($limitedResult.evidence_qualified_candidate_count-ne0-or$limitedResult.limited_research_candidate_count-ne20){
                  throw 'All-LIMITED publication-mode self-test failed.'
              }
              $limitedTop20[0].serenity_factors.demand_wave=1
              try{[void](Test-SourceIndependenceDocument $limitedAudit $now @($limitedTop20));throw 'LIMITED positive-factor self-test did not fail closed.'}catch{if($_.Exception.Message-eq'LIMITED positive-factor self-test did not fail closed.'){throw}}
              $limitedTop20[0].serenity_factors.demand_wave=0
              $limitedAudit.records[0].eligible_for_high_confidence_model_inference=$true
              try{[void](Test-SourceIndependenceDocument $limitedAudit $now @($limitedTop20));throw 'LIMITED HIGH-eligibility self-test did not fail closed.'}catch{if($_.Exception.Message-eq'LIMITED HIGH-eligibility self-test did not fail closed.'){throw}}
              $limitedAudit.records[0].eligible_for_high_confidence_model_inference=$false
              $strictBroken=$sourceAudit|ConvertTo-Json -Depth 40|ConvertFrom-Json
              $strictBroken.records[0].source_metrics.claim_relevant_independent_families=1
              try{[void](Test-SourceIndependenceDocument $strictBroken $now $top20);throw 'Evidence-qualified single-family self-test did not fail closed.'}catch{if($_.Exception.Message-eq'Evidence-qualified single-family self-test did not fail closed.'){throw}}

              $health=[pscustomobject]@{
