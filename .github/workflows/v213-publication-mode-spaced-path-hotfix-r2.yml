          if($LASTEXITCODE-ne0){throw 'Unable to push publication-mode source fix.'}

      - name: Publish failure diagnostic
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $path='delivery/v213-serenity-latest-r70/publication-mode-hotfix-r2-failure.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path)|Out-Null
          [ordered]@{
            schema_version=1
            status='FAIL'
            workflow_run_id='${{ github.run_id }}'
            source_commit='${{ github.sha }}'
            failed_at=(Get-Date).ToUniversalTime().ToString('o')
            production_mutation_by_hotfix=$false
            git_status=@(git status --short)
            changed_files=@(git diff --name-only)
          }|ConvertTo-Json -Depth 6|Set-Content -LiteralPath $path -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git commit -m "diagnostic: publication-mode hotfix R2 failed in run ${{ github.run_id }}"
          git pull --rebase origin development/v2.1.3-serenity-public-logic-fidelity
          git push origin HEAD:development/v2.1.3-serenity-public-logic-fidelity
