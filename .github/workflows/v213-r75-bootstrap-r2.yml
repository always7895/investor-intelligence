name: V2.1.3 R75 Bootstrap R2

on:
  push:
    branches:
      - development/v2.1.3-serenity-public-logic-fidelity
    paths:
      - .github/workflows/v213-r75-bootstrap-r2.yml

permissions:
  contents: write

concurrency:
  group: investor-intelligence-v213-r75-bootstrap-r2
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: development/v2.1.3-serenity-public-logic-fidelity
          fetch-depth: 0
      - name: Resolve repository-managed Python
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\resolve_python.ps1 -VenvPath .venv-v213-r75-bootstrap
          if(-not $env:PROJECT_PYTHON -or -not(Test-Path -LiteralPath $env:PROJECT_PYTHON -PathType Leaf)){throw 'Repository-managed Python resolution failed.'}
          & $env:PROJECT_PYTHON -c "import sys; assert sys.version_info >= (3,10); print(sys.executable)"
          if($LASTEXITCODE-ne0){throw 'Resolved Python execution failed.'}
          Write-Host 'V213_R75_BOOTSTRAP = PASS'
      - name: Publish bootstrap receipt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='delivery/v213-r75/bootstrap-pass.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path)|Out-Null
          [ordered]@{schema_version=1;status='PASS';workflow_run_id='${{ github.run_id }}';source_commit='${{ github.sha }}';repository_managed_python=$true;production_mutation=$false;completed_at=(Get-Date).ToUniversalTime().ToString('o')}|ConvertTo-Json -Depth 4|Set-Content -LiteralPath $path -Encoding utf8
          Remove-Item -LiteralPath '.github/workflows/v213-r75-bootstrap-r2.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: record R75 bootstrap validation'
          git pull --rebase origin development/v2.1.3-serenity-public-logic-fidelity
          git push origin HEAD:development/v2.1.3-serenity-public-logic-fidelity
