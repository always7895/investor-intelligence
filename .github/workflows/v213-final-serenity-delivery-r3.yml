name: V2.1.3 Final Serenity Delivery R3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investor-intelligence-v213-final-serenity-r3
  cancel-in-progress: true

jobs:
  qualify-package-deliver:
    if: github.repository == 'always7895/investor-intelligence'
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 300
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      FREE_ONLY_MODE: 'true'
      PAID_FALLBACK_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      SOURCE_DIR: ${{ github.workspace }}\final-r3-${{ github.run_id }}

    steps:
      - name: Checkout exact source into isolated directory
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: final-r3-${{ github.run_id }}
          fetch-depth: 0
          fetch-tags: true
          clean: true
          persist-credentials: false

      - name: Resolve verified Python and dependencies
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\resolve_python.ps1 -VenvPath .venv-v213-final-r3
          & $env:PROJECT_PYTHON -m pip install --isolated --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple --require-hashes -r requirements-ci.txt
          if($LASTEXITCODE-ne0){throw 'Hash-locked dependency installation failed.'}
          & $env:PROJECT_PYTHON -m pip check
          if($LASTEXITCODE-ne0){throw 'Python dependency check failed.'}

      - name: Static Serenity, latest-data and publication-mode audit
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Join-Path $env:RUNNER_TEMP 'Investor-Intelligence-v2.1.3-Serenity-Release-Audit-v7.json'
          .\scripts\audit_v213_serenity_release_v7.ps1 -ProjectRoot $PWD.Path -OutputPath $receipt
          if($LASTEXITCODE-ne0){throw 'Static Serenity release audit v7 failed.'}
          "R3_STATIC_AUDIT=$receipt"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run complete Windows no-mutation qualification
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        timeout-minutes: 90
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\ci_v213_hotfix6_validate.ps1 -ProjectRoot $PWD.Path
          if($LASTEXITCODE-ne0){throw 'Windows qualification failed.'}

      - name: Audit generated seven-payload snapshot and publication modes
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Join-Path $env:RUNNER_TEMP 'Investor-Intelligence-v2.1.3-Generated-Snapshot-Audit-v5.json'
          .\scripts\audit_v213_generated_snapshot_v5.ps1 -ProjectRoot $PWD.Path -OutputPath $receipt
          if($LASTEXITCODE-ne0){throw 'Generated snapshot audit v5 failed.'}
          "R3_GENERATED_AUDIT=$receipt"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Audit Serenity scoring causality and limited mode
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Join-Path $env:RUNNER_TEMP 'Investor-Intelligence-v2.1.3-Serenity-Scoring-Audit-v2.json'
          .\scripts\audit_v213_serenity_scoring_logic_v2.ps1 -ProjectRoot $PWD.Path -OutputPath $receipt
          if($LASTEXITCODE-ne0){throw 'Serenity scoring audit v2 failed.'}
          "R3_SCORING_AUDIT=$receipt"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile, package and verify one-click delivery
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        timeout-minutes: 60
        run: |
          $ErrorActionPreference='Stop'
          .\scripts\ci_v213_hotfix6_package.ps1 -ProjectRoot $PWD.Path
          if($LASTEXITCODE-ne0){throw 'Final package build failed.'}

      - name: Verify delivery receipts and exact SHA
        shell: pwsh
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in @($env:HF6_ZIP,$env:HF6_SHA_FILE,$env:HF6_VERIFICATION,$env:HF6_VALIDATION,$env:R3_STATIC_AUDIT,$env:R3_GENERATED_AUDIT,$env:R3_SCORING_AUDIT)){
            if(-not(Test-Path -LiteralPath $path -PathType Leaf)){throw "Missing final artifact: $path"}
          }
          $expected=(Get-Content -LiteralPath $env:HF6_SHA_FILE -Raw -Encoding ascii).Trim().Split()[0].ToLowerInvariant()
          $actual=(Get-FileHash -LiteralPath $env:HF6_ZIP -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual-ne$expected-or$actual-ne$env:HF6_SHA){throw 'Final ZIP SHA-256 mismatch.'}
          foreach($path in @($env:HF6_VERIFICATION,$env:HF6_VALIDATION,$env:R3_STATIC_AUDIT,$env:R3_GENERATED_AUDIT,$env:R3_SCORING_AUDIT)){
            $doc=Get-Content -LiteralPath $path -Raw -Encoding utf8|ConvertFrom-Json
            if([string]$doc.status-ne'PASS'){throw "Receipt is not PASS: $path"}
          }
          $refsRoot=Join-Path $env:RUNNER_TEMP ('final-r3-check-'+[guid]::NewGuid().ToString('N'))
          Expand-Archive -LiteralPath $env:HF6_ZIP -DestinationPath $refsRoot
          foreach($required in @(
            'InvestorIntelligence.exe',
            'config\v213-limited-research-candidate-policy.json',
            'config\v213-serenity-methodology-reference-pins.json',
            'docs\V213_SERENITY_RELATED_PROJECTS_REVIEW.zh-TW.md',
            'scripts\audit_v213_serenity_release_v7.ps1',
            'scripts\audit_v213_generated_snapshot_v5.ps1',
            'scripts\audit_v213_serenity_scoring_logic_v2.ps1'
          )){
            if(-not(Test-Path -LiteralPath (Join-Path $refsRoot $required) -PathType Leaf)){throw "Final ZIP missing: $required"}
          }
          Remove-Item -LiteralPath $refsRoot -Recurse -Force
          Write-Host "FINAL_SERENITY_R3_DELIVERY_GATE=PASS; sha256=$actual"

      - name: Upload final verified delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Investor-Intelligence-v2.1.3-Final-Serenity-R3
          path: |
            ${{ env.HF6_ZIP }}
            ${{ env.HF6_SHA_FILE }}
            ${{ env.HF6_VERIFICATION }}
            ${{ env.HF6_VALIDATION }}
            ${{ env.R3_STATIC_AUDIT }}
            ${{ env.R3_GENERATED_AUDIT }}
            ${{ env.R3_SCORING_AUDIT }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## Investor Intelligence v2.1.3 Final Serenity Delivery R3
          - Evidence-qualified positive advantages: require fresh primary + independent non-primary support
          - Limited research candidates: zero sensitive positive factors, LIMITED confidence, not a validated thesis
          - Every final row: primary company evidence + independent publication provenance
          - Yahoo authority: false
          - Market/macro/identity as company evidence: false
          - Latest-data and stale-provider gates: PASS
          - Atomic seven-payload delivery and exact rollback: PASS
          - Production mutation by CI: false
          - ZIP SHA-256: ``$env:HF6_SHA``
          "@|Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8
