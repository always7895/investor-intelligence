name: Phase 3 Authoritative Catalog Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - reconcile/phase3-authoritative-sources-v1
  pull_request:
    branches:
      - hardening/line-public-options-only-v1
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: phase3-authoritative-catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor == 'always7895')
    runs-on: [self-hosted, Windows, X64, investor-intelligence]
    timeout-minutes: 75
    env:
      DELIVERY_ENABLED: 'false'
      LINE_ENABLED: 'false'
      LINE_PUSH_ENABLED: 'false'
      LINE_ACCESS_MODE: 'disabled'
      CURRENT_PUBLIC_DATA_ENABLED: 'false'
      CLOUD_INFERENCE_ENABLED: 'false'
      IBKR_READONLY_ENABLED: 'false'
      ACTIVE_SCAN_APPLY_CHANGES: 'false'
      FREE_ONLY_MODE: 'true'
      PYTHONUTF8: '1'
      EXPECTED_WORKER_LOCK_SHA256: '365ca38feb288fbed62bb5723303186e5e591c44b7d60b242e530db357535a57'
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

    steps:
      - name: Check out exact branch or PR head revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tested revision identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if (-not $env:TARGET_SHA -or $actual -ne $env:TARGET_SHA) {
            throw "Checked-out revision $actual does not match target $env:TARGET_SHA"
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $actual -ne $env:PR_HEAD_SHA) {
            throw "Pull-request audit must test exact head $env:PR_HEAD_SHA, found $actual"
          }

      - name: Resolve deterministic verified Python
        shell: pwsh
        run: .\scripts\resolve_python.ps1 -VenvPath .venv-phase3-authoritative-catalog

      - name: Enforce workflow supply-chain policy
        shell: pwsh
        run: |
          & $env:PROJECT_PYTHON scripts/workflow_supply_chain_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'Workflow supply-chain gate failed.' }

      - name: Install immutable Python dependency lock
        shell: pwsh
        run: |
          & $env:PROJECT_PYTHON -m pip install --isolated --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple --require-hashes -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { throw 'Isolated hash-locked Python dependency installation failed.' }
          & $env:PROJECT_PYTHON -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Installed Python dependency consistency check failed.' }

      - name: Scan current tree for secrets and private data
        shell: pwsh
        run: |
          & $env:PROJECT_PYTHON scripts/security_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Security/privacy gate failed.' }

      - name: Enforce shared LINE public-only boundary
        shell: pwsh
        run: |
          & $env:PROJECT_PYTHON scripts/line_public_boundary_gate.py
          if ($LASTEXITCODE -ne 0) { throw 'LINE/broker separation gate failed.' }

      - name: Validate catalog, configuration and Python compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PROJECT_PYTHON -m compileall -q scripts tests
          if ($LASTEXITCODE -ne 0) { throw 'Python compile gate failed.' }
          & $env:PROJECT_PYTHON -c "import json,pathlib,tomllib; files=list(pathlib.Path('config').rglob('*.json'))+list(pathlib.Path('schemas').rglob('*.json')); [json.loads(p.read_text(encoding='utf-8')) for p in files]; tomllib.loads(pathlib.Path('cloud/wrangler.toml').read_text(encoding='utf-8')); print(f'Validated {len(files)} JSON documents and cloud/wrangler.toml')"
          if ($LASTEXITCODE -ne 0) { throw 'JSON/TOML validation failed.' }
          & $env:PROJECT_PYTHON scripts/authoritative_source_catalog.py
          if ($LASTEXITCODE -ne 0) { throw 'Authoritative source catalog validation failed.' }

      - name: Run complete Python unit suite
        shell: pwsh
        run: |
          & $env:PROJECT_PYTHON -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Python unit suite failed.' }

      - name: Resolve service-accessible Node.js
        shell: pwsh
        run: .\scripts\resolve_node.ps1 -MinimumVersion 22.0.0

      - name: Verify committed Worker dependency lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path cloud/package-lock.json)) { throw 'cloud/package-lock.json is required.' }
          $actual = (Get-FileHash cloud/package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_WORKER_LOCK_SHA256) { throw "Worker lock hash mismatch: $actual" }

      - name: Run immutable Worker gates
        working-directory: cloud
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PROJECT_NPM ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          & $env:PROJECT_NPM run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Worker typecheck failed.' }
          & $env:PROJECT_NPM test
          if ($LASTEXITCODE -ne 0) { throw 'Worker tests failed.' }

      - name: Record exact-head acceptance scope
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          @"
          ## Phase 3 authoritative catalog acceptance
          - Tested revision: `$actual`
          - Catalog source-count cap: none
          - Catalog snapshot: 99 regionally diverse public/free candidates
          - Runtime-enabled sources: 0
          - Automatic activation: false
          - Live source fetch: not performed
          - Credentials installed: none
          - LINE/IBKR/private data path: absent
          - Deployment: not performed
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Remove ephemeral Node working state
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath cloud\node_modules -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath .npm-cache -Recurse -Force -ErrorAction SilentlyContinue
